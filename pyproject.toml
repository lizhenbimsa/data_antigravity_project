[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-process"
version = "3.15.0"
description = "Bank-fintech news -> bank-year panel data pipeline (v3.15.0 — 嵌入 co-primary 双轨切 Qwen/Qwen3-Embedding-8B (硅基流动, 4096 维) ⟂ text-embedding-3-large (3072 维), 零本地模型; built on v3.8.0 取消标题情感轨 (标题并入 full/ctx) + v3.7.0 D-group + v2.3 implementation: papers 组合 + DC3 LLM archive + staleness stage; W&Z 1994/1998 ASQ + Gomber 2018 JMIS + Hassan 2019 QJE 双框架)."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }

# Plan P2-8 (2026-05-09): runtime dependencies 从 requirements.txt 迁入此处.
# Plan P0-1 (2026-05-09): requirements.lock 已生成，作为可重现性基线.
#
# 依赖管理策略:
#   - pyproject.toml [project].dependencies: 范围版本声明 (single source of truth)
#   - requirements.lock: 精确版本锁定 (由 pip-compile 生成，用于 CI 和生产)
#   - requirements.txt: 向后兼容 fallback (与 pyproject.toml 保持同步)
#
# 历史注释 "Runtime deps are managed via requirements.txt for now" 已不再
# 适用 — 在没有 dependencies 段的情况下 ``pip install news_process`` 不会
# 安装任何运行时包, 导致 (a) 项目无法作为真包发布, (b) 新机器复现需手动
# 跑 requirements.txt, (c) lock-file 工具 (uv/pip-compile) 无法基于
# pyproject 解析依赖图.
#
# 版本范围相比原 requirements.txt 已收紧:
#   - transformers<6 → <5  (5.x 与 4.x 有 API 破坏性变更, 实测在 4.41+)
#   - pyarrow<24 → <22  (历史 18→24 的范围跨 6 个大版本过宽)
#   - psutil<8 → <7
# 其它库保持原有范围 (经实测兼容).
#
# requirements.txt 仍然保留作为 pip-only 用户的 fallback 入口, 但 single
# source of truth 已从 requirements.txt 迁至此处. requirements.lock (由
# pip-compile 生成) 是真正的可重现性基线.
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pyarrow>=18.0.0,<22.0.0",
    "ftfy>=6.1.0,<7.0.0",
    "opencc-python-reimplemented>=0.1.7,<0.2.0",
    "selectolax>=0.3.0,<1.0.0",
    "jieba>=0.42.1,<1.0.0",
    "pyahocorasick>=2.0.0,<3.0.0",
    "datasketch>=1.6.0,<2.0.0",
    # v3.7.0 D2 (PR #8.5): stage 18 semantic staleness 的 Faiss IndexFlatIP cosine 检索
    # (与 datasketch MinHash surface 轨互补). 2026-06-13 stage 18 always-on 后为硬运行依赖,
    # 缺包会真崩 (ImportError, 不再优雅跳过). Python 3.13 须 >=1.9.0 (1.7.4 无 cp313 wheel),
    # 区间约束自动解析到 1.14.3.
    "faiss-cpu>=1.7.4,<2.0.0",
    "joblib>=1.3.0,<2.0.0",
    "psutil>=5.9.0,<7.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "PyYAML>=6.0,<7.0",
    "aiohttp>=3.8.0,<4.0.0",
    # requests: 同步 HTTP 调用 (data acquisition / PDF 下载脚本; 与 async aiohttp 共存);
    # anaconda 默认装, 显式声明保 pip-only 兼容 (与 requirements.txt 双向同步).
    "requests>=2.31.0,<3.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.41.0,<5.0.0",
    "sentence-transformers>=5.0.0,<6.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "scipy>=1.14.0,<2.0.0",
    # v3.7.0 D3 (PR #8.5): stage 39f cross_media_alpha 的 Krippendorff α (跨媒体一致性,
    # 与 stage 39a Cohen κ 同 family). 已在 requirements.txt 启用; 此处补齐 SSOT 缺口
    # (否则全新 pip install -e . 缺包 → stage 39f alpha 列全 NaN 空壳).
    "krippendorff>=0.5.0,<1.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "xlsxwriter>=3.1.0,<4.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    # Plan-r3 P2-12: 模糊匹配优先 rapidfuzz (MIT, 活跃维护, C++ 实现);
    # thefuzz + python-Levenshtein 保留作向后兼容 fallback (canonicalization.py
    # try rapidfuzz then fall back).
    "rapidfuzz>=3.0.0,<5.0.0",
    "thefuzz>=0.22.0,<1.0.0",
    "python-Levenshtein>=0.21.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    # v3.2.0 M6 (plan v14 §9.1): Stata 数据导出层 — pandas DataFrame → .dta
    # 用途: stage 46 stata_export 把 panel parquet 转为 Stata 主数据 + variable/value labels.
    # 设计: 不依赖 Stata license, 跨平台 (Windows/macOS/Linux), 支持 .dta 118 格式 (Stata 14+).
    "pyreadstat>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.2,<9.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0,<5.0",
    "linkify-it-py>=2.0,<3.0",
    "sphinx-autodoc-typehints>=2.0,<4.0",
    "sphinx-copybutton>=0.5,<1.0",
    "sphinxcontrib-mermaid>=0.9,<2.0",
]
# V8 P-1 (2026-05-13): 把 pre-commit / pytest / pytest-cov 从 requirements.txt 迁入此处.
# 历史 requirements.txt 把 dev 工具混入 runtime 列表 → pip install -e . 装不到 pytest;
# CLAUDE.md L55 声明 "pyproject 是 single source of truth" 与现实不一致 (P-1 修复).
# 安装方式: pip install -e .[dev]
dev = [
    "pre-commit>=3.0.0,<5.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<6.0.0",
    "pytest-asyncio>=0.20,<2.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
news_process = [
    ".env.example",
    "config/**/*.csv",
    "config/**/*.json",
    "config/**/*.txt",
    "config/**/*.yaml",
    "config/**/*.xlsx",
    "papers_assets/**/*.do",
    "papers_assets/**/*.do.tmpl",
    "papers_assets/**/*.md",
    "papers_assets/**/*.tex",
    "papers_assets/**/*.bib",
    "stata/**/*.do",
    # F-42 (2026-05-16, 计数更新 2026-07-05): 147 个 Stata 模板的真实位置 (papers/_common/stata_templates rglob 实测;
    # 历史: remove-title-track 后 104→95, 后续多轮扩展 (27_tableA12 / 28_tableA13 等) 至 147).
    # 之前 papers_assets/**/*.do.tmpl 仅 1 match; 真模板在 papers/_common/.
    "papers/_common/stata_templates/**/*.tmpl",
    "papers/_common/stata_templates/**/*.md",
    "papers/_common/stata_templates/**/*.do",
    # (F-43 原 docs/**/*.md|tex globs 已移除: docs/ 目录于 commit 1698bda5 整体删除, glob 匹配 0 文件.)
]

[tool.setuptools.packages.find]
where = ["."]
# Only treat the `news_process` namespace and its sub-packages as packages.
# This keeps setuptools from trying to discover unrelated repository folders.
include = ["news_process*"]
exclude = [
    "news_process.tests*",
    "news_process.data*",
    "news_process.data_excel*",
    "news_process.logs*",
    "news_process.models*",
    "news_process.LLMs_for_FinTech_dic*",  # vendored 研究/诊断脚本, 非 pipeline 代码, 不打包 (同 ruff exclude)
]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["news_process/tests"]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
# V4 T1.6: tiered test runs. NOT enforcing --strict-markers yet so that
# legacy ad-hoc @pytest.mark.xxx usage in existing files doesn't break;
# can tighten in a follow-up once all tests are audited.
markers = [
    "fast: quick unit tests (< 1s each); auto-applied to non-integration tests by tests/conftest.py",
    "integration: integration tests (parquet IO, mocked LLM, 1-30s); auto-applied to tests/integration/*",
    "e2e: end-to-end pipeline runs (explicit opt-in via -m e2e; none yet)",
]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning:jieba\\._compat",
    "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('sphinxcontrib'\\)`:DeprecationWarning:pkg_resources",
    "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('zope'\\)`:DeprecationWarning:pkg_resources",
]

[tool.coverage.run]
source = ["news_process"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true

# Plan-r3 P2-13: ruff lint config 落到 pyproject.toml (此前 ci.yml 内联,
# 仅 --select E9,F63,F7,F82,F401, 错过大量正确性问题).
[tool.ruff]
target-version = "py310"
line-length = 120  # 高于 PEP-8 默认 79, 容忍长 docstring 和长 SQL/正则 literal
exclude = [
    "news_process/scripts/audit/_replan_v5_evidence",  # 一次性 LLM 调试探针, 不入 lint
    "scripts/audit/_replan_v5_evidence",
    "**/__pycache__",
    ".pytest_cache",
    ".tmp",
    ".test_tmp",
    "news_process/data",
    "news_process/data_excel",
    "news_process/logs",
    "news_process/models",
    "news_process/papers_assets",
    "news_process/LLMs_for_FinTech_dic",  # 移入 news_process 后仍为 vendored 研究脚本, 不入 lint
    "data",
    "data_excel",
    "logs",
    "models",
    "papers_assets",
    # V8 最终审计 (2026-05-13): 排除仓库根的外部/vendored 目录 — 它们
    # 包含数百 Python 文件 (skill 仓库、文献 OCR 输出、年报转换), 不属于
    # news_process 代码, 不应进入 ruff 范围.  `ruff check .` 之前误报 748
    # 错误, 修复后只检查本项目源码.
    ".gemini",
    "Awesome-Agent-Skills-for-Empirical-Research",
    "literature",
    "annual_reports",
    "build",
    "FinBERT",
    "fastText",
    "LLMs_for_dic",
]

[tool.ruff.lint]
# 启用集合: PEP-8 errors / pyflakes / bugbear / pyupgrade / simplify /
# 模块导入排序 (I). 高风险类 (F601 / B023 / F811 / B033) 已在 P0-2 + P2-13
# 中清零, ruff CI 接入后自动防回归.
select = ["E", "F", "B", "UP", "SIM", "I"]
ignore = [
    "E501",   # line-too-long: 923 处大量来自长 docstring/SQL/正则, 强行折行损伤可读性
    "F541",   # f-string-missing-placeholders: 193 处, 主要是 logger.info(f"==="*70) 之类
    "E402",   # module-import-not-at-top: 138 处, thin shim 与测试 sys.path.insert 后
              # import 是有意设计 (Phase 5a/7a/7b)
    "UP015",  # redundant-open-modes: 69 处, 'r' 显式更可读
    "SIM105", # suppressible-exception: 21 处, 显式 try/except 比 contextlib.suppress 更易读
    "B007",   # unused-loop-control-variable: 24 处, 多见于解构 (for _, row in ...)
    "B905",   # zip-without-explicit-strict: 25 处, 大多 zip() 长度天然相等, 强 strict
              # 反引入新 ValueError; 高风险 zip 已在审查中专门处理
    "B904",   # raise-without-from: 8 处, 大部分是 RuntimeError(f"...{e}") 已含原因
    "SIM117", # multiple-with-statements: 7 处, 嵌套 with 在 IO 场景更清晰
    "UP006",  # non-pep585-annotation: 33 处, 我们当前 typing.Dict/List 与 dict/list 混用,
              # 全切到 PEP-585 留待 v3.0 (Plan-r3 P3-16 与 god-function docstring 同期)
    "UP035",  # deprecated-import: 14 处, 同上
    "UP045",  # non-pep604-annotation-optional: 6 处, 同上
    # V4 T1.4 (2026-05-13): 加入剩余 89 警告中的纯样式类
    "SIM108", # if-else-block-instead-of-if-exp: 21 处, ternary 偏好;
              # 长 if-else 在多分支/含注释的情形下比 ternary 更可读.
    "SIM102", # collapsible-if: 2 处, 嵌套 if 有时更清晰 (尤其当各层独立诊断时).
    "SIM113", # enumerate-for-loop: 4 处, 手动计数器在某些 streaming 场景更明确.
    "SIM118", # in-dict-keys: 4 处剩余, .keys() 显式有时更可读.
    "SIM112", # uncapitalized-environment-variables: 2 处, NEWS_PROCESS_RUN_ID 已全大写;
              # 误报往往是 logger var 名巧合.
    "SIM115", # open-file-with-context-handler: 2 处, 手动审查后保留 (临时打开 + flush).
    "E712",   # true-false-comparison: 10 处, pandas Series 与 == True/False 比较是
              # 必要的 (Boolean indexing 与 .where() 模式); 全切 'is True' 会破坏向量化.
    "E741",   # ambiguous-variable-name (l/I/O): 10 处, 多见于 scripts/audit 一次性脚本
              # 的列表推导 `[l for l in lines]`. v3.0 重构期再统一改名.
    "E701",   # multiple-statements-on-one-line-colon: 4 处, if/try 单语句行格式选择.
    "E702",   # multiple-statements-on-one-line-semicolon: 8 处, 同上.
]

[tool.ruff.lint.per-file-ignores]
# 测试中允许 assert raises Exception 等。
"tests/**/*.py" = ["B017", "B011"]
"news_process/tests/**/*.py" = ["B017", "B011", "F841"]  # F841 in tests: 有意保留以记录 fixture 调用
"news_process/scripts/**/*.py" = ["F841"]  # audit/migration 脚本一次性, 不强求 F841
"news_process/validation/**/*.py" = ["F841"]  # 评估脚本类似

[tool.ruff.lint.isort]
known-first-party = ["news_process"]
