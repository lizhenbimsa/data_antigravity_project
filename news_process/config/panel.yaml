# Phase 4d 拆分 — panel 领域
# 由 scripts/migrate/split_config_yaml.py 生成
# 原始段落归属保持不变; 注释在往返转换中可能被重排 (re-flow)。

# LLM 三模型平局/无效响应处理 (事实政策):
# 概要: NaN-as-not-positive — llm_undefined=1 行在所有二值标记中皆为 False
# (既非正面也非负面也非中性)。真值源以代码为准 (core/schemas.py + golden baseline)。
# 改变此政策需同步修改 ≥6 处消费点 + 重生成 golden.
# 白话: 三个 LLM 投票打平或回了无效答案时, 这篇文章不算正面、不算负面、也不算
#       中性, 而是单独标记为"未定" — 三个比例加起来可以不到 100%。

panel_building:
  # [compute_* 已 always-on] 2026-06-13 起 runner.py 移除了 if PANEL_CFG.get('compute_*')
  # 运行期守卫 (用户决策: 全部启用而非条件启用), 下列 compute_* 步骤结构性常开;
  # 各 flag 仅作记录, 改 false 不再跳过对应步骤。
  # [三轨 (full/ctx/ss) 结构性 always-on] v3.9.0 (2026-06-14): 面板聚合自此对第三轨
  # _ss (银行+金科同句共现轨) 与 full/ctx 并列产出聚合列 (情感/强度/IV 族机械加 _ss
  # 后缀; cell_id D2/D4 分类族有意仅 full/ctx 不分解, 见 encode_collab.py)。ss 是
  # 结构性列扩展, **无独立 compute / enabled 开关** — 只要上游 stage 13 物化了
  # content_ss、stage 21-24 产出了 _ss 文章级列, 面板聚合即自动带上 _ss 聚合列。
  # ss 回退=镜像 ctx (无共现→全文 body), 故与 ctx 共享 n_articles 分母, 无独立计数。
  # 白话: 面板里凡是 full/ctx 两份的指标, 现在多一份 ss (只看银行金科同句的那批文章),
  #       它不是开关项, 是常开的, 跟前两轨一起进面板。
  aggregation_frequency: yearly
  export_stata: true
  compute_attention_index: true      # 6b. 金融科技注意力指数 (三级地理维度)
  # fix(omni-g-papers-misc-09, 2026-06-11) 锚点更正: attention_index = Fang-Peress (2009 JF)
  # extensive 覆盖加权曝光; Hassan (2019 QJE) 仅限 pct/density 归一化度量与 ctx 轨归因
  compute_attention_treatments: true # 6b-2. P2 attention 处理变量 (Fang-Peress 2009 JF; 三轨 full/ctx/ss=互为稳健性, W2)
  compute_dedup_sensitivity: true    # 6b-3. 去重阈值敏感性 (Tetlock 2011 RFS; Hassan 2019 QJE; $0 本地)
  dedup_sensitivity:
    # 严格方向 (Jaccard 阈值, 工作日窗口) 网格; 生产锚点 = (0.80, 5) 即既有
    # attention_* 列本身。宽松方向 (J>0.8 / W<5) 在已去重语料上不可识别
    # (被删原文不可恢复), 模块拒绝并提示需从 data/raw 重跑 stage 00。
    variants:
      - [0.70, 5]
      - [0.75, 5]
      - [0.80, 10]
      - [0.70, 10]
  compute_media_heterogeneity: true  # 6c. 媒体异质性 (四维度: 财经/综合/中央级/其他)
  compute_media_authority_weighting: true  # 3c. 媒体权威性加权 (Holzman et al. 2023, TAR)
  # v6/F4 重构: Bartik IV 修剪至 6 类 (type/scale/fintech/media/geoprox/mauth)
  # 删除 28 类违反外生性公理的 IV (doclen/kwdiv/kwden/mden/sentlen/ttr/excl/
  # title/mcount/author/page/pgnum/half/qtr/month/wkday/breadth/pubfmt/
  # mcentral/mfin/mcomp/mofficial/mmarket/mfreq/mdeep/mdaily/mprov)
  # 学术依据: Goldsmith-Pinkham, Sorkin & Swift (2020, AER) §2
  compute_bartik_iv: true
  # v6/F4-3: Bartik 基期年份控制
  #   'auto' = max(panel.year.min(), 2010)
  #   显式 int = 强制使用该年；强制 < bartik_pre_treatment_cutoff
  bartik_base_year: auto
  # DCEP 沙盒里程碑 — 基期 ≥ 此值触发 RuntimeError，杜绝 post-treatment 基期
  # 白话: Bartik 工具变量的"基期份额"必须取自政策冲击发生之前的年份;
  #       若基期撞到 2019 (数字人民币沙盒) 及以后, 直接报错拒跑, 防止用
  #       "事后"的暴露结构当工具变量导致内生性。
  bartik_pre_treatment_cutoff: 2019
  # IV 扩展族 (2026-06-13, pipeline/panel/iv_extensions.py): 为此前缺 IV 的
  # 论文物化工具变量 — P2 attention (peer LOO + Bartik) / P3 substance /
  # P4 locus / P5 collab / benefit_society (peer+zone LOO) / P10 媒体组合
  # 离散度暴露 / P11 媒体笔法清晰度暴露。
  # 白话: 给每篇论文配一个"与银行自身当期决策无关、但能推动内生变量"的
  #       外生推力 (同类银行的平均水平剔除自己 / 基期媒体组合的固有笔法),
  #       缓解互为因果。引用与识别假设披露见 iv_extensions.py 模块头。
  compute_iv_extensions: true        # 8z. IV 扩展族 (GPSS 2020 AER 等, 见模块头)
  compute_policy_shocks: true             # 7g. DID 政策冲击变量 — DCEP + Fintech Sandbox (Callaway & Sant'Anna 2021, JoE)

