# Phase 4d split — preprocessing domain
# Generated by scripts/migrate/split_config_yaml.py
# Original section ownership preserved; comments may have been re-flowed during round-trip.

preprocessing:
  fasttext_model_path: models/lid.176.bin           # FastText 语言检测模型路径
  text_column: 内容                                  # 主要文本列名
  min_lang_detect_length: 15                        # 语言检测所需的最小文本长度（字符数）
  sheet_name: Sheet1                                 # Excel 工作表名称

  # --- 媒体类型过滤 ---
  # 仅保留的媒体类型列表（按"媒体类型(中文)"字段匹配，不在此列表中的类型将被排除），其他类型还包括APP、微博、政府、网页(U)、新闻通讯社、杂志。
  media_types_to_include:
    - 报纸

  # --- 媒体名称黑名单 ---
  # "媒体(中文)"字段精确匹配以下名称的记录将被删除（剪报服务机构等非原始新闻来源）
  media_names_to_exclude:
    - Mainland Clipping House
    - 中国航务周刊            # NPPA期刊库匹配 — 非报纸类新闻来源
    - 今日消费                # NPPA期刊库匹配 — 非报纸类新闻来源
    - 数字化用户              # NPPA期刊库匹配 — 非报纸类新闻来源
    - 计算机产品与流通         # NPPA期刊库匹配 — 非报纸类新闻来源

  # --- 关键字段缺失值检查 ---
  # 以下字段中任一为空值时，该条记录将被移除
  key_columns_for_na_check:
    - 标题
    - 内容
    - 媒体(中文)
    - 日期

  # --- 保留列 ---
  # 从原始 Excel 文件中仅保留以下列，其余列将被丢弃
  required_columns:
    - docid
    - pubcode
    - 媒体(中文)
    - 媒体类型(中文)
    - 内容
    - 日期
    - 标题
    - 版面
    - 栏名
    - 页号
    - 作者
    - 国家地区/省份
    - 城市

  # --- 媒体地域过滤 ---
  # 仅保留"国家地区/省份"字段匹配以下地区的记录（中国大陆省级行政区划）
  mainland_china_regions:
    - 中国
    - 北京
    - 天津
    - 上海
    - 重庆
    - 河北
    - 山西
    - 辽宁
    - 吉林
    - 黑龙江
    - 江苏
    - 浙江
    - 安徽
    - 福建
    - 江西
    - 山东
    - 河南
    - 湖北
    - 湖南
    - 广东
    - 海南
    - 四川
    - 贵州
    - 云南
    - 陕西
    - 甘肃
    - 青海
    - 内蒙古
    - 广西
    - 西藏
    - 宁夏
    - 新疆

  # --- 标题和内容长度过滤阈值 ---
  title_min_length: 2                               # 标题最少汉字数
  content_min_length: 100                            # 内容最少汉字数
  content_max_length: 10000                          # 内容最多汉字数

  # --- 广告/公告类标题关键词 ---
  # 标题、版面、栏名中包含以下关键词的记录将被移除
  ad_keywords:
    - 广告
    - 公告
    - 公示
    - 启事
    - 通知
    - 通报
    - 声明
    - 信息披露
