  # --- 标题和内容长度过滤阈值 ---
  # 方法论辩护 (2026-06-13 顶刊合规化, 全文核验见
  # scripts/audit/LENGTH_FILTER_JUSTIFICATION_2026-06-13.md):
  # · 下限 100 字 = 测量可靠性论证。词典/LLM 语调均为比值型指标 (命中词数/总词数),
  #   文章过短时分母小 → 比值抽样方差爆炸; 且超短"文章"多为表格/行情/列表残片。
  #   顶刊直接锚点: Tetlock, Saar-Tsechansky & Macskassy (2008, J. Finance,
  #   63(3):1437-1467) 要求每篇 ≥50 英文词, 理由原文 (Columbia 工作论文版 p.9,
  #   非刊印版页码) = "to eliminate stories that contain only tables or lists
  #   ... and to limit the influence of outliers"; 50 英文词的信息量
  #   ≈ 75–100 汉字 (英→中扩张系数 ~1.5–2.0 字/词), 本项目 100 字与之同量级。
  # · 上限 10000 字 = 文体噪声排除论证, **不是**长度偏好。报纸语料中超长"文章"
  #   几乎全是整版转载的年报/招股书/公告正文, 与 ad_keywords 过滤同一动机,
  #   此上限是公告排除规则的长度兜底。注意 TSM 2008 不设上限: 长文对比值型语调的
  #   离群影响靠"三个词数下限过滤 + 语调按上一年均值/标准差标准化"压制; 其 1%
  #   winsorize 的对象是 SUE/分析师预测等**结果变量** (非语调, 非长度) → 故本项目
  #   上限属额外样本选择项 → 须披露 + 敏感性。
  # · 标题下限 2 字 = 数据完整性过滤 (剔除损坏行), 非样本选择, 一句话披露即可。
  # 披露义务: 三阈值均属语料构建样本选择项, 论文 data appendix 须报告长度分布
  # 与各阈值删除量 (生产 run 日志中的 "[长度诊断]" 行即为供数源, 见
  # pipeline/preprocess/load.py::_log_length_filter_diagnostics; ⚠ 该行仅在
  # 冷缓存/重算路径出现 — 增量缓存命中时 worker 被跳过、不产诊断, 全量生产 run
  # 为新语料天然冷缓存), 并对下限 {50,200} / 上限 {5000,20000,不设} 做截断敏感性检验。
  # ⚠ 改动任一阈值 = 语料变更 → stage 21 LLM 缓存 miss → 付费重跑; 改前必读
  # CLAUDE.md "Stage 21 确定性锚点" 段。
  # 白话: 太短的不是新闻是表格碎片, 而且短文章算情绪分天然不准 (顶刊原文就是
  # 这么删的); 太长的不是新闻是整版公告转载。门槛本身不动, 但论文里要画分布图、
  # 报删除量、并证明换个门槛结论不变。
  title_min_length: 2                               # 标题最少汉字数 (数据完整性, 非样本选择)
  content_min_length: 100                            # 内容最少汉字数 (锚点: TSM 2008 JF ≥50 词同量级)
  content_max_length: 10000                          # 内容最多汉字数 (公告转载兜底; TSM 2008 不设上限 → 须敏感性)

