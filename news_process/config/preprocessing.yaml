  # --- 高误伤广告关键词 (标题行尾锚定) ---
  # fix(omni-g-preprocess-05, 2026-06-11): 以下高误伤词在【标题】字段要求行尾锚定
  # (如 '……公告$' 才删), 防止 '央行公告下调存准率' / '上市银行年度报告显示…' 等
  # 真监管新闻被无锚定子串匹配整篇误删 (被删类与监管事件强度相关 → 非随机样本选择);
  # 【版面/栏名】字段仍无锚定全量排除 (付费公告版面行为不变)。
  # 披露: 该排除规则属语料构建样本选择项, 论文 data appendix 须披露。
  # 白话: 下面这几个词只有出现在标题【结尾】才删整篇 (如"××银行配股公告"),
  #       标题中间出现不删 (如"央行公告下调存准率"是真新闻, 不能误杀)。
  # 扩充(2026-06-13, 广告排除过度性复查): 补入与首批 6 词同构误伤模式的 6 词 —
  # 季度报告/半年度报告 (与已锚定"年度报告"同族, '上市银行三季度报告显示…'是真新闻)、
  # 业绩预告 ('多家银行业绩预告亮眼'是真财经新闻, 且与银行业绩强相关→非随机选择)、
  # 信息披露 ('银保监会强化信息披露监管')、公示 ('央行罚单公示')、通告 (同"通报/通知"族)。
  # 二批扩充(2026-06-13 终审对抗复核 P1): 再补 10 个同构词 (27 个中段真新闻标题实测
  # 全被旧规则误杀) — 事先告知书/事先告知函/事先催告书 ('XX银行收到行政处罚事先告知书
  # 拟被罚没2.6亿元'是处罚新闻标准句式)、特别提示 (与"风险提示"同族)、专项报告
  # ('审计署专项报告点名…')、核查意见 ('核查意见出炉 定增过会在望')、权益变动报告书
  # (举牌新闻必含)、广告 ('整治银行理财虚假广告乱象'是监管新闻; 真广告主要由版面/栏名
  # 无锚定兜底)、倡议书 ('倡议书呼吁降低融资成本')、挂失 ('挂失费全面取消'是真实监管事件)。
  # ⚠ 拼写错误孪生词"半年度度报告"刻意不锚定: 仅存在于源数据公告标题, 中段出现于
  # 真新闻概率≈0 (零过度排除风险), 锚定反而让其源公告族经尾缀逃逸 (漏排风险)。
  # 三批扩充(2026-06-13 二批对抗复核净裁决): 遗失 (不锚则'银行卡遗失后挂失费引争议'
  # 类共现句式击杀二批"挂失"的救活, 且其源公告族'遗失声明/启事'全有锚定词兜底,
  # 成本≈0)、股票预案 (银行定增/配股资本补充新闻)、年报摘要+半年报摘要 (财报季解读
  # 新闻; '年报摘要'⊆'半年报摘要'子串关系决定必须**成对**锚定, 单锚后者则虚设)、
  # 转债行情 (银行转债市场新闻; 行情表裸词/行尾仍删)。
  # ⚠ 招募说明书/风险揭示书/草案摘要 刻意不锚定: 中段误伤属基金/券商域一般噪声;
  # 专项说明 同样不锚定 (属审计/问询函域, 中段句式如'会计师事务所专项说明回应问询'
  # 存在但频次极低) — 均与银行监管/业绩事件强度弱相关, 不构成识别意义上的非随机选择。
  # 📋 观察哨(2026-06-13 四轮终审): '分类信息'对已锚定'信息披露'存在理论共现击杀面
  # ('…分类信息披露…'), 但典型语料句式频次证据不足, 暂不锚定; 生产 run 后查
  # _ad_keyword_hit_counts 日志中'分类信息'标题层命中明细, 有真实误杀再启动锚定。
  ad_keywords_title_anchored:
    - 公告
    - 通知
    - 声明
    - 通报
    - 风险提示
    - 年度报告
    - 季度报告
    - 半年度报告
    - 业绩预告
    - 信息披露
    - 公示
    - 通告
    - 广告
    - 特别提示
    - 专项报告
    - 核查意见
    - 权益变动报告书
    - 事先告知书
    - 事先告知函
    - 事先催告书
    - 倡议书
    - 挂失
    - 遗失
    - 股票预案
    - 年报摘要
    - 半年报摘要
    - 转债行情

# ------------------------------------------------------------------------------
# [模块一：新闻预处理模块] 文本标准化配置 (Normalization) - 阶段 00 内部执行
# ------------------------------------------------------------------------------
# 控制文本标准化步骤（繁简转换、HTML清理等）的参数。
normalization:
  opencc_config: t2s                                # OpenCC 转换配置（t2s = 繁体转简体）
  html_removal_length_threshold: 0.7                # HTML标签移除后长度缩减超过此比例时，标记为疑似代码文档
                                                    # 白话: 一篇"文章"剥掉 HTML 标签后字数掉了七成以上, 说明它本来大半是网页代码而非正文, 标记出来。

# ------------------------------------------------------------------------------
# [模块一：新闻预处理模块] 文本去重配置 (Deduplication) - 阶段 00 内部执行
# ------------------------------------------------------------------------------
deduplication:
  jaccard_similarity_threshold: 0.8                 # Jaccard 相似度阈值（超过此值视为重复）
                                                    # 白话: 两篇文章的"字块重合度"超过 80% 就当作同一篇转载稿, 只留一份。
  # ⚠ LSH banding 有效阈值披露 (datasketch==1.10.0, MinHashLSH 默认 FP/FN 权重 (0.5,0.5)):
  #   配置的 0.8 是【概率性近似阈值】非硬阈值。datasketch 对 (threshold=0.8, num_perm=128)
  #   自动分带为 b=9 带 × r=13 行 (仅用 117/128 个排列), 故: 有效 50%-检出阈值 ≈ 0.819,
  #   对真 Jaccard=0.80 的单对检出概率仅 ≈ 0.40, 检出 10%→90% 散布在真 Jaccard∈[0.71,0.89]。
  #   含义: 去重偏保守 (偏向漏删轻度改写的转载, 而非误删独立文章)。⚠ 换 datasketch 版本或
  #   FP/FN 权重会使 b/r 及上述数字漂移 —— 论文/复现披露须连同版本与权重一并钉死。
  minhash_permutations: 128                         # MinHash 排列数（越大越精确，但越慢）
                                                    # 白话: MinHash 是给文章算"指纹"的快速近似法; 128 次哈希是精度和速度的折中。
  ngram_size: 3                                     # 字符级 n-gram 大小（用于 MinHash 特征提取）
                                                    # 白话: 把文章切成每 3 个汉字一片的小碎片来比对重合度。
  parallel_workers: 24                              # 并行工作进程数（MinHash 生成阶段使用）
                                                    # 白话: MinHash 生成是 CPU 密集且各篇独立, 受工作进程数线性约束。
                                                    # 本机 24 物理核 / 32 逻辑核, 旧值 16 闲置 8 个物理核; 提到 24 = 满用物理核,
                                                    # 把 MinHash 阶段提速 ~1.5×。结果与进程数无关 (MinHash 确定, 按 index 收集),
                                                    # 仅影响速度。如在核数更少的机器上跑, 请相应下调此值避免超额订阅。

# ------------------------------------------------------------------------------
# [模块二：新闻筛选模块] 银行新闻分类配置 (Bank News Classification) - 阶段 11
# ------------------------------------------------------------------------------
# 控制银行新闻识别和分类的参数。
# (Phase 4d split 注释残留: 该段配置实际位于 filtering.yaml, 本文件中此处无对应键。)
