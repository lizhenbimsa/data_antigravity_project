# Phase 4d 拆分 — preprocessing 领域
# 由 scripts/migrate/split_config_yaml.py 生成
# 原始段落归属保持不变; 注释在往返转换中可能被重排 (re-flow)。

preprocessing:
  # fix(N7, 2026-07-18): 删除死键 fasttext_model_path / min_lang_detect_length —
  # 语言检测功能已不存在, 全仓 *.py 零消费 (与 models/lid.176.bin 悬空互证), 保留会
  # 误导读者以为存在活跃的语言检测环节。
  text_column: 内容                                  # 主要文本列名
  sheet_name: Sheet1                                 # Excel 工作表名称
  # num_workers: 32                                  # (N12 声明) 加载并行 worker 数; 缺省 =
  #                                                  # min(CPU 核数, 32), 消费点 pipeline/preprocess/runner.py

  # --- 原始样本普查日志 (过滤前, 只读诊断) ---
  # 运行 stage 00 时, 递归扫描 raw_data_dir (含 back/) 全部原始 Excel, 把『最初原始
  # 所有 Excel 表格中的样本数据情况』(总量/来源/年份/媒体类型/地域/缺失/正文长度/精确
  # 去重/逐文件明细) 写进 logs/00_preprocessing.log。纯只读统计, 不产出 parquet、不触发
  # 任何过滤/去重, golden-safe。改 false 可跳过 (会省下一次对全量原始 Excel 的只读扫描)。
  raw_census_logging: true
  raw_census_workers: 10                             # 普查并行只读进程数 (不影响主处理)

  # --- 媒体类型过滤 ---
  # 仅保留的媒体类型列表（按"媒体类型(中文)"字段匹配，不在此列表中的类型将被排除），其他类型还包括APP、微博、政府、网页(U)、新闻通讯社、杂志。
  media_types_to_include:
    - 报纸

  # --- 媒体名称黑名单 ---
  # "媒体(中文)"字段精确匹配以下名称的记录将被删除（剪报服务机构等非原始新闻来源）
  media_names_to_exclude:
    - Mainland Clipping House
    - 中国航务周刊            # NPPA期刊库匹配 — 非报纸类新闻来源
    - 今日消费                # NPPA期刊库匹配 — 非报纸类新闻来源
    - 数字化用户              # NPPA期刊库匹配 — 非报纸类新闻来源
    - 计算机产品与流通         # NPPA期刊库匹配 — 非报纸类新闻来源

  # --- 关键字段缺失值检查 ---
  # 以下字段中任一为空值时，该条记录将被移除
  key_columns_for_na_check:
    - 标题
    - 内容
    - 媒体(中文)
    - 日期

  # --- 保留列 ---
  # 从原始 Excel 文件中仅保留以下列，其余列将被丢弃
  required_columns:
    - docid
    - pubcode
    - 媒体(中文)
    - 媒体类型(中文)
    - 内容
    - 日期
    - 标题
    - 版面
    - 栏名
    - 页号
    - 作者
    - 国家地区/省份
    - 城市

  # --- 媒体地域过滤 ---
  # 仅保留"国家地区/省份"字段匹配以下地区的记录（中国大陆省级行政区划）
