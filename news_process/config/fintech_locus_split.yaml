# news_process/config/fintech_locus_split.yaml
# ──────────────────────────────────────────────────────────────────────────
# WP-R3 创新维度三角化 — fintech_dict.json (607 词, 2026-07-21 换血) 按
# innovation_locus (创新位点) 维度的 Gomber et al. (2018, JMIS)
# enabling-technology vs business-function 二分框架做的词级二分表。
#
# 版本: v2-2026-07-22 (词典 1506→607 换血后增量重建; 用户 2026-07-22 授权
#   全项目 607 化。v1-2026-07-14 为旧 1506 词典基准, 其双编码表冻结不动。)
#
# ⚠ 铁律 (勿违反):
#   1. 本文件【禁止】反向修改 config/fintech_dict.json 本体 —— 该词典已入
#      两个下游 parquet (11_news_bank / 12_news_fintech 及其派生物) 的
#      input_hashes 血缘锚点, 任何字节改动都会级联触发缓存失效与 golden 漂移。
#      本文件只是对既有 607 词的一份【只读派生标注】, 不回写、不增删原词典。
#   2. 消费者范围 = 仅 `news_process/scripts/audit/` 下的 audit-only 脚本
#      (当前唯一消费者: innovation_proxy_triangulation.py)。【严禁】被
#      `pipeline/` 或 `papers/` 任何生产代码 import —— locus proxy 是一条
#      "互为稳健性证据"的旁证轨, 不是面板测度输入, 不产生任何面板 dta 列。
#      (gate 测试 tests/test_wpr3_locus_split.py 断言零 pipeline/papers 引用。)
#
# v2 增量构造方法 (镜像 v1 双人独立编码 + 第三方仲裁协议, 逐条对应 WP-R3 §1):
#   ⓪ 词典 2026-07-21 换血 1506→607: 保留交集 318 词沿用 v1 冻结仲裁终判
#      (final_label 原样, 不重编码); 出局 1188 词随词典移除; 新增 289 词走
#      完整 ①-③ 双编码流程 (yaml v1 铁律"扩表须重复①-③并 bump 版本"兑现)。
#   ① 两名编码员 (子 agent, 互不可见彼此结果) 依据下方逐字摘录的判定框架,
#      各自独立把 289 新词分批 (每批 ≤150 词) 分类为 {tech, func, unassigned};
#   ② 逐词计算观察一致率与 Cohen's κ (名义 3 类, 289 新词上算):
#        观察一致率 po = 0.9066 (262/289)
#        期望一致率 pe = 0.4096
#        Cohen's kappa = 0.8418  (> 0.7 预期门槛; v1 全量基准 κ=0.8375 同带)
#      编码员边际分布: A = {tech: 75, func: 156, unassigned: 58};
#                      B = {tech: 81, func: 164, unassigned: 44}。
#   ③ 27 处分歧词由第三方 (主会话, 既非编码员 A 也非编码员 B) 逐词仲裁,
#      仲裁依据 = 同一份判定框架 + 聚类一致性原则 (同类词同判: 容灾/备份簇
#      6 词按 v1 unassigned 语义"通用 IT 运维词"统一判 unassigned; 品牌名
#      云闪付/银联闪付 镜像掌上生活判 unassigned; 泛化经营/运营簇 5 词镜像
#      一致判 unassigned 的"数字化转型"; 银行业务模式词 生态银行/轻型银行
#      镜像 体验/全景/云/数字化银行 判 func; 文本/语音机器人 镜像 智能语音/
#      流程机器人 判 tech); 逐词仲裁理由见 v2 双编码原始表 (见下)。
#   ④ v2 双编码原始表 (289 新词 A/B 全量标注 + 一致性标志 + 仲裁列) 存档于:
#        config/locus_split_double_coding_2026-07-22.csv
#      (v1 表 config/locus_split_double_coding_2026-07-14.csv 冻结存档不动,
#       318 保留词的编码/仲裁溯源仍在其中。)
#
# 判定框架原文 (逐字摘自 config/prompts/unified_cot.txt 第 55-60 行,
# stage 21 生产 LLM prompt v8 的 innovation_locus 维度定义 — 与生产测度
# 同源, 保证本二分表与面板列 `{model}_locus_{track}` / `avg_locus_prob_score_{track}`
# 语义可比):
#   > ### 维度 2：创新位点 (innovation_locus)
#   > **判定框架**：Gomber, Kauffman, Parker, Weber (2018 JMIS) enabling
#   > technology vs business function；Adner & Kapoor (2010 SMJ) 生态系统
#   > 组件 vs 互补品视角。
#   > - `底层技术`：使能技术层——AI、区块链、大数据、云计算、量子计算、
#   >   生物识别等基础技术能力建设。
#   > - `应用场景`：业务功能层——数字支付、开放银行、智能风控、智能投顾、
#   >   数字信贷等具体业务应用。
#
# 引注: Gomber, P., Kauffman, R. J., Parker, C., & Weber, B. W. (2018).
#   On the fintech revolution: Interpreting the forces of innovation,
#   disruption, and transformation in financial services. Journal of
#   Management Information Systems, 35(1), 220-265.
#   https://doi.org/10.1080/07421222.2018.1440766
#
# unassigned 桶语义: 两可/无法可靠归入 tech 或 func 之一的词 (监管合规/治理
# 类词、通用 IT 运维词、资产/数据类别名词、机构品牌名、抽象经济学理论、
# 传统量化金融方法论、泛化模糊概念等) —— 计算 locus proxy 占比时【剔出】
# 分子分母 (仅在 tech ∪ func 上算 tech 占比), 不当作第三类计入判定。
#
# 覆盖率披露: tech=215 (215/607 = 35.4%) /
#             func=307 (307/607 = 50.6%) /
#             unassigned=85 (85/607 = 14.0%)；
#             并集 = fintech_dict.json 全部 607 词 (零遗漏), 三桶两两不交。
#
# 重新生成: 本文件由人工双编码 + 仲裁产出 (非脚本自动重生); 若
# fintech_dict.json 词典本体未来再扩表, 须对新增词重复①-③流程并 bump 版本号,
# 不得对新增词直接补挂到既有 yaml 而不走双编码。

