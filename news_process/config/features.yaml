# Phase 4d split — features domain
# Generated by scripts/migrate/split_config_yaml.py
# Original section ownership preserved; comments may have been re-flowed during round-trip.

embedding_api:
  model: text-embedding-3-small
  base_url: https://yunwu.ai/v1
  api_key: ${EMBEDDING_API_KEY}

benefit_society:
  max_tokens_per_input: 8191        # 单条输入 token 上限 (text-embedding-3-small 硬性上限)
  max_tokens_per_request: 250000    # 单次 API 请求总 token 上限
  positive_anchors:                 # 预留扩展: 自定义正极句列表 (当前版本未启用, 始终使用模块内置 10 对)
  negative_anchors:                 # 预留扩展: 自定义负极句列表 (当前版本未启用, 始终使用模块内置 10 对)
  cache_embeddings: true            # 缓存 Embedding 为 .npy (降低 API 成本)

