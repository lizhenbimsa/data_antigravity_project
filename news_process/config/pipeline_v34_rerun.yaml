# Pipeline v3.4 全量重跑配置 — M0.5 阶段使用 (per plan v2.x §5.2.2 M0.5 + §5.3).
#
# 该 config 描述 M0.5 把 raw 40 万语料推到 46_panel_yearly_v34.dta 的全部参数。
# **当前状态: skeleton placeholder**。
# M-1 数据现状审计 (G-1) pass 后 + D1 决策点用户确认数据源后, 由 Claude
# (per §14 RACI M0.5 Responsible) 填写 raw 路径 / API endpoint / 凭证 引用,
# 然后才能 invoke ``run_pipeline_v34`` (M0.5 全量重跑 12 wk wall-time, $5,000 LLM cost cap, 见 acceptance.llm_cost_cap_usd).
#
# Schema 设计原则 (与现有 config/{paths,preprocessing,filtering,sentiment,...}.yaml 兼容):
#   - 顶层 key = pipeline 阶段 (raw_ingest / preprocessing / sentiment / panel_build / output);
#   - 各阶段下 sub-key 描述 输入路径 / 处理参数 / 输出路径 / cost-cap;
#   - id 用 core/dag.py STAGES_MAIN 的脚本 stem (此处列举核心生产阶段子集, 非全量;
#     skeleton 占位, 无代码按 id 解析)。

version: 1.0.0  # config schema 版本号 (不是 pipeline 版本号)
plan_anchor: "B_route_master_plan_v2 §5.3"
target_panel: "46_panel_yearly_v34.dta"
status: skeleton  # 占位状态: 待 G-1 审计通过 + D1 确认 raw 数据可获取后才转正

# ----------------------------------------------------------------------------
# M0.5.1 Raw 入库 + 00_preprocessing
# ----------------------------------------------------------------------------
raw_ingest:
  # **TODO (M-1.1 + D1)**: 填写实际 raw 数据物理位置 / API endpoint / DB 连接串.
  #   候选: CNRDS / Wind / 巨灵财经 / 自建爬虫
  source_type: TBD  # 取值之一: filesystem / database / api / multi
  source_path: null  # 绝对路径或数据库连接串
  credentials_ref: null  # 环境变量名 (如 RAW_DATA_API_KEY); 绝不把凭证明文写进本文件
  schema_doc: null  # 原始数据 schema 文档的路径
  cutoff_date: 2024-12-31  # raw 抓取截止日 (per plan §1 "2007-2024 (18 年)")
  expected_record_count: 400000
  expected_bank_count: 500
  expected_year_range: [2007, 2024]

# ----------------------------------------------------------------------------
# M0.5.2 - M0.5.7 sentiment / panel build (referencing existing config/*.yaml)
# ----------------------------------------------------------------------------
stages:
  - id: "00_preprocessing"
    duration_wk: 1   # M0.5.1
    resource: cpu
  - id: "11_news_bank"
    duration_wk: 1   # M0.5.2 part 1
    resource: cpu
  - id: "12_news_fintech"
    duration_wk: 0   # M0.5.2 part 2 (chained with 11)
    resource: cpu
  - id: "14_fintech_intensity"
    duration_wk: 1   # M0.5.3
    resource: "cpu + embedding_api"
  - id: "15_article_policy_alignment"
    duration_wk: 0   # M0.5.3 chained
    resource: cpu
  - id: "21_tone_llms"
    duration_wk: 4   # M0.5.4 — LLM API 调用是整条关键路径的瓶颈
    resource: "llm_api"
    cost_estimate_usd: 2400
    families: [gpt54nano, gemini31111, deepseekv4]
    temperature: 0
    cache_strategy: "hot_first"
  - id: "22_tone_words"
    duration_wk: 1   # M0.5.5
    resource: cpu
  - id: "23_tone_berts"
    duration_wk: 2   # M0.5.6 — GPU 64-core 全量推理
    resource: "gpu_64core"
  - id: "24_herd_decay_processor"
    duration_wk: 1   # M0.5.7
    resource: cpu

# ----------------------------------------------------------------------------
# M0.5.8 sentiment + innovation tracks (32a / 33-39)
# ----------------------------------------------------------------------------
innovation_tracks:
  duration_wk: 2
  resource: "llm_api + gpu"
  cost_estimate_usd: 380   # v3.4.0: +$80 for 第三维度 collab_mode (≈+27% per dim)
  tracks:
    - "32a_innovation_locus_full"
    - "32a_innovation_locus_ctx"
    - "32a_innovation_substantiveness_full"
    - "32a_innovation_substantiveness_ctx"
    # v3.4.0: 第三维度 (Chesbrough 2003 + L&S 2006 SMJ)
    - "32a_innovation_collab_mode_full"
    - "32a_innovation_collab_mode_ctx"

# ----------------------------------------------------------------------------
# M0.5.9 40-46 panel + Stata export (含 v34 column expansion ≤ 5000 cols)
# ----------------------------------------------------------------------------
panel_build:
  duration_wk: 1
  resource: cpu
  output_layout:
    - "data/processed/v34/46_panel_yearly_full.parquet"
    - "data/processed/v34/46_panel_yearly_full.dta"
    - "data/processed/v34/46_panel_yearly_core.dta"      # ≤ 2048 cols (IC 兼容)
    - "data/processed/v34/46_panel_yearly_aux.dta"       # 互补
    - "data/processed/v34/46_panel_yearly_v34_balanced.dta"
    - "data/processed/v34/46_panel_yearly_v34_unbalanced.dta"
    - "data/processed/v34/46_codebook_v34.xlsx"
  panel_col_budget: 5000          # plan §5.3.1 ≤ 5000 cols
  panel_row_budget: [3000, 9000]  # plan §5.3.1 obs range

# ----------------------------------------------------------------------------
# M0.5.10 cross-era prompt 稳健性 (并行 with M0.5.4)
# ----------------------------------------------------------------------------
cross_era_kappa_test:
  duration_wk: 1
  parallel_with: "21_tone_llms"
  cost_estimate_usd: 0  # cache hit (subset of 21_tone)
  segments:
    - { period: "2007-2010", n_sample: 100 }
    - { period: "2011-2014", n_sample: 100 }
    - { period: "2015-2018", n_sample: 100 }
    - { period: "2019-2024", n_sample: 100 }
  acceptance_kappa_min: 0.7
  output: "eval_reports/cross_era_kappa_v34.json"

# ----------------------------------------------------------------------------
# M0.5.11 Financial / market / patent enrichment (并行 with M0.5.4)
# ----------------------------------------------------------------------------
financial_enrichment:
  duration_wk: 2
  parallel_with: "21_tone_llms"
  resource: "cpu + database_query"
  sources:
    - { name: CSMAR, modules: [bank_annual_report, daily_stock_returns, executive_turnover, executive_compensation, capex_it] }
    - { name: Wind, modules: [non_listed_bank_quarterly, daily_market_data] }
    - { name: IncoPat, modules: [fintech_patent_count, patent_citations] }
    - { name: Tonghuashun, modules: [m_and_a_events] }
  outputs:
    - "data/processed/v34/47_financial_outcomes_panel.parquet"
    - "data/processed/v34/48_daily_returns_panel.parquet"
  derived_columns:
    - "ln_fintech_investment"           # P2 outcome.primary
    - "m_and_a_fintech"                 # P2 outcome.secondary
    - "patent_fintech_count"            # P2 outcome.secondary / P4 outcome.secondary
    - "citation_weighted_patent"        # P4 outcome.secondary (Kogan 2017 algo)
    - "long_run_roa_change_3yr"         # P3 outcome.primary (t+3 forward change)
    - "ceo_turnover_2yr"
    - "executive_pay_change"
    - "board_change"
    - "capex_it"                        # P4 mediator.primary
    - "r_and_d_intensity"               # P4 mediator.secondary
    - "ln_fintech_mdna_length"          # P2 mediator.primary (年报 MD&A 章节文本长度)
    - "car_3day_window_tone_shock"      # P1 primary (R10-M01)
    - "car_3day_window_fintech_announcement"   # P3 short_run
    - "car_5day_window"                 # P4 primary
  car_construction:
    benchmark: 中证银行指数
    model: market_adjusted
    estimation_window: "[-250, -10] trading days"
    event_windows:
      - {name: car_3day, range: "[-1, +1]"}
      - {name: car_5day, range: "[-2, +2]"}

# ----------------------------------------------------------------------------
# Acceptance gate G0.5 — cost / quality budget
# ----------------------------------------------------------------------------
acceptance:
  llm_cost_cap_usd: 5000      # v3.4.0 Q-B (2026-05-17): 4200 → 5000 (10% 裕度, 第三维度 collab_mode 推升预估总成本 ~$4,420-4,540; cap 上调到 5000 整数留 ~$460 裕度)
  llm_cost_estimate_usd: 4480 # v3.4.0: 4062 → 4480 (≈+10% per prompt 扩展 + collab_mode 解析)
  panel_reproducibility:
    cache_hot: "panel-hash identical"
    cache_cold: "row diff ≤ 0.1%"
  cross_era_kappa_min: 0.7
  v3_3_0_subset_invariance:
    bank_filter: "target_bank ∈ v3.3.0 84 banks"
    year_filter: "year ∈ {2017, 2018}"
    float_tolerance: 1e-9
    categorical_tolerance: 0

# ----------------------------------------------------------------------------
# 关键路径说明 (per §5.3 R9-M02):
#   子任务顺序耗时合计 = 1+1+1+4+1+2+1+2+1 = 14 周
#   减去 M0.5.10/M0.5.11 并行节省 (在 M0.5.4 等待期内并行, 省 2 周)
#   = 关键路径 12 周
# ----------------------------------------------------------------------------
