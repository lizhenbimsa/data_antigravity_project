# Phase 4d 拆分 — sentiment 领域
# 由 scripts/migrate/split_config_yaml.py 生成
# 原始段落归属保持不变; 注释在往返转换中可能被重排 (re-flow)。

tone_llm_processing:
  enabled: true                                     # [已 always-on] stage 21 不再读此 flag 早退 (2026-06-13 全启用, 对齐 23/24); 仅作记录, 改 false 不会停掉 LLM 情感阶段
  timeout: 600                                      # 请求超时时间（秒）
  connect_timeout: 120                              # TCP/TLS 建连超时（秒）
  sock_connect_timeout: 120                         # socket 建连超时（秒）
  sock_read_timeout: 600                            # 响应读取超时（秒）
  ttl_dns_cache: 300                                # DNS 缓存时间，减少高频验证重复解析
  keepalive_timeout: 600                            # TCP keepalive，降低批量请求握手压力
  max_retries: 80                                   # 最大重试次数（瞬时故障重试上限）
  retry_delay: 10                                   # 2026-06-26 全项目统一: 大模型 API 每次重试固定间隔 10s（flat, 不再指数退避）
  # retry_backoff / retry_backoff_cap 已于 2026-06-26 退役: 大模型 API 重试改为固定 10s 间隔。
  # 原指数退避 min(retry_delay*2**attempt, 600) 会使单个持续失败请求耗尽 80 次重试 ≈ 12h,
  # 且退避期间占住并发槽拖垮整阶段; 见 pipeline/sentiment/tone_llms.py::_compute_retry_sleep。
  sentiment_tie_retry_rounds: 80                    # 用户决策 2026-06-24: verified 轨情感平局/空票在保守降级'中性'前, 绕过缓存重新调实时 API 最多 80 轮(温度=0)打破平局/补齐缺票; 逐轮全局 barrier + 每轮内全部待决(行×轨)×模型票并发; 仅在线模式执行(离线只读), 新票回写缓存; 设 <=0 关闭=直接保守降级
  sentiment_tie_retry_max_retries: 1                # 用户决策 2026-07-25: 平局重试**内层** API 重试上限 (仅此路径; 主跑段仍用 max_retries=80)。外层 80 轮本身就是重试循环, 内层再叠 80 次 = 两层预算相乘 (最坏 6400 次/格); 实测一条 gemini "200 空响应" 病链跑满 80 次 ≈ 1000s, 落进任一轮即让该轮 barrier 墙钟 = 1000s (2026-07-25 两趟实证: 15:25 趟第 1 轮 1033s 独占全段 63%; 18:41 趟连续两轮 1002s/1035s, 按此外推剩余 78 轮 ≈ 22h)。取 1 = "外层拥有重试, 内层单发": 卡住的格总预算 = 80 轮 × 1 = 80 次, 与主跑段等同, 恢复机会不减; 而无病链时单轮墙钟回落到 ~7.6s 地板 (15:25 趟实测), 整段 ≈ 10 分钟。clamp 到 [1, max_retries]
  max_concurrency: 500                              # 2026-07-25 用户决策: 恢复 500 并发 (00:24-00:37 弃票潮经排查为进程连接池坏死所致, 两网关 curl 实测 200 正常, 非 500 并发压垮; 2026-07-21 曾统一 250, 2026-05-14 统一 100)
  temperature: 0.0                                  # 推理温度（0 = 确定性输出）
  random_seed: 42                                   # 随机种子（确保确定性输出）
  force_json: true                                  # 启用 response_format 强制 JSON 输出
  ensemble_method: majority_vote                    # 多模型聚合方法 [仅作记录, 运行时无消费者 —
                                                    #  多数投票逻辑硬编码于 tone_llms 聚合路径; 改此键静默无效 (N8, 2026-07-18)]

  # v3 LLM 模型列表 — 真三家族三角验证 (基于 yunwu /v1/models 实际授权清单)
  #   v3 锁定:  gpt-5.4-nano / gemini-3.1-flash-lite / deepseek-v4-flash
  # 学术叙述: "Three independent LLM families: OpenAI + Google + DeepSeek.
  #           OpenAI + Google 经 yunwu.ai aggregator (OpenAI-compatible /v1/chat/completions, YUNWU_API_KEY);
  #           DeepSeek 经其自有直连端点 (api.deepseek.com, 独立 DEEPSEEK_API_KEY)。"
  models:
    - model_name: gpt-5.4-nano
      short_name: gpt54nano
      description: GPT-5.4 Nano (OpenAI via yunwu)
      base_url: https://yunwu.ai/v1
      api_key: ${YUNWU_API_KEY}                     # v6/N7: 统一 yunwu key
    - model_name: gemini-3.1-flash-lite
      short_name: gemini31
      description: gemini-3.1-flash-lite (Google via yunwu)
      base_url: https://yunwu.ai/v1
      api_key: ${YUNWU_API_KEY}
    - model_name: deepseek-v4-flash
      short_name: deepseekv4                            # v3: 从 claude4h 重命名 (反映真实身份)
      description: DeepSeek V4 Flash (DeepSeek 直连 api.deepseek.com)
      base_url: https://api.deepseek.com
      api_key: ${DEEPSEEK_API_KEY}

  # Unified CoT 提示词模板（精简版）
  # 学术依据 1: De Kok (2025) Appendix C - GLLMs Generate Text Left to Right. 
  #   在 JSON 输出中前置 explanation（如 verification_reason），迫使模型将其作为后续 classification 的上下文，以实现 Zero-shot CoT。
  # 学术依据 2: Generative AI and Finance (Section 3.7.2) - Explanation and evaluation of LLM reasoning.
  #   强制要求模型先生成解释，然后再输出分数或判定结论，从而彻底纠正模型的因果错位（Post-hoc rationalization）与幻觉。
  logit_to_score:
    enabled: true

# ------------------------------------------------------------------------------
# [模块四：评估验证模块] 人工抽样验证配置 (Human Validation) - 阶段 32
# ------------------------------------------------------------------------------
# 根据国际顶级期刊标准，生成人工编码验证样本。
# (Phase 4d split 注释残留: 上方 Human Validation 段配置实际位于 validation.yaml::human_validation;
#  下一行 prompt_template_file 仍属 tone_llm_processing 块, 与本标题无关。)
  prompt_template_file: ./config/prompts/unified_cot.txt
  # remove-title-track: title_sentiment_prompt_template_file 已移除 (标题轨取消)
sentiment_analysis:
  # 启用的情感分析方法（可选: tone_llms, tone_words, tone_berts）
  # ⚠ [已全部 always-on] 2026-06-13 起 stage 21 (tone_llms) / 22 (tone_words) / 23
  #   (tone_berts) 及硬依赖 23 的 stage 24 (跟风衰减) 全部改为无条件 always-on
  #   (core/dag.py 取 StageSpec 默认 always_enabled; llm/words/berts 三谓词均已从
  #   METHOD_TO_PREDICATE 移除)。本列表仅作启用记录: 删任一项或清空本列表都不再
  #   停掉对应阶段。
  # ⚠ [三轨结构性 always-on] v3.9.0 (2026-06-14) 起情感分析全部三轨化 (full / ctx /
  #   ss): 第三轨 _ss (银行+金科同句共现轨) 读 stage 13 物化的 content_ss, 是结构性
  #   always-on 列扩展, **无独立 compute / enabled 开关** — 一旦 content_ss 列存在,
  #   stage 21/22/23/24 即对其逐轨产出 _ss 列, 与 full/ctx 并列。关不掉 (镜像 ctx
  #   回退公理: 无共现→content_ss=全文 body, flag ss_is_fallback=True)。
  # 白话: 又加了第三种"看文本的视角"(只看银行和金科出现在同一句的句子), 它不是
  #       可选项, 是焊死常开的、和前两轨并排。
  # 白话: 以前从清单里去掉某个方法就能关掉对应情感阶段; 现在 LLM / 词典 / BERT
  #       三种方法全部"焊死常开", 这个清单只是留个账, 关不掉它们。
  enabled_methods:
    - tone_llms
    - tone_words
    - tone_berts

  # 词典法情感分析参数
  tone_words:
    pos_threshold: 0.1                              # 正面情感得分阈值
    neg_threshold: -0.1                             # 负面情感得分阈值
                                                    # 白话: 词典法算出的连续得分 > 0.1 判正面、< -0.1 判负面, 夹在中间算中性。
    negation_window: 2                              # 否定词有效作用窗口（向后影响的分词单元数）
                                                    # 白话: 见到"不""没有"等否定词, 把它后面 2 个词里的情感词正负号翻转 ("不 看好" → 负面)。
    adversative_boost: 1.5                          # 转折后权重提升倍数
                                                    # 白话: "虽然…但是…"里"但是"后面的话才是作者真实态度, 情感权重乘 1.5 加重。

    # ── 进程并行 worker 上限 (perf 2026-07-25; 与线程后端逐字节等价, 仅墙钟) ──
    # jieba.cut / 状态机打分是纯 Python 持 GIL, 生产语料下 prefer='threads' 退化为单核
    # (T=2 实测 0.0657 s/篇 → 外推 169,807 篇 ≈3.1 小时)。批数 ≥8 时切 loky 进程后端。
    # ⚠ 严禁 n_jobs=-1: 每 worker 各持一份六部词典 + 注入 44,983 词的 jieba Trie
    #   (~0.6-2 GB/worker), 2026-07-25 实弹在 32 核机上以 -1 起 32 worker 直接 MemoryError。
    # 白话: 用多个进程同时打分绕开 Python 的单核限制; 但每个进程都要自带一整套词典,
    #   开太多会把内存吃光, 所以固定一个小上限。
    proc_workers: 12

    # 否定词集合（遇到否定词时，将其后 negation_window 个分词单元内的情感词极性翻转）
    negation_words:
      # A. 单字否定
      - "不"
      - "没"
      - "未"
      - "非"
      - "无"
      - "别"
      - "莫"
      - "勿"
      - "否"
      # B. 双字否定短语
      - "没有"
      - "不再"
      - "不会"
      - "不能"
      - "不可"
      - "不曾"
      - "不应"
      - "不必"
      - "不得"
      - "不肯"
      - "不敢"
      - "不愿"
      - "不宜"
      - "不像"
      - "不算"
      - "不够"
      - "并非"
      - "毫无"
      - "从未"
      - "绝非"
      - "未能"
      - "未必"
      - "未曾"
      - "无法"
      - "无从"
      - "无需"
      - "无须"
      - "难以"
      - "缺乏"
      - "缺少"
      - "拒绝"
      # C. 三字否定组合
      - "不可能"
      - "不允许"
      - "不存在"
      - "不显著"
      - "未必然"
      - "绝对不"
      - "从来不"
      - "从来没"
      - "根本不"
      - "根本没"
      # D. 特殊否定结构（程度性/委婉否定）
      - "远未"
      - "尚未"
      - "仍未"
      - "至今未"
      - "始终未"
      - "迟迟未"
      - "不那么"
      - "不太"
      - "不甚"
      - "不大"
      - "不怎么"
      # E. 扩充批次 (2026-07-20): 多智能体三镜头对抗审核 (语义语体/误报多义/机制契合,
      #    一票否决) + 机械门 (与 6 部词典正/负面表精确重叠硬排除 + jieba 0.42.1 镜像
      #    生产注入实测分词) 后入选; 现有词与权重零改动, 纯追加。
      #    E1. "并"系书面否定
      - "并未"
      - "并不"
      - "并无"
      - "并没有"
      #    E2. 时间性/持续性否定 (与既有"尚未/仍未"平行)
      - "尚无"
      - "尚不"
      - "暂无"
      - "暂未"
      - "暂不"
      - "仍无"
      #    E3. 经历性/全称否定
      - "从不"
      - "从无"
      - "绝无"
      - "均未"
      - "毫不"
      #    E4. 委婉/程度性否定 (财经评论体高频)
      - "远非"
      - "未可"
      - "未敢"
      - "难称"
      - "不致"
      - "不见得"
      - "谈不上"
      - "算不上"
      - "不至于"
      - "鲜有"
      - "尚待"
      #    E5. 结构性否定 (否定构成)
      - "不构成"
      #    E6. 公文/公告语体否定 (打消=去除类, 惯接"疑虑/顾虑/恐慌"; 未经=处罚文书介词性否定)
      - "打消"
      - "未经"

    # 程度副词及其权重倍数（>1 程度加强，<1 程度减弱）
    degree_words:
      # 极强级（×2.5~3.0）
      "极其": 3.0
      "极为": 3.0
      "极度": 3.0
      "空前": 2.8
      "无比": 2.8
      "极端": 2.8
      "绝对": 2.8
      "无与伦比": 2.8
      # 强级（×2.0~2.5）
      "非常": 2.5
      "十分": 2.5
      "特别": 2.5
      "尤其": 2.2
      "格外": 2.2
      "异常": 2.2
      "深感": 2.2
      "倍感": 2.2
      "深度": 2.0
      "高度": 2.0
      "严重": 2.0
      "强烈": 2.0
      "大力": 2.0
      "全力": 2.0
      "着力": 2.0
      # 中强级（×1.5~1.9）
      "相当": 1.9
      "颇为": 1.8
      "尤为": 1.8
      "甚为": 1.8
      "颇": 1.7
      "甚": 1.7
      "大为": 1.7
      "比较": 1.5
      # 中级（×1.2~1.5）
      "很": 1.5
      "更": 1.5
      "更加": 1.5
      "愈加": 1.5
      "越发": 1.5
      "愈": 1.4
      "越": 1.4
      "进一步": 1.4
      "持续": 1.3
      "不断": 1.3
      "日益": 1.3
      "逐步": 1.2
      "逐渐": 1.2
      "较为": 1.2
      # 弱级（×0.6~0.9）
      "相对": 0.9
      "稍显": 0.8
      "一定程度": 0.8
      "一定程度上": 0.8
      "有所": 0.8
      "有些": 0.7
      "有点": 0.7
      "略": 0.6
      "略微": 0.6
      "略有": 0.6
      "稍": 0.6
      "稍微": 0.6
      "稍有": 0.6
      # 极弱级（×0.3~0.5）
      "微": 0.5
      "微微": 0.5
      "微幅": 0.5
      "小幅": 0.5
      "些许": 0.4
      "轻微": 0.4
      "稍稍": 0.4
      "几乎不": 0.3
      # ── 扩充批次 (2026-07-20): 审核流程同否定词 E 批注; 权重严格落于既有六档带宽,
      #    上限仍为 3.0 (与"极其/极为/极度"持平), 现有词与权重零改动, 纯追加。
      # 极强级（×2.5~3.0）
      "极": 3.0
      "最": 2.8
      "最为": 2.8
      "万分": 2.8
      "何等": 2.5
      "至为": 2.5
      "极具": 2.5
      # 强级（×2.0~2.5）
      "成倍": 2.2
      "饱受": 2.2
      "备感": 2.2
      "大幅度": 2.2
      "倍加": 2.0
      "备受": 2.0
      "深受": 2.0
      "深表": 2.0
      "深深": 2.0
      "重度": 2.0
      # 中强级（×1.5~1.9）
      "着实": 1.8
      "殊为": 1.8
      "远远": 1.8
      "很大程度": 1.8
      "很大程度上": 1.8
      "颇感": 1.7
      "越来越": 1.5
      "愈来愈": 1.5
      "愈发": 1.5
      "更趋": 1.5
      # 中级（×1.2~1.5）
      "普遍": 1.4
      "日趋": 1.3
      "日渐": 1.3
      "继续": 1.3
      "逐年": 1.2
      "渐趋": 1.2
      "趋于": 1.2
      # 弱级（×0.6~0.9）
      "偏": 0.8
      "大致": 0.8
      "初步": 0.8
      "略显": 0.8
      "尚": 0.7
      "或多或少": 0.7
      "略为": 0.6
      "略感": 0.6
      # 极弱级（×0.3~0.5）
      "轻度": 0.5
      "边际": 0.5
      "些微": 0.4

    # 转折连词集合（转折后的内容更能反映作者真实立场，权重提升 adversative_boost 倍）
    adversative_words:
      # A. 强转折
      - "但是"
      - "然而"
      - "却"
      - "可是"
      - "反而"
      - "相反"
      - "但"
      - "偏偏"
      - "岂料"
      - "孰料"
      - "谁知"
      # B. 弱转折 / 让步
      - "不过"
      - "只是"
      - "只不过"
      - "尽管如此"
      - "虽然如此"
      - "即便如此"
      - "话虽如此"
      - "尽管"
      # C. 对比 / 修正
      - "实则"
      - "事实上"
      - "实际上"
      - "实际却"
      - "实际上却"
      # D. 扩充批次 (2026-07-20): 审核流程同否定词 E 批注; 全部为"但/然而"型
      #    (引导作者真实立场侧), 让步引导词 (虽然/即使型) 与被否决词见审核记录。
      #    D1. 反预期标记 (其后从句 = 被证实的真实结局)
      - "殊不知"
      - "岂知"
      - "哪知"
      - "怎料"
      - "谁料"
      - "谁曾想"
      - "不料"
      - "未料"
      - "未曾想"
      - "没料到"
      - "怎奈"
      #    D2. 对比 / 修正扩充
      - "反倒"
      - "反观"
      - "而是"
      - "其实"
      - "恰恰相反"
      - "与此相反"
      - "与之相反"
      - "正相反"
      - "相比之下"
      - "相较之下"
      - "相形之下"
      #    D3. 结局修正 / 引述转向
      - "到头来"
      - "话锋一转"

  # BERT 模型情感分析参数
  tone_berts:
    window_stride_ratio: 0.5                        # 滑动窗口步长比例
                                                    # 白话: BERT 一次最多读 512 token, 长文按窗口切片、每次往前挪半个窗口 (相邻窗口重叠 50%), 防止句子被切断丢信息。
    inference_batch_size: 128                       # GPU 推理批次大小（v5: 增大到128, FP16下显存充裕）
    articles_per_batch: 200                          # 每次 engine.run_all_models 处理的文章批次数

    # V4 T1.1a 严格确定性 (2026-05-13 添加)
    # cpu_strict: CPU 上 use_deterministic_algorithms(warn_only=True);
    #             GPU 上同时关 cuDNN benchmark + 关 AMP (位级一致, 牺牲性能).
    # gpu_strict: GPU 路径严格 (含 cpu_strict 全部行为); T1.1b backlog 验证.
    # off:        历史性能优先模式 (AMP + cuDNN benchmark, 不保证可重现).
    # 白话: 控制"同一篇文章跑两遍, BERT 打分是否逐位完全一样"; 严格模式牺牲速度换可复现性, 论文复现包必需。
    deterministic_mode: cpu_strict
    random_seed: 42                                 # 设种子覆盖 random/numpy/torch/transformers

    # fix(omni-g-berts-04, 2026-06-11): 非预期模型加载失败是否 fail-loud。
    # true (默认): 仅"本地私有模型未配置" (model_id 为空 = FINBERT2_MODEL_DIR 未设,
    #   或解析为本地路径但不存在) 允许 graceful skip; hub 模型瞬态故障 (如 HF 不可达
    #   且无本地缓存) 直接 raise — 防止该模型三轨 (full/ctx/ss) 列从输出 parquet 整体消失而阶段仍
    #   SUCCESS (下游 encode 按列存在性静默跳过, 面板少一个模型族而无 gate 拦截)。
    # false: 容忍缺席 (失败记入 engine.failed_models, 仅日志)。
    strict_models: true

    # W8 (2026-06-29) BERT 推理缓存开关 (default-off, golden 安全铁律; LLM/嵌入/BERT 三族统一缓存收口)。
    # false (默认): run_all_models 走逐字旧路径, stage 23 产物字节级不变 (无任何缓存读写)。
    # true: 仅在生产受控播种窗口启用 (PYTHONHASHSEED=0 + 全 BLAS 线程钉 1 + 固定 inference_batch_size/
    #   articles_per_batch + 首选纯 CPU 播种 + HF 离线); 逐 (文章×模型) 缓存推理结果到
    #   _local_model_cache.db (复用 core/caching.py::LLMCache, 与大模型/嵌入同一套缓存类), 命中即免重算
    #   (只前向 miss 文章)。
    #   ⚠ 须 deterministic_mode ∈ {cpu_strict, gpu_strict} (否则 load_all fail-fast raise; AMP-on 会产 NaN/非确定)。
    #   ⚠ 编辑任一模型 label_map / max_length / inference_batch_size / articles_per_batch 等会自动改复合键
    #     (cache miss, 安全); 改 BERT 推理数学层 (窗口/池化/argmax) 须 bump 代码内 _BERT_CACHE_VERSION。
    #   ⚠ 启用后须受控 golden 重生 (始终在空缓存冷全量上重生; 详见 scripts/audit/UNIFIED_MODEL_CACHE_BERT_W8_EXECUTION_PLAN_2026-06-29.md §5)。
    # 白话: 这是 BERT 版的"账本缓存", 和大模型/嵌入用同一套缓存类; 平时关着不影响任何结果,
    #   只有专门重跑全量时才开, 让算过的文章不必再过一遍神经网络。
    # ⚠ 2026-06-29 用户指令开启 (true)。生效前提: deterministic_mode 须 ∈ {cpu_strict, gpu_strict}
    #   (当前 = cpu_strict, 满足); 启用后跑 stage 23 须受控环境播种 (见上方注释 + 执行计划 §5),
    #   否则裸环境冻结漂移 argmax 进 _local_model_cache.db 会污染未来 golden。
    inference_cache: true

    # BERT 模型列表（从代码迁移至此，便于统一管理）
    models:
      - model_id: yiyanghkust/finbert-tone-chinese
        short_name: finbert_cn
        description: "FinBERT 中文情感分析(金融社区中认知度较高)"
        max_length: 512
        label_map: {"0": "中性", "1": "正面", "2": "负面"}
      - model_id: bardsai/finance-sentiment-zh-base
        short_name: fin_sent_zh
        description: "中文金融情感分析(基于Financial PhraseBank微调；F1 macro 0.966)"
        max_length: 512
        label_map: {"0": "正面", "1": "中性", "2": "负面"}
      # finbert2 是本地训练的私有模型, 不在 huggingface hub 上.
      # 通过 .env 中 FINBERT2_MODEL_DIR 指向其本地绝对路径以跨机器友好;
      # 留空 (或路径不存在) 时, stage 23 graceful skip 该模型, 其余 2 个
      # huggingface 模型仍正常工作.
      - model_id: ${FINBERT2_MODEL_DIR}
        short_name: finbert2
        description: "FinBERT2 金融微调分类模型 (本地路径, 见 .env::FINBERT2_MODEL_DIR)"
        max_length: 512
        label_map: {"0": "负面", "1": "正面"}


# ------------------------------------------------------------------------------
# [模块四：面板数据构建] Bank-Year 面板构建 - 阶段 41-45
# (Phase 4d split 注释残留: panel_building 段配置实际位于 panel.yaml, 本文件中此处无对应键。)
# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# [模块二 D-group] Stage 18 Article-level staleness 双指标 (surface MinHash + semantic Faiss) (D2)
# ------------------------------------------------------------------------------
# 依赖 faiss-cpu + datasketch 已 pip 安装到位 (2026-06-01)。学术依据: Tetlock (2011)
# RFS 24(5):1481-1512; Gentzkow-Kelly-Taddy (2019) JEL.
article_staleness:
  enabled: true                # [已 always-on] stage 18 谓词改 always_enabled (2026-06-13); 仅作记录, 改 false 不再停掉本阶段

herd_detection:
  similarity_threshold: 0.35   # 余弦相似度阈值, ≥ 此值视为跟风 (闭边界, 代码 >=; fix(omni-g-herd-04, 2026-06-11))
                               # 白话: 同一家银行 7 天内两篇报道相似度达到 0.35, 后发的那篇算"跟风稿", 聚合时打折计入。
  time_window_days: 7          # 时间窗口(天), 仅比较窗口内的文章
  max_features: 5000000        # TF-IDF 最大特征数。2026-06-24: 由 10000 上调至 5e6 (有效=不截断), 解决 g-herd-02。
                               # 旧 10000 上限对头部大行 (工农中建) char 2-4gram 词表 (实测 5-7 万) 严重咬合,
                               # 按原始词频截断丢判别长尾 → 大行跟风计数系统性偏高 (盘上 full 轨 flag +16.8%/计数 +31.5%),
                               # 破坏跨行可比性 (fix(omni-g-herd-02))。5e6 ≫ 任何现实 bank-year 词表 → 不再截断咬合;
                               # 词表真撞 5e6 时运行期仍 warning 披露 (极端规模 tripwire)。上调几乎无内存代价 (sklearn 总是
                               # 先建全量计数词表再截断, cap 仅缩窄输出列宽, 稀疏存储随 nnz 不随列宽)。
                               # 白话: 把"只留最常见1万个词片"放宽到实际上=不限制, 让大银行也用上能区分文章的细节词, 不再把不同稿子误判成抄稿。
  min_df: 5                    # TF-IDF 最小文档频率**上限 (cap)**: 实际 min_df = min(此值, max(2, ceil(0.01·n)))
                               # 比例化消除小组词表塌缩断崖 (fix(omni-g-herd-01, 2026-06-11))
                               # 白话: 一个词至少要在若干篇文章里出现过才进词表; 文章很少时该门槛自动按比例降低, 不会出现"小样本词表被清空"的断崖。
  max_df: 0.9                  # TF-IDF 最大文档频率; 若 floor(max_df·n) ≤ min_df (df-band 退化) 运行期放开为 1.0
  chunk_size: 1000             # 仅日志显示 (legacy, 无运算语义 — >2000 篇分支已改 7 天窗双指针分桶, 不再分块控内存; fix(omni-g-herd-04))
  # 阈值敏感性网格 (2026-06-13): similarity_threshold=0.35 是研究者自由参数 (无文献定值;
  # 构念锚 Tetlock 2011 RFS 用连续 staleness 不设硬阈值), 故按 Simmons-Nelson-Simonsohn
  # (2011, Psych Science) 的披露规范预注册固定网格, 同一 TF-IDF/余弦一遍式复算各 τ 下的
  # 前驱计数 → herd_weight_{track}_thrNN 文章列 → 面板 llm_vote_tone_hw_thrNN_{track},
  # 供 Stata 稳健性表逐 τ 重估主回归。基线 0.35 不在网格内 (即现 herd_weight_{track})。
  # 白话: "相似到多少算抄稿"没有标准答案, 我们把门槛调松调紧各算一遍, 证明结论不靠 0.35 这个数。
  sensitivity_thresholds: [0.25, 0.30, 0.40, 0.45]

# ------------------------------------------------------------------------------
# [模块二] 金融科技经营效益态度指数 - 阶段 27
# ------------------------------------------------------------------------------
# 学术依据:
#   Jha, M., Liu, H., & Manela, A. (2026). Does finance benefit society?
#     RFS, 39(5), 1227-1266. DOI: 10.1093/rfs/hhaf012
#   方法论上游: Kozlowski, Taddy, & Evans (2019). ASR, 84(5), 905-949.
#     DOI: 10.1177/0003122419877135
# 白话: 用"利好经营 vs 损害经营"方向轴给每篇新闻打态度分
# (Phase 4d split 注释残留: benefit_society 段配置实际位于 features.yaml, 本文件中此处无对应键。)
# 共享 Embedding API — CO-PRIMARY: Qwen/Qwen3-Embedding-8B (硅基流动, embedding_api) + text-embedding-3-large (yunwu, embedding_large/_lg) (供阶段 15/25/27 共用; 两段均位于 features.yaml)。

# ------------------------------------------------------------------------------
# [模块三] boilerplate 跨文档套话比率 OOM 硬化 (阶段 22 子步骤; 执行计划 2026-07-06)
# ------------------------------------------------------------------------------
# 学术依据: Lang & Stice-Lawrence (2015) JAE; Dyer, Lang & Stice-Lawrence (2017) JAE
#   — 跨语料高频公式化短语(套话)占比构念。
# 说明: pipeline/sentiment/boilerplate.py 的 exact two-pass 内存控制参数。改造为分块两遍
#   (字节等价单遍, golden 零漂移), 消除生产 T=19 单遍 fit_transform 的全量 CSR 物化 OOM。
# ⚠ 顶层块 (load_config 扁平根 dict; 域文件名非嵌套键) → 读 load_config().get('boilerplate', {})。
# 白话: 数套话时"分批数=一次性数结果一模一样", 文章多也不爆内存; 参数缺省全走代码内置默认。
boilerplate:
  memory_tier: in_memory        # in_memory=tier1 分块(已实现,默认) / single_pass=旧单遍字节等价参照臂 / disk|auto=tier2 DEFERRED→raise
  chunk_size: 20000             # 串行路径每块文档数; 纯性能参数, 不改输出 (字节等价)
  # ── 预算 (2026-07-25 生产 P0 实测校准落地; 详见 boilerplate.py 顶部「§P0 实测」) ──
  # P0 实测 (169,807 篇 stage21 gated 语料, content_full 轨, 本机 128GB):
  #   增长曲线 D=32,000→40.28M entry, Heaps β=0.8266 → 生产 D=169,807 外推 M≈1.596 亿 entry;
  #   per-entry = 130.1 B (进程 RSS delta 实测) → 单轨 global_df 峰值 ≈ 19.3 GB, tier1 可产。
  #   ⚠ 旧 40M 占位会在 full 轨 D≈32,000 篇 (约 19%) 处 SystemExit 并连坐 nuke 整批 stage-22。
  df_dict_budget_warn: 100000000  # 软预算 ≈13GB @130B/entry; 超则 loud WARNING (非兜底)
  df_dict_budget_hard: 400000000  # 硬上限 ≈52GB @130B/entry; 超则 SystemExit (Pass1 循环内, 拒绝跑优于 OOM-killer 静默 SIGKILL)
                                  # 按 128GB 反推: 52GB(global_df) + ~17GB(worker) + ~10GB(df/其它) ≈ 79GB, 留 ~49GB 余量
  # ── 进程并行 (perf 2026-07-25; 与串行逐字节等价, 仅墙钟; 镜像 stage 15 工况自适应后端) ──
  # char_wb (4,6)-gram 分词是纯 Python GIL 热点, 串行实测 ≈52 篇/s → 三轨双遍 ≈3.7h。
  parallel_min_docs: 40000      # ≥该规模才切进程后端 (之下串行: dev/pytest 零行为变化 + 免 spawn 开销)
  par_chunk_size: 4000          # 并行路径每块文档数 (控 worker 峰值内存 ≈1.4GB/worker)
  n_jobs: 12                    # 并行 worker 数 (=1 强制串行)
