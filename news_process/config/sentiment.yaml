# Phase 4d split — sentiment domain
# Generated by scripts/migrate/split_config_yaml.py
# Original section ownership preserved; comments may have been re-flowed during round-trip.

tone_llm_processing:
  enabled: true                                     # 是否启用统一 LLM 处理
  timeout: 600                                      # 请求超时时间（秒）
  connect_timeout: 120                              # TCP/TLS 建连超时（秒）
  sock_connect_timeout: 120                         # socket 建连超时（秒）
  sock_read_timeout: 600                            # 响应读取超时（秒）
  ttl_dns_cache: 300                                # DNS 缓存时间，减少高频验证重复解析
  keepalive_timeout: 600                            # TCP keepalive，降低批量请求握手压力
  max_retries: 80                                   # v6/N4: 最大重试次数（指数退避配合下，80 次足够覆盖瞬时故障）
  retry_delay: 5                                    # v6/N4: 基础重试间隔（指数退避起点；秒）
  retry_backoff: exponential                        # v6/N4: 指数退避策略
  retry_backoff_cap: 600                            # v6/N4: 单次重试 sleep 上限（秒）
  max_concurrency: 100                              # 2026-05-14 用户决策: 项目统一 100 并发 (原 v6/N4=40); 监控 yunwu 网关 429 抖动, 若雪崩回退至 40
  temperature: 0.0                                  # 推理温度（0 = 确定性输出）
  random_seed: 42                                   # 随机种子（确保确定性输出）
  force_json: true                                  # 启用 response_format 强制 JSON 输出
  ensemble_method: majority_vote                    # 多模型聚合方法

  # v3 LLM 模型列表 — 真三家族三角验证 (基于 yunwu /v1/models 实际授权清单)
  #   v3 锁定:  gpt-5.4-nano / gemini-3.1-flash-lite / deepseek-v4-flash
  # 学术叙述: "Three independent LLM families: OpenAI + Google + DeepSeek,
  #           routed via yunwu.ai aggregator (single account, OpenAI-compatible /v1/chat/completions)."
  models:
    - model_name: gpt-5.4-nano
      short_name: gpt54nano
      description: GPT-5.4 Nano (OpenAI via yunwu)
      base_url: https://yunwu.ai/v1
      api_key: ${YUNWU_API_KEY}                     # v6/N7: 统一 yunwu key
    - model_name: gemini-3.1-flash-lite
      short_name: gemini31111
      description: gemini-3.1-flash-lite (Google via yunwu)
      base_url: https://yunwu.ai/v1
      api_key: ${YUNWU_API_KEY}
    - model_name: deepseek-v4-flash
      short_name: deepseekv4                            # v3: 从 claude4h 重命名 (反映真实身份)
      description: DeepSeek V4 Flash (DeepSeek via yunwu)
      base_url: https://api.deepseek.com
      api_key: ${DEEPSEEK_API_KEY}

  # Unified CoT 提示词模板（精简版）
  # 学术依据 1: De Kok (2025) Appendix C - GLLMs Generate Text Left to Right. 
  #   在 JSON 输出中前置 explanation（如 verification_reason），迫使模型将其作为后续 classification 的上下文，以实现 Zero-shot CoT。
  # 学术依据 2: Generative AI and Finance (Section 3.7.2) - Explanation and evaluation of LLM reasoning.
  #   强制要求模型先生成解释，然后再输出分数或判定结论，从而彻底纠正模型的因果错位（Post-hoc rationalization）与幻觉。
  logit_to_score:
    enabled: true

# ------------------------------------------------------------------------------
# [模块四：评估验证模块] 人工抽样验证配置 (Human Validation) - 阶段 32
# ------------------------------------------------------------------------------
# 根据国际顶级期刊标准，生成人工编码验证样本。
  prompt_template_file: ./config/prompts/unified_cot.txt
  title_sentiment_prompt_template_file: ./config/prompts/title_sentiment.txt
sentiment_analysis:
  # 启用的情感分析方法（可选: tone_llms, tone_words, tone_berts）
  enabled_methods:
    - tone_llms
    - tone_words
    - tone_berts

  # 词典法情感分析参数
  tone_words:
    pos_threshold: 0.1                              # 正面情感得分阈值
    neg_threshold: -0.1                             # 负面情感得分阈值
    negation_window: 2                              # 否定词有效作用窗口（向后影响的分词单元数）
    adversative_boost: 1.5                          # 转折后权重提升倍数

    # 否定词集合（遇到否定词时，将其后 negation_window 个分词单元内的情感词极性翻转）
    negation_words:
      # A. 单字否定
      - "不"
      - "没"
      - "未"
      - "非"
      - "无"
      - "别"
      - "莫"
      - "勿"
      - "否"
      # B. 双字否定短语
      - "没有"
      - "不再"
      - "不会"
      - "不能"
      - "不可"
      - "不曾"
      - "不应"
      - "不必"
      - "不得"
      - "不肯"
      - "不敢"
      - "不愿"
      - "不宜"
      - "不像"
      - "不算"
      - "不够"
      - "并非"
      - "毫无"
      - "从未"
      - "绝非"
      - "未能"
      - "未必"
      - "未曾"
      - "无法"
      - "无从"
      - "无需"
      - "无须"
      - "难以"
      - "缺乏"
      - "缺少"
      - "拒绝"
      # C. 三字否定组合
      - "不可能"
      - "不允许"
      - "不存在"
      - "不显著"
      - "未必然"
      - "绝对不"
      - "从来不"
      - "从来没"
      - "根本不"
      - "根本没"
      # D. 特殊否定结构（程度性/委婉否定）
      - "远未"
      - "尚未"
      - "仍未"
      - "至今未"
      - "始终未"
      - "迟迟未"
      - "不那么"
      - "不太"
      - "不甚"
      - "不大"
      - "不怎么"

    # 程度副词及其权重倍数（>1 程度加强，<1 程度减弱）
    degree_words:
      # 极强级（×2.5~3.0）
      "极其": 3.0
      "极为": 3.0
      "极度": 3.0
      "空前": 2.8
      "无比": 2.8
      "极端": 2.8
      "绝对": 2.8
      "无与伦比": 2.8
      # 强级（×2.0~2.5）
      "非常": 2.5
      "十分": 2.5
      "特别": 2.5
      "尤其": 2.2
      "格外": 2.2
      "异常": 2.2
      "深感": 2.2
      "倍感": 2.2
      "深度": 2.0
      "高度": 2.0
      "严重": 2.0
      "强烈": 2.0
      "大力": 2.0
      "全力": 2.0
      "着力": 2.0
      # 中强级（×1.5~1.9）
      "相当": 1.9
      "颇为": 1.8
      "尤为": 1.8
      "甚为": 1.8
      "颇": 1.7
      "甚": 1.7
      "大为": 1.7
      "比较": 1.5
      # 中级（×1.2~1.5）
      "很": 1.5
      "更": 1.5
      "更加": 1.5
      "愈加": 1.5
      "越发": 1.5
      "愈": 1.4
      "越": 1.4
      "进一步": 1.4
      "持续": 1.3
      "不断": 1.3
      "日益": 1.3
      "逐步": 1.2
      "逐渐": 1.2
      "较为": 1.2
      # 弱级（×0.6~0.9）
      "相对": 0.9
      "稍显": 0.8
      "一定程度": 0.8
      "一定程度上": 0.8
      "有所": 0.8
      "有些": 0.7
      "有点": 0.7
      "略": 0.6
      "略微": 0.6
      "略有": 0.6
      "稍": 0.6
      "稍微": 0.6
      "稍有": 0.6
      # 极弱级（×0.3~0.5）
      "微": 0.5
      "微微": 0.5
      "微幅": 0.5
      "小幅": 0.5
      "些许": 0.4
      "轻微": 0.4
      "稍稍": 0.4
      "几乎不": 0.3

    # 转折连词集合（转折后的内容更能反映作者真实立场，权重提升 adversative_boost 倍）
    adversative_words:
      # A. 强转折
      - "但是"
      - "然而"
      - "却"
      - "可是"
      - "反而"
      - "相反"
      - "但"
      - "偏偏"
      - "岂料"
      - "孰料"
      - "谁知"
      # B. 弱转折 / 让步
      - "不过"
      - "只是"
      - "只不过"
      - "尽管如此"
      - "虽然如此"
      - "即便如此"
      - "话虽如此"
      - "尽管"
      # C. 对比 / 修正
      - "实则"
      - "事实上"
      - "实际上"
      - "实际却"
      - "实际上却"

  # BERT 模型情感分析参数
  tone_berts:
    window_stride_ratio: 0.5                        # 滑动窗口步长比例
    inference_batch_size: 128                       # GPU 推理批次大小（v5: 增大到128, FP16下显存充裕）
    articles_per_batch: 200                          # 每次 engine.run_all_models 处理的文章批次数

    # V4 T1.1a 严格确定性 (2026-05-13 添加)
    # cpu_strict: CPU 上 use_deterministic_algorithms(warn_only=True);
    #             GPU 上同时关 cuDNN benchmark + 关 AMP (位级一致, 牺牲性能).
    # gpu_strict: GPU 路径严格 (含 cpu_strict 全部行为); T1.1b backlog 验证.
    # off:        历史性能优先模式 (AMP + cuDNN benchmark, 不保证可重现).
    deterministic_mode: cpu_strict
    random_seed: 42                                 # 设种子覆盖 random/numpy/torch/transformers

    # BERT 模型列表（从代码迁移至此，便于统一管理）
    models:
      - model_id: yiyanghkust/finbert-tone-chinese
        short_name: finbert_cn
        description: "FinBERT 中文情感分析(金融社区中认知度较高)"
        max_length: 512
        label_map: {"0": "中性", "1": "正面", "2": "负面"}
      - model_id: bardsai/finance-sentiment-zh-base
        short_name: fin_sent_zh
        description: "中文金融情感分析(基于Financial PhraseBank微调；F1 macro 0.966)"
        max_length: 512
        label_map: {"0": "正面", "1": "中性", "2": "负面"}
      - model_id: IDEA-CCNL/Erlangshen-Roberta-110M-Sentiment
        short_name: erlangshen
        description: "二郎神 Roberta 110M 情感分类"
        max_length: 512
        label_map: {"0": "负面", "1": "正面"}
      - model_id: hw2942/bert-base-chinese-finetuning-financial-news-sentiment-v2
        short_name: hw2942
        description: "hw2942金融新闻文本的情感分类（训练数据量偏小，泛化能力可能有限）"
        max_length: 512
        label_map: {"0": "负面", "1": "中性", "2": "正面"}
      # finbert2 是本地训练的私有模型, 不在 huggingface hub 上.
      # 通过 .env 中 FINBERT2_MODEL_DIR 指向其本地绝对路径以跨机器友好;
      # 留空 (或路径不存在) 时, stage 23 graceful skip 该模型, 其余 4 个
      # huggingface 模型仍正常工作.
      - model_id: ${FINBERT2_MODEL_DIR}
        short_name: finbert2
        description: "FinBERT2 金融微调分类模型 (本地路径, 见 .env::FINBERT2_MODEL_DIR)"
        max_length: 512
        label_map: {"0": "负面", "1": "正面"}


# ------------------------------------------------------------------------------
# [模块四：面板数据构建] Bank-Year 面板构建 - 阶段 41-45
# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# [模块二 D-group] Stage 19 LLM CEO/Chairman zero-shot NER
# ------------------------------------------------------------------------------
# P-016 修复 (v3.7.1): stage 19 改 opt-in. 启用前确认 yunwu API key 配置 +
# ~$6-12 LLM 预算 + 12-24h wall-clock. 详见 pipeline/sentiment/executive_ner.py
# docstring L28-32 + AUDIT_REPORT_ULTIMATE.md::P-016.
executive_ner:
  enabled: false               # 默认 opt-in; 用户显式 true 才启用
  model: gpt-5.4-nano          # 与 stage 21 同 OpenAI-compat
  timeout_per_request: 60      # 单请求超时 (秒)
  max_retries: 5               # P-022 配套: 重试上限

herd_detection:
  similarity_threshold: 0.35   # 余弦相似度阈值, 高于此值视为跟风
  time_window_days: 7          # 时间窗口(天), 仅比较窗口内的文章
  max_features: 10000          # TF-IDF 最大特征数 (维度封锁)
  min_df: 5                    # TF-IDF 最小文档频率
  max_df: 0.9                  # TF-IDF 最大文档频率
  chunk_size: 1000             # 分块运算大小 (控制内存)

# ------------------------------------------------------------------------------
# [模块二] 金融科技经营效益态度指数 - 阶段 27
# ------------------------------------------------------------------------------
# 学术依据:
#   Jha, M., Liu, H., & Manela, A. (2026). Does finance benefit society?
#     RFS, 39(5), 1227-1266. DOI: 10.1093/rfs/hhaf012
#   方法论上游: Kozlowski, Taddy, & Evans (2019). ASR, 84(5), 905-949.
#     DOI: 10.1177/0003122419877135
# 白话: 用"利好经营 vs 损害经营"方向轴给每篇新闻打态度分
# Shared Embedding API for text-embedding-3-small (Stages 15/25/27).
