# Phase 4d 拆分 — paths 领域
# 由 scripts/migrate/split_config_yaml.py 生成
# 原始段落归属保持不变; 注释在往返转换中可能被重排 (re-flow)。

paths:
  raw_data_dir: ./data_excel                       # 原始 Excel 数据文件所在目录
  output_dir: ./data/processed                     # 各阶段处理结果输出目录 (Phase 8: ./data_processed → ./data/processed)
  log_dir: ./logs                                  # 日志文件输出目录
  noise_patterns_file: ./config/noise_patterns.json # 噪声模式正则表达式文件
  media_weights_file: ./config/media_weights.json   # 媒体权重评分文件
  bank_names_file: ./config/bank_names.json         # 银行名称及其别名映射文件（用于11步银行新闻分类）
  bank_keywords_file: ./config/bank_keywords.json   # 银行关键词列表文件（用于00步内容过滤，保留包含银行关键词的新闻）
  # [已移除] 以下中国人民银行相关条目已从 bank_names.json 和 bank_keywords.json 中移除：
  # - 中国人民银行  # - 人民银行   # - 人行   # - 中国中央银行   # - 中国央行   # - 我国中央银行   # - 我国央行
  fintech_dict_file: ./config/fintech_dict.json     # 金融科技关键词词典文件
  bank_name_exclusions_file: ./config/bank_name_exclusions.json  # 银行名称否定模式与短名歧义消解配置
  tone_dicts_file: ./config/tone_dicts.json         # 情感词典文件（正面/负面/否定词等）
  bank_addresses_file: ./config/bank_addresses.json  # 银行注册地地址信息（省份/城市/区县，用于省级/城市级聚类标准误和 leave-one-out 工具变量构建）

  # ── Phase 1 重构补齐 (2026-05-03): 替代 os.path.dirname(__file__) + 'config/...' 硬编码 ──
  # 受影响文件: 15/30 (auth_path), 42 (nppa_path), 44 (shock_path), 45 (cls_path)
  # Phase 2f 拆分 paths.yaml 时这 4 个键随段一并迁入新文件，无需重写。
  authoritative_corpus_file: ./config/authoritative_corpus.txt  # 权威政策语料 (供 15/26 计算政策语义对齐; stage 30 已于 2026-05-29 退役, _t2v 列改由 15/25 内联产出)
  policy_shocks_file: ./config/policy_shocks.json               # 政策冲击事件清单 (供 44 DID 处理)
  nppa_newspapers_csv: ./config/nppa_newspapers_all.csv         # NPPA 注册报刊全表 (供 42 媒体多样性合并)
  media_classification_file: ./config/media_classification.json # 媒体分类映射 (供 45 panel export 媒体异质性指标)
  # ── Phase 2a 补齐 (2026-05-04): 43 (geography.py) compute_geo_proximity_buffers 与 compute_regional_imitation_pressure 之前 deferred ──
  city_coordinates_file: ./config/city_coordinates.json         # 城市经纬度 (供 43 距离缓冲)
  province_capital_map_file: ./config/province_capital_map.json # 省会城市映射 (供 43 LOO 模仿压力)

  # ── Phase 3b 新增 (2026-05-04): papers_assets/ 多论文非代码资产根目录 ──
  # 用于 papers/_common/paper_config.py:get_paper_config() 解析每篇论文的
  # output_dir / do_dir。Phase 2f 拆 paths.yaml 时随段迁入。
  papers_assets_root: ./papers_assets

  # ── R1-R5 audit fix A4 (2026-05-27) + audit A 修复 (2026-05-30, option 1): LLM 归档路径锚定 ──
  # archive.py::_resolve_archive_root() 读此 key; load_config 的 _resolve_paths_in_place
  # 把 `./` 前缀路径 join 到 project_root = <repo>/news_process。
  # 旧值 `./data/llm_archive` → <repo>/news_process/data/llm_archive, 被 .gitignore:92
  # (news_process/data/) 排除且不匹配 .gitattributes:36 的 repo-root LFS rule → 332MB
  # 归档进不了 git/LFS, 审稿人 git lfs pull 拿不到 (顶刊复现性硬约束落空)。
  # 修复 ("搬到对的地方"): 改为 `./../data/llm_archive` — `./` 前缀仍触发 join, `../`
  # 上climb 到 repo 根 → 解析为 <repo>/data/llm_archive (绝对路径, CWD 无关)。该位置已
  # 有 .gitignore negation + .gitattributes:36 LFS rule, 新归档天然可经 git LFS 交付。
  # ⚠ 迁移必须【先于任何新 LLM run】: 否则新 run 写到空的新位置, 而 332MB 旧数据
  #   滞留旧位置成孤儿, 且可能出现同名 jsonl (如又一个 2026-MM-DD.jsonl) 分处两地,
  #   手动 mv 会撞名丢数据。现有 332MB 旧归档一次性手动迁移 (repo 根执行):
  #     mkdir -p data/llm_archive
  #     mv news_process/data/llm_archive/responses data/llm_archive/
  #     mv news_process/data/llm_archive/manifest.json data/llm_archive/ 2>/dev/null || true
  #   迁移后重建 manifest (旧位置当前连 manifest.json 都没有, 新位置也不会自动有):
  #     python -c "from news_process.pipeline.llm_archive import write_manifest; write_manifest()"
  #   迁移前 verify_manifest() 会因新位置为空而返回 False (假阴性) — 属预期, 迁移+
  #   重建 manifest 后即恢复正常。
  # 白话: `./` 开头会被程序拼到 news_process 目录下, 再用 `../` 爬一层回到仓库根,
  #       所以 LLM 归档最终落在 <仓库根>/data/llm_archive — 那里才有 git LFS 接管,
  #       审稿人才下载得到这 332MB 归档。
  llm_archive: ./../data/llm_archive

# ------------------------------------------------------------------------------
# 输出文件名配置 (Output Filenames)
# ------------------------------------------------------------------------------
# 各处理阶段输出的 Parquet 文件名，存放于 paths.output_dir 目录下。
filenames:
  # 键名格式: output_XX_描述（XX = 生成该文件的脚本前缀编号）
  output_00_preprocessing: 00_preprocessing.parquet       # 00_preprocessing.py → 数据预处理（加载、过滤、标准化、去重）
  output_11_bank_news: 11_bank_news.parquet               # 11_news_bank.py → 银行新闻分类
  output_12_fintech_news: 12_fintech_news.parquet         # 12_news_fintech.py → 金融科技新闻分类（仅保留金融科技新闻）
  output_12_fintech_full: 12_fintech_news_full.parquet    # 12_news_fintech.py → 全量分类结果（含非金融科技，用于人工验证抽样）
  output_12b_cooccurrence: 12b_cooccurrence_filtered.parquet  # 12b_cooccurrence_filter.py → 银行×金科邻近共现硬过滤（12 的近邻相关子集，丢行；Andreou et al. 2026）
  output_13_news_with_ctx: 13_news_with_ctx.parquet       # 13_materialize_ctx.py → stage 12b 子集 + content_ctx 物化 (v3.6.0 Plan E P4 A1; 2026-06-15 改读 12b)
  output_14_fintech_intensity: 14_fintech_intensity.parquet  # 14_fintech_intensity.py → TF-IDF 技术重度评分（在 12 基础上追加 intensity 列）
  output_15_article_alignment: 15_article_alignment.parquet  # 15_article_policy_alignment.py → 文章级政策语义对齐度 (Distel et al. 2026)
  output_21_tone_llms: 21_tone_llms.parquet               # 21_tone_llms.py → LLM 语义精筛与情感分析（仅 llm_verified=True）
  output_21_tone_llms_full: 21_tone_llms_full.parquet     # 21_tone_llms.py → LLM 全量结果（含 llm_verified=True/False，供验证模块使用）
  output_22_words_tone: 22_words_tone.parquet             # 22_tone_words.py → 词典法情感分析
  output_23_bert_tone: 23_bert_tone.parquet               # 23_tone_berts.py → BERT 模型情感分析
  output_24_herd_decay: 24_herd_decay.parquet             # 24_herd_decay_processor.py → 跟风衰减权重 (Tetlock 2011, RFS)
  output_32_human_sample: 32_human_samples.xlsx           # 32_news_llms_human.py → 人工验证样本（含真伪与情感标注）
  output_40_panel_yearly: 40_panel_yearly.parquet          # 45_panel_export_main.py → 年度平衡面板 (Bank-Year)
  output_40_article_bank: 40_article_bank_level.parquet    # 45_panel_export_main.py → 展开后文章-银行级数据
  output_51_panel_controls: 51_panel_with_controls.parquet  # 51_falsification_test.py → 含伪造检验对照变量的面板
  output_27_benefit_cache: 27_benefit_embeddings.npy        # 27_fintech_benefit_society.py → Embedding 缓存 (Jha et al. 2026)

# ------------------------------------------------------------------------------
# 并行处理配置 (Parallel Processing)
# ------------------------------------------------------------------------------
parallel:
  n_jobs: -1                                        # 并行工作进程数（-1 表示使用全部CPU核心）
  batch_size: 5000                                  # 每批次处理的数据行数

