to_be_added_categories:
  - "非上市城商行 (~80 家) → tier 2"
  - "农村商业银行 (~100 家上规模, ~1500 家全国) → tier 1"
  - "民营银行 (~19 家) → tier 1, bank_type_id=5"
  - "互联网银行 (网商银行 / 微众银行 / 新网银行 / 等) → tier 1, bank_type_id=5"
  - "外资法人银行 (~40 家) → tier 1, bank_type_id=6"
  - "村镇银行 (代表性 ~50 家) → tier 1, bank_type_id=8"
  - "其他股份制 (港资 / 中外合资 等少数) → tier 3"

acquisition_protocol:
  step_1: "从 news_process/config/bank_names.json 提取所有 bank_name (1767 行总集)"
  step_2: "排除非中国大陆 + 已退市 + 子公司 → 估 ~700-900 行候选"
  step_3: "按 bank_names.json `variants` 字段 fuzzy match 到 news_process panel target_bank"
  step_4: "按银保监会银行业金融机构法人名单 2024-Q4 frozen 分类 bank_type_id"
  step_5: "is_soe / tier 校准: Wind 股权穿透 + 实控人查询"
  step_6: "wind_code 填入: 上市行 Wind ticker; 非上市 null"
  step_7: "本 yaml append (不覆盖 frozen 39 行)"
