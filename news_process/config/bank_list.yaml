# news_process/config/bank_list.yaml
# ──────────────────────────────────────────────────────────────────────────
# Bank panel master list with SOE / tier / wind_code metadata.
# V4 audit DC5 + C3 deliverable.
# Created: 2026-05-18
# Frozen at: 2024-Q4 (银保监会银行业金融机构法人名单 + D-SIB list 2024)
#
# 用途
# ----
# - 第 10 + 11 篇 outcome panel 主键源 (target_bank)
# - implicit_guarantee_tier 异质性回归 (V4 F-P1.1 修复)
# - SOE × treatment 交互项 (Acharya 2016 RFS 框架)
# - Wind API 调用 bank_code 映射 (DC2 dry-run)
#
# Schema
# ------
# 每条记录:
#   target_bank: 中文全称 (与 news_process/config/bank_names.json `bank_name` 一致)
#   is_soe: bool — 国务院/财政部/汇金/地方政府控股 (≥ 50% 或一致行动)
#   bank_type_id: int 1-8 (见 implicit_guarantee_framework.md §三)
#                 1=国有大行 2=股份制 3=城商 4=农商 5=民营/互联网
#                 6=外资 7=政策性 8=其他
#   implicit_guarantee_tier: int 1-5 (5=绝对 TBTF / 1=无 implicit guarantee)
#   wind_code: 上市行 Wind ticker (例 "601398.SH"), 非上市 null
#   listed: bool (是否上市, A/H/U 任一)
#
# 数据源
# ------
# - 国有 6 大 + 政策性 3 家: 财政部公开
# - D-SIB list: 银保监会 2024-Q4 list
# - Wind ticker: Wind 银行库
# - 非上市行: 银保监会银行业金融机构法人名单 (按月更新)
#
# 当前状态 (M0)
# -------------
# - frozen 39 行 (国有 + 政策性 + 系统重要性股份制 + 其他股份制 + 上市城商行代表)
# - 余 ~460 行: M1 期间用户用 Wind + 银保监会数据补全 (城商 / 农商 / 民营 / 外资 / 村镇)
# - 不在此 yaml 内 fabricate 数据 (避免错误分类风险)
#
# 维护原则
# --------
# 1. 仅在 banks 列表内 *append* 新条目, 不修改已 frozen 的字段
# 2. 任何 tier 升级/降级需 git commit 单独提交 + 银保监会 D-SIB list 引用
# 3. 与 bank_names.json 主键 (`bank_name`) 严格保持一致 (本 yaml 是子集)
# ──────────────────────────────────────────────────────────────────────────

metadata:
  version: "1.0.0"
  frozen_date: "2024-Q4"
  total_banks_target: 500       # 完整 panel 目标
  total_banks_frozen: 39        # 当前已分类
  source_d_sib_list: "银保监会 2024-Q4 D-SIB list"
  source_bank_universe: "news_process/config/bank_names.json (1767 行总样本)"

# ─────────────────────────────────────────────────────────────────────────
# Tier 定义 (与 implicit_guarantee_framework.md §三 一致)
# ─────────────────────────────────────────────────────────────────────────
tier_definitions:
  5: "绝对 TBTF — 国有大行 + 政策性银行"
  4: "系统重要性股份制 — D-SIB list 入选"
  3: "其他股份制 + 上市城商行"
  2: "非上市城商行 (有地方政府背书)"
  1: "农商行 + 民营 + 互联网 + 外资"

bank_type_definitions:
  1: "国有大行 (state_owned)"
  2: "股份制商业银行 (joint_stock)"
  3: "城市商业银行 (city_commercial)"
  4: "农村商业银行 (rural_commercial)"
  5: "民营银行 / 互联网银行 (private_internet)"
  6: "外资银行 (foreign_owned)"
  7: "政策性银行 (policy_bank)"
  8: "其他 / 待分类 (other)"

