    - 中信银行
    - 中国民生银行

tier_definitions:
  5: "国有大型商业银行 + 政策性银行 (绝对 TBTF)"
  4: "D-SIB 股份制 (银保监 2024-Q4 list)"
  3: "其他股份制 + 上市城商行"
  2: "非上市城商行 (有地方政府背书)"
  1: "农商 + 民营 + 外资 + 直销"

bank_type_definitions:
  1: "国有大型商业银行"
  2: "股份制商业银行"
  3: "城市商业银行"
  4: "农村商业银行"
  5: "民营银行 / 互联网银行"
  6: "外资法人银行"
  7: "政策性银行"
  8: "其他 (直销 / 央行 / 未分类)"

