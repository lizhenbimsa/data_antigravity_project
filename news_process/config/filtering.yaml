# Phase 4d 拆分 — filtering 领域
# 由 scripts/migrate/split_config_yaml.py 生成
# 原始段落归属保持不变; 注释在往返转换中可能被重排 (re-flow)。

bank_news_classification:
  split_ratio: 0.5                                  # 内容按字符数等分的分割比例（0.5 = 上下各50%）
  min_occurrences_upper: 1                          # 文章上半部分最少出现次数
  min_occurrences_lower: 1                          # 文章下半部分最少出现次数
  min_name_occurrences: 2                           # 最少出现次数（银行名称变体在标题或全文中合计至少出现的次数）
                                                    # 白话: 银行名得在文章上半段和下半段各露面至少 1 次、全文合计至少 2 次,
                                                    #       才算"这篇新闻真的在讲这家银行", 防止结尾顺带提一句的文章混进来。

# ------------------------------------------------------------------------------
# [模块二：新闻筛选模块] 金融科技新闻分类配置 (FinTech News Classification) - 阶段 12
# ------------------------------------------------------------------------------
fintech_news_classification:
  split_ratio: 0.5                                  # 内容按字符数等分的分割比例（0.5 = 上下各50%）
  min_occurrences_upper: 1                          # 文章上半部分最少出现次数
  min_occurrences_lower: 1                          # 文章下半部分最少出现次数
  min_distinct_keywords: 2                          # 最少不同词汇数（标题或全文中至少出现的不同关键词数量）

# ------------------------------------------------------------------------------
# [模块二：新闻筛选模块] 金融科技技术重度评分 (FinTech Intensity Scoring) - 阶段 14
# ------------------------------------------------------------------------------
# 在阶段 12 的 AC 关键词分类基础上，使用 TF-IDF + IDF 加权词向量【普通质心】计算
# 连续型技术强度得分。消除复读机刷分 (Cheap Talk) 和文档长度偏差。
# fix(log-round4-2026-06-20): 订正"SIF"措辞 —— 本实现是 IDF 加权普通质心
# (np.average(emb, weights=idf)), 非 SIF (无 a/(a+p(w)) 平滑逆频率、无首主成分去除);
# 见 fintech_intensity.py docstring :44-52 (fix omni-g-fintech-02, 2026-06-11)。
# 学术依据:
#   Li, K., et al. (2021). Measuring corporate culture using machine learning.
#     The Review of Financial Studies, 34(7), 3265-3315.  DOI: 10.1093/rfs/hhaa079
#   Manning, C. D., et al. (2008). Introduction to Information Retrieval.
#     Cambridge University Press. Ch 6.2.1 (smooth IDF), Ch 6.4.3 (sublinear TF).
fintech_intensity:
  # (v3.14.0) 嵌入模型不再由此配置 —— 改走统一引擎 co-primary 双轨 spec
  # (CONFIG['embedding_api']=Qwen 无后缀 + CONFIG['embedding_large']=_lg), 产
  # fintech_intensity_score (Qwen) + fintech_intensity_score_lg。本地 text2vec 已移除。
  min_distinct_keywords_jieba: 2                         # Jieba 精算后去重关键词最低数量（二次熔断阈值）
                                                         # 白话: 用更准的 jieba 分词重数一遍, 不同的金融科技词不足 2 个就判定不算金融科技新闻 (防 AC 粗匹配误报)。
  winsorize_percentiles: [1, 99]                         # IDF Winsorization 分位数 (P1/P99)
                                                         # 白话: 把每个词的 IDF "稀有度"得分压到第 1 与第 99 百分位之间, 防个别极端罕见词把单篇得分拉爆。
  anisotropy_floor: 0.1                                  # 各向异性现象【动机】参考 Ethayarajh (2019); 此 min-max+floor 重标定为工程 ad-hoc, 非该文校准方法
                                                         # 白话: 中文词向量天生"挤在一个锥形里"导致任意两词都偏相似, 校准时给修正系数设个 0.1 下限防过度纠偏。

# ------------------------------------------------------------------------------
# [模块二：新闻筛选模块] 文章级政策语义对齐度 (Article-level Policy Alignment) - 阶段 15
# ------------------------------------------------------------------------------
# 为每篇金融科技新闻计算与权威政策语料的余弦相似度 (policy_cosine_sim)。
# 支持后续 Token/Hidden 四象限分类 (Distel et al. 2026, Research Policy)。
# 学术依据:
#   Distel, A. P., Grimpe, C., & Poetz, M. (2026). From evidence to impact.
#     Research Policy, 55(3), 105426. DOI: 10.1016/j.respol.2026.105426
#   Hassan, T. A. et al. (2019). Firm-level political risk. QJE, 134(4),
#     2135-2202. DOI: 10.1093/qje/qjz021
article_alignment:
  max_tokens_per_input: 8191                               # 单条文本 token 上限 (OpenAI 硬性限制)
  max_tokens_per_request: 250000                           # 单次 API 请求总 token 安全上限 (300K - 50K 余量)
  quadrant_percentiles: [25, 50, 75]                       # 四象限分类的分位数阈值集合
  # fix(omni-g-policy-02, 2026-06-11): vintage-aware 政策锚点 (stage 15 + 26 共用)。
  # true (默认) = 年度 t 仅用发布年份 ≤ t 的政策文档构造锚点 (消除前视构造);
  # false = 旧静态全语料锚点 (含未来政策文本, 仅作稳健性对照, 日志显式披露)。
  # 白话: 算 2015 年新闻的"政策对齐度"时, 只许拿 2015 年及以前发布的政策文件当参照,
  #       不能偷看未来的政策 (否则指标带前视偏误, 回归结果不可信)。
  vintage_aware: true
  # 全年份锚点稳健性孪生 (2026-06-21, 用户决策; stage 15 + 26 共用)。
  # true (默认) = 在 vintage_aware 主轨**之外并列**再产一套用"所有年份政策文档"拼成
  #   静态全语料锚点的 `_allv` 指标 (policy_cosine_sim_allv* / auth_sim_*_allv* /
  #   article_sim_mean_allv* / token|hidden|subst_adopt_*_allv*), 用**完全一致的下游
  #   构造**作 anchor-robustness 对照; false = 不产 _allv 列 (仅 vintage 主轨)。
  # ⚠ `_allv` 含未来政策文本, **仅作稳健性对照, 绝不替换 vintage 主轨**; 论文须披露
  #   其系 ex-post / 全语料口径 (非前视守卫指标), 两轨禁混进同一 over-identified 检验。
  # 白话: vintage 主轨是"只用当年及以前政策"的诚实口径 (主结果用它); _allv 是额外
  #   再用"全部政策(含以后年份)"算一遍, 给审稿人看"结论不被 vintage 裁剪本身驱动"。
  all_vintage_companion: true

# ------------------------------------------------------------------------------
# [模块二：新闻筛选模块] 实体上下文窗口配置 (Entity Context Window) - 阶段 13 物化
# ------------------------------------------------------------------------------
# 控制 extract_entity_context() 提取实体特异性上下文时的窗口参数。
# 自 v3.6.0 起由阶段 13 (ctx_materializer) 物化为 'content_ctx' 列,
# 供下游 14 (强度)、15 (对齐)、21 (LLM)、22 (词典)、23 (BERT) 共享。
# 学术依据:
#   Hassan, T. A., Hollander, S., van Lent, L., & Tahoun, A. (2019).
#     Firm-level political risk: Measurement and effects. The Quarterly
#     Journal of Economics, 134(4), 2135-2202. DOI: 10.1093/qje/qjz021
#     → Proximity-based Attribution: 以目标实体为锚点，提取局部窗口文本
#   Andreou, P. C., Lambertides, N., Magidou, M., & Maruska, A. E. (2026).
#     Measuring R&D activity through 10-K narrative disclosures.
#     Research Policy, 55(3), 105409. DOI: 10.1016/j.respol.2025.105409
#     → Core-contextual word-pairing within a span (思想锚点)。
#     ⚠ 本项目 stage 12b 生产默认操作化 = 【±1 句窗口邻近共现】(sentence_radius=1, 命中句
#       前后各 1 句、共 3 句窗口内含 ≥1 金科词), 是 Andreou "10 lexical tokens span" 的句级
#       窗口操作化 (非逐字复刻); radius=0 严格同句为其零半径/最严特例 (稳健性备选)。
#       须在 manuscript 如实披露此生产邻近共现口径 (见 cooccurrence_filter 下方)。
# 敏感性检验: 65_radius_sensitivity.py 对 radius ∈ {0,1,2,3} 执行完整稳健性检验
#
# 三轨 (ss 银行+金科同句共现轨, 2026-06-14): content_ss 由同一阶段 13 物化,
#   锚点为"同句内 目标银行 ∧ 金科词 共现"(extract_bank_fintech_cooccurrence)。
#   ss_sentence_radius 控制命中句前后扩窗句数 (默认同 sentence_radius=1)。
#   回退=镜像 ctx: 无共现→content_ss=全文 body, ss_is_fallback=True。
context_window:
  sentence_radius: 1                                    # 句子级窗口半径（1 = 命中句前后各1句，共3句）
  fallback_char_radius: 150                             # 回退时的字符级窗口半径（文本过短无法分句时启用）
  ss_sentence_radius: 1                                 # ss 轨(银行+金科同句)命中句前后扩窗半径（默认同 sentence_radius）

# ------------------------------------------------------------------------------
# [模块二：stage 12b] 银行×金科【±1 句窗口】邻近共现硬过滤 (Andreou et al. 2026 句级窗口操作化)
# ------------------------------------------------------------------------------
# 只保留 "目标银行与 ≥1 金科词在【±1 句窗口】(命中句前后各 1 句, 共 3 句) 内邻近共现" 的
# 文章行 (生产默认 sentence_radius=1 = ±1 句窗口邻近), 丢弃其余, 降低 stage 12 关键词判定的
# 虚假相关 (False Positives)。判据 = core/text/entity_context.has_bank_fintech_cooccurrence_within_radius:
# radius=1 时窗口闭区间 [i-1, i+1] → 要求银行锚句 i 或其前后邻句含 ≥1 金科词 (邻近共现);
# radius=0 收窄为 [i, i] 坍缩到银行锚句自身 = 严格同句 (最严零半径特例, 仅作稳健性备选)。
# ±1 句窗口邻近是 Andreou 邻近配对 / Hassan 邻近归因谱系的句级窗口操作化; radius=0 同句为其最严特例。
# ⚠ 短文 caveat: "±1 句窗口邻近"严格成立于长文 (≥3 句可分句); 短文 (<3 句无法分句) 走
#   _char_level_fallback 字符窗 (±fallback_char_radius=150 字), 该路径【忽略 sentence_radius】、
#   以"银行出现位 ±150 字内含金科"近似窗口共现 (与 _ss 轨同款字符窗近似), 既可能过保留 (相邻句 <150 字)
#   也可能过丢弃 (窗口内但银行金科相隔 >150 字)。keep 率 gate 须分长/短文本两层披露。
# 路线 A (纯接受-披露): 12b 仅丢行, 下游 controls.py/encode.py 零改动; 派生量
# (n_articles/fintech_share/attention 族①(firm-level)/NF) 统计宇宙平移为 "邻近相关金科"
# 口径, 在 manuscript/codebook 披露。⚠ 地理 attention 族 (ft_attn_*/ft_vol_*) 直读
# 12_fintech_news_full、不经 12b → 仍原始关键词口径 (与 12b 正交, 须单独披露)。
# fallback_char_radius 复用上方 context_window 同名键。
# ⚠ _ss 轨交互 (frac_ss_fallback 三态恢复, 用户 2026-06-29 决策"改回 ±1 句窗口邻近"的下游后果):
#   _ss 轨命中判据恒为【严格同句】(extract_bank_fintech_cooccurrence)。三态: ① radius=0 +
#   match_in_title=False (最旧) → 存活行均含银行∧金科同句 → frac_ss_fallback→≈0 (零方差坍缩);
#   ② radius=0 + match_in_title=true (前态) → 标题回补行正文无同句 → 已部分恢复 ∈(0,1);
#   ③ radius=1 + match_in_title=true (本态) → 再新增"仅邻句非同句"存活行 (正文无银行∧金科同句)
#   → frac_ss_fallback 进一步恢复。content_ss 文本信号仍有效且与 full/ctx 文本不同。
# ⚠ 标题盲区披露 (match_in_title, 2026-06-29): 旧实现共现判据【只读正文 内容、看不到标题】,
#   而下游 stage 21 full 轨读 content_full=标题+正文 → 口径不一致: 一篇"标题已点明 X银行∧
#   金科、正文用指代/承前省略主语 (银行别名与金科词跨正文句)"的真报道被本阶段误删, 且
#   stage 21 在上游被删后无法回补 (单向假阴性)。match_in_title=true 把共现判据评估到【标题+
#   正文】并集 (prepend_title), 使两阶段口径对齐; 精度近乎不降 (标题字面配对即真报道)。残余
#   保守召回损失 (标题与正文均未在单句配对、相关性仅由跨句指代承载) 经 65_radius_sensitivity
#   的标题×半径网格量化并如实披露 (方向偏保守 against-H1)。权威计划 =
#   scripts/audit/STAGE13_COOCCURRENCE_MATCH_IN_TITLE_EXECUTION_PLAN_2026-06-29.md
cooccurrence_filter:
  sentence_radius: 1                                    # 生产默认 1 = ±1 句窗口邻近共现 (命中句前后各 1 句, 共 3 句; 用户 2026-06-29 决策: 改回邻近共现, 取代 2026-06-27 的 radius=0 严格同句); 0 = 严格同句最严特例, 仅作稳健性备选
  match_in_title: true                                  # 2026-06-29: 共现判据纳入标题 (标题+正文一起切句判共现); true=与 stage 21 full 轨口径一致, 保住"标题点明银行∧金科"的报道; false=旧行为(仅正文), 供消融/复现旧 golden 宇宙
  min_keep_frac: 0.001                                  # 保留率下限守卫 (仅防全库误删; 真实阈值由生产 keep 率 gate 实测后回写)

# ------------------------------------------------------------------------------
# [模块三：新闻情感模块] 统一 LLM 语义精筛与情感分析 (Tone LLM Processing) - 阶段 21
# ------------------------------------------------------------------------------
# 使用大语言模型对规则预筛后的候选文章进行语义验证和情感定性（通过思维链，单次调用完成两项任务）。
