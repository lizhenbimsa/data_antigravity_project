      "小幅": 0.5
      "些许": 0.4
      "轻微": 0.4
      "稍稍": 0.4
      "几乎不": 0.3

    # 转折连词集合（转折后的内容更能反映作者真实立场，权重提升 adversative_boost 倍）
    adversative_words:
      # A. 强转折
      - "但是"
      - "然而"
      - "却"
      - "可是"
      - "反而"
      - "相反"
      - "但"
      - "偏偏"
      - "岂料"
