# ==============================================================================
# 新闻处理流水线配置文件 (News Processing Pipeline Configuration)
# ==============================================================================
# 本文件包含新闻数据处理流水线各阶段所需的全部配置参数。
# 各配置段按流水线阶段顺序组织。

# ------------------------------------------------------------------------------
# 文件路径配置 (File Paths)
# ------------------------------------------------------------------------------
# 定义所有输入/输出目录及外部资源文件的路径。
# 以 "./" 开头的路径会被自动解析为相对于项目根目录 (news_process/) 的绝对路径。
paths:
  raw_data_dir: ./data_excel                       # 原始 Excel 数据文件所在目录
  output_dir: ./data_processed                     # 各阶段处理结果输出目录
  log_dir: ./logs                                  # 日志文件输出目录
  stopwords_zh: ./config/zh_stopwords.txt           # 中文停用词表
  stopwords_en: ./config/en_stopwords.txt           # 英文停用词表
  noise_patterns_file: ./config/noise_patterns.json # 噪声模式正则表达式文件
  media_weights_file: ./config/media_weights.json   # 媒体权重评分文件
  bank_names_file: ./config/bank_names.json         # 银行名称及其别名映射文件（用于11步银行新闻分类）
  bank_keywords_file: ./config/bank_keywords.json   # 银行关键词列表文件（用于00步内容过滤，保留包含银行关键词的新闻）
  # [已移除] 以下中国人民银行相关条目已从 bank_names.json 和 bank_keywords.json 中移除：
  # - 中国人民银行  # - 人民银行   # - 人行   # - 中国中央银行   # - 中国央行   # - 我国中央银行   # - 我国央行
  fintech_dict_file: ./config/fintech_dict.json     # 金融科技关键词词典文件
  bank_name_exclusions_file: ./config/bank_name_exclusions.json  # 银行名称否定模式与短名歧义消解配置
  tone_dicts_file: ./config/tone_dicts.json         # 情感词典文件（正面/负面/否定词等）
  sentiment_dicts_dir: ./config/sentiment_dicts      # 情感分析辅助词典目录

# ------------------------------------------------------------------------------
# 输出文件名配置 (Output Filenames)
# ------------------------------------------------------------------------------
# 各处理阶段输出的 Parquet 文件名，存放于 paths.output_dir 目录下。
filenames:
  # 键名格式: output_XX_描述（XX = 生成该文件的脚本前缀编号）
  output_00_preprocessing: 00_preprocessing.parquet       # 00_preprocessing.py → 数据预处理（加载、过滤、标准化、去重）
  output_11_bank_news: 11_bank_news.parquet               # 11_news_bank.py → 银行新闻分类
  output_12_fintech_news: 12_fintech_news.parquet         # 12_news_fintech.py → 金融科技新闻分类（仅保留金融科技新闻）
  output_12_fintech_full: 12_fintech_news_full.parquet    # 12_news_fintech.py → 全量分类结果（含非金融科技，用于人工验证抽样）
  output_21_tone_llms: 21_tone_llms.parquet               # 21_tone_llms.py → LLM 语义精筛与情感分析（仅 llm_verified=True）
  output_21_tone_llms_full: 21_tone_llms_full.parquet     # 21_tone_llms.py → LLM 全量结果（含 llm_verified=True/False，供验证模块使用）
  output_22_words_tone: 22_words_tone.parquet             # 22_tone_words.py → 词典法情感分析
  output_23_bert_tone: 23_bert_tone.parquet               # 23_tone_berts.py → BERT 模型情感分析
  output_32_human_sample: 32_human_samples.xlsx           # 32_news_llms_human.py → 人工验证样本（含真伪与情感标注）

# ------------------------------------------------------------------------------
# 并行处理配置 (Parallel Processing)
# ------------------------------------------------------------------------------
parallel:
  n_jobs: -1                                        # 并行工作进程数（-1 表示使用全部CPU核心）
  batch_size: 5000                                  # 每批次处理的数据行数

# ------------------------------------------------------------------------------
# [模块一：新闻预处理模块] 数据预处理 (Preprocessing) - 阶段 00
# ------------------------------------------------------------------------------
# 控制数据加载、清洗、过滤等预处理步骤的参数。
preprocessing:
  fasttext_model_path: models/lid.176.bin           # FastText 语言检测模型路径
  text_column: 内容                                  # 主要文本列名
  min_lang_detect_length: 15                        # 语言检测所需的最小文本长度（字符数）
  sheet_name: Sheet1                                 # Excel 工作表名称

  # --- 媒体类型过滤 ---
  # 需要排除的媒体类型列表（按"媒体类型(中文)"字段匹配）
  media_types_to_exclude:
  - APP
  - 微博
  - 政府
  - 网页(U)

  # --- 关键字段缺失值检查 ---
  # 以下字段中任一为空值时，该条记录将被移除
  key_columns_for_na_check:
  - 标题
  - 内容
  - 媒体(中文)
  - 日期

  # --- 保留列 ---
  # 从原始 Excel 文件中仅保留以下列，其余列将被丢弃
  required_columns:
  - docid
  - pubcode
  - 媒体(中文)
  - 媒体类型(中文)
  - 内容
  - 日期
  - 标题
  - 版面
  - 栏名
  - 页号
  - 作者
  - 国家地区/省份
  - 城市

  # --- 媒体地域过滤 ---
  # 仅保留"国家地区/省份"字段匹配以下地区的记录（中国大陆省级行政区划）
  mainland_china_regions:
  - 中国
  - 北京
  - 天津
  - 上海
  - 重庆
  - 河北
  - 山西
  - 辽宁
  - 吉林
  - 黑龙江
  - 江苏
  - 浙江
  - 安徽
  - 福建
  - 江西
  - 山东
  - 河南
  - 湖北
  - 湖南
  - 广东
  - 海南
  - 四川
  - 贵州
  - 云南
  - 陕西
  - 甘肃
  - 青海
  - 内蒙古
  - 广西
  - 西藏
  - 宁夏
  - 新疆
  - 香港
  - 澳门
  - 台湾

  # --- 标题和内容长度过滤阈值 ---
  title_min_length: 2                               # 标题最少汉字数
  content_min_length: 100                            # 内容最少汉字数
  content_max_length: 10000                          # 内容最多汉字数

  # --- 广告/公告类标题关键词 ---
  # 标题、版面、栏名中包含以下关键词的记录将被移除
  ad_keywords:
  - 广告
  - 公告
  - 公示
  - 启事
  - 通知
  - 通报
  - 声明
  - 信息披露
  - 年度报告
  - 半年度报告
  - 半年度度报告
  - 季度报告
  - 基金合同摘要
  - 半年报摘要
  - 年报摘要
  - 说明书摘要
  - 意向书摘要
  - 半年报正文
  - 年报正文
  - 说明书正文
  - 基金合同正文
  - 意向书正文
  - 招募说明书
  - 权益变动报告书
  - 专项报告
  - 专项说明
  - 股票预案
