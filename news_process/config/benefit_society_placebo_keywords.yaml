# benefit_society — 业务线安慰剂 (placebo) 关键词集
# ============================================================================
# V2.0 J-L-M 2026 RFS 稳健性对齐计划 §3 Phase 1 P1.1 + P1.2:
#
# 按照 J-L-M 2026 §4.2 的 placebo industries 方法论, 本 yaml 定义
# 4 条银行业务线 (非金融科技) + 1 条中性基线。每条业务线先用这些
# 关键词做文章级过滤, 再把【同一套】主分析的金融科技专属 10 对锚点
# 方向向量投影到过滤后的子集上。
#
# 验收逻辑 (AC-S1, 计划 §4):
#   若 ≥4/5 条 placebo 设定满足 `|β_placebo / β_fintech_main| < 0.3`, 则
#   说明主信号不是由"报道总体语气"驱动 — 主测度稳健。
#
# 白话: 拿"房贷""信用卡"这类跟金融科技无关的新闻, 用同一把"金融科技
#       效益"尺子去量 — 如果这些无关新闻也量出强信号, 说明尺子量的其实
#       是新闻的普遍语气而非金融科技; 量不出才证明主指标真有针对性。
#
# 这些是基础 (BASE) 关键词集; 用户可经 jieba TF-IDF 扩展
# (不在 V2.0 计划 §3 Phase 1 P1.1 范围内; 见计划 §5 [R1.A])。
# ============================================================================

schema_version: "1.0"

# 4 条业务线过滤器 (非金融科技) — 用于构造 placebo
# 该业务线新闻文章应当**不**强烈响应 fintech 经营效益锚点投影
#
# 披露 (fix(S13, 2026-07-14; 更新 S13-v2, 2026-07-22 词典 607 换血): branch_channel
# 词表内与 fintech_dict.json (607 词金科词表, 2026-07-21 换血) 的精确交集 (恰 1 词,
# 全部 4 条业务线 × 全部关键词中唯一重叠项) 由「智能柜员机」(已随换血出局) 变为
# 「自助银行」(607 新入词)。构念上双属可辩护 (自助银行既是网点渠道设施也是金融科技
# 具体应用) —— 方向保守: 该交集会使 branch_channel 这条 placebo 更容易 "响应 fintech
# 锚点投影", 即让此项 placebo 检验偏严, 不会虚高主测度的稳健性结论。裁定 (镜像
# 2026-07-14 先例, 用户 2026-07-22 授权全项目 607 化): 保留该词 + 白名单换血为
# {自助银行}, 不再反复; 详见 Table A10 注记与 scripts/audit/
# PROMPT_ASSETS_AUDIT_EXECUTION_PLAN_2026-07-12.md §2 S13 及
# NINE_ENTRYPOINT_RUN_AUDIT_AND_REMEDIATION_PLAN_2026-07-21.md §4.1。
business_lines:
  housing_loans:
    label_en: "Housing Loans"
    label_zh: "住房贷款"
    keywords:
      - "房贷"
      - "按揭"
      - "个人住房贷款"
      - "个人房贷"
      - "住房按揭"
      - "个人住房按揭贷款"
      - "个贷"
      - "商业性个人住房贷款"
      - "公积金贷款"
  credit_cards:
    label_en: "Credit Cards"
    label_zh: "信用卡"
    keywords:
      - "信用卡"
      - "透支"
      - "信用消费"
      - "信用卡分期"
      - "信用卡贷款"
      - "信用卡账单"
      - "信用卡发卡"
      - "联名卡"
      - "账单分期"
  intermediate_business:
    label_en: "Intermediate Business"
    label_zh: "中间业务"
    keywords:
      - "中间业务"
      - "手续费收入"
      - "财富管理"
      - "资产管理"
      - "投行业务"
      - "咨询服务"
      - "代理业务"
      - "托管业务"
      - "委外业务"
  branch_channel:
    label_en: "Branch Channel"
    label_zh: "网点渠道"
    keywords:
      - "营业网点"
      - "营业部"
      - "支行"
      - "智能柜员机"  # S13-v2 (2026-07-22): 已不在 607 词典, 不再构成交集; 作为纯网点渠道词保留
      - "自助银行"  # S13-v2 (2026-07-22): 与 607 词典精确交集(恰1词, 见头注披露); 方向保守, 保留不删
      - "网点改造"
      - "网点转型"
      - "物理网点"
      - "城市分行"

# 1 条中性基线 — 不涉及任何具体业务主题的一般性银行新闻
# 该过滤应当与 fintech 锚点投影完全无关 (sanity 中性词 placebo)
neutral_baseline:
  general_corporate:
    label_en: "General Corporate"
    label_zh: "通用公司事务"
    keywords:
      - "周年庆典"
      - "新春茶话"
      - "记者会"
      - "新闻发布会"
      - "行长会议"
      - "党委会议"
      - "干部任命"
      - "组织架构调整"

# 过滤逻辑 (按计划 §3 P1.2):
#   对每条业务线 `bl`:
#     1. `keywords` 中任一关键词出现在 标题 或 内容 中即判定文章命中
#     2. 构造过滤后的 DataFrame
#     3. 用主分析的 10 对 fintech 锚点方向向量对过滤后文章做投影
#     4. 聚合到 bank-year → `benefit_placebo_<bl>_mean` 列
#
# 命中率校验 (按计划 §5 R1.A):
#   任一业务线命中文章 < 500 篇时, 记 warning 后继续;
#   若 ≥2 条业务线不达标, 回退为 ≤3 条业务线 + 中性基线。
