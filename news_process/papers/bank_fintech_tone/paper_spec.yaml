# Paper spec for P1 — bank_fintech_tone (existing, retrofit per plan §B.1)
# Authoritative source of truth at M0 G0 acceptance.
# Schema reference: papers/_common/paper_spec_schema.py
# Plan v2.x: spec_version ≤ 2.x per §13 R1-m07/R6-m02

paper_id: bank_fintech_tone
spec_version: 2.0.0
status: existing  # v3.2.0 已存在, M0 retrofit spec
differentiation_claim: |
  P1 度量媒体对银行的语调情感方向 (积极 / 消极, 连续情感得分 llm_vote_tone_full)。
  R20-m01 跨 paper 区分 (B-route 3 + existing 4 paper, 共 7 对照):
  - 与 P2 (attention): P1 度量情感方向 (sign + magnitude); P2 度量曝光强度 (cumulative attention without sign); 二者独立 channel
  - 与 P3 (substance): P1 度量连续 tone 情感; P3 度量银行 fintech 公告的 W&Z 二元 substantive vs symbolic; outcome 亦分化 — P1 主打资金成本 (储户纪律), P3 主打成本收入比 3 年前向变化 (效率试金石); 两篇的上市行 CAR 扩展窗口也不同 (P1 tone shock 触发 vs P3 fintech 公告触发)
  - 与 P4 (locus): P1 度量连续 tone; P4 区分公告的 locus 二元属性 (底层/应用); 完全不同 dimension
  - 与现有 llm_peer: P1 不构造同业网络 IV, 仅用 firm-level tone; llm_peer 用 LLM-determined semantic peer 网络
  - 与现有 brokerage_network: P1 不用网络中心性, 仅 firm-level; brokerage 用 betweenness/constraint/eigenvector
  - 与现有 benefit_society: P1 用 LLM-vote tone (情感方向); benefit_society 用 LLM-Embedding 双极锚点投影 (态度强度, 不是情感)
  - 与现有 strategic_diff: P1 度量 firm 自身 tone; strategic_diff 度量 firm 在 N-邻群中的差异度 (distinctness, not tone)

outcome:
  # outcome 重定位 (2026-06-13, 年度数据约束 + 顶刊 outcome 组合定稿):
  # 全项目统一年度 bank-year 面板 → 事件窗 CAR (需日频收益) 不再作 primary。
  # P1 新主因变量 = 资金成本 (储户纪律范式: 媒体语调 → 储户/债权人风险感知 →
  # 计息负债定价; Martinez Peria & Schmukler 2001 JF; 挤兑微观证据 Iyer & Puri
  # 2012 AER)。年度全样本可用 (非上市行亦覆盖), 优于仅覆盖上市行的 CAR。
  primary: funding_cost  # = 利息支出 / 计息负债年均余额 (年度, 全样本)
  # tobin_q = 特许权价值通道 (Keeley 1990 AER, 上市行子样本; 与 strategic_diff
  # 的 outcome.primary 共享列名但角色不同 — 此处仅 secondary)。
  # roa 仅作 outcome.secondary, 不在 controls 中复用 (R1-M13)。
  # deposit_growth 留在 controls, 刻意不作 outcome (避免同列双角色)。
  secondary: [loan_growth, roa, tobin_q]
  # legacy (上市行扩展, 非年度主线): car_3day_window_tone_shock (R10-M01 命名,
  # tone shock 事件窗口) 降级为 listed-subsample 附表扩展, 待日频数据可得时启用。
  listed_subsample_extension: car_3day_window_tone_shock
  enrichment_source: M0.5.11 (财务面板 利息支出/计息负债/贷款余额/ROA + Wind 市值
    → tobin_q; CAR 扩展需 CSMAR/Wind daily returns, 非主线)

treatment:
  # v3.6.0 (Plan E P4 G3): main treatment 切换至 _ctx
  # 学术依据: Tetlock 2007 JF / Loughran-McDonald 2016 JAR 现代标准要求
  # entity-attributed sentiment 作 main, 因为 P1 度量"对该银行"的报道情感而非全文情感
  primary: llm_vote_tone_ctx
  alternative:
    # _full 路径降级为 alternative (保留 v3.5.0 既有结果作 robustness 对照)
    - llm_vote_tone_full
    # 双轨 robustness battery (per Tetlock 2007 / L&M 2016 Table III 标准)
    - gpt54nano_tone_ctx
    - gemini31111_tone_ctx
    - deepseekv4_tone_ctx
    - gpt54nano_tone_full
    - gemini31111_tone_full
    - deepseekv4_tone_full

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务控制 5 列 (ln_assets/
  # leverage/capital_ratio/npl_ratio/deposit_growth) + year_level 宏观 2 列
  # (gdp_growth/m2_growth) 在当前 bank-year panel (40/51) 全为 0 命中 —
  # enrichment pending (M0.5.11 / config/银行面板2007-2025年.xlsx 待接入)。
  # 复现包 01_data_prep 以 capture confirm 自校验拼装 $bank_controls, 只用实存列。
  bank_level: [ln_assets, leverage, capital_ratio, npl_ratio, deposit_growth]
  year_level: [gdp_growth, m2_growth]
  fixed_effects: [bank_fe, year_fe]

identification:
  baseline: long_panel_within_bank_within_year
  iv:
    # fix(omni-g-papers-misc-12, 2026-06-11): 旧 primary=leave_one_out_industry_tone
    # 全管线零实现 (0 builder / 0 panel 列 / 0 模板引用, 仅 spec 自指)。改指
    # pipeline 真实物化的地理 leave-one-out tone 族 (同省其它银行 LOO 均值,
    # Cao et al. 2025 RAS 风格 firm-level LOO; 替换理由: "行业=全体银行" 的
    # LOO 变体未实现, 地理 LOO 是当前唯一在产的 LOO tone IV; ctx=主轨)。
    primary: prov_leave1out_tone_ctx     # 省级 LOO tone (main=ctx 轨; prov_leave1out_tone_full 作 robustness)
    fallback: bartik_type_iv_ctx         # Bartik shift-share (panel 真实列; full 轨同)
    # 已知缺口披露: P1 复现包现行唯一 IV 表 22_tableA3_bartik_iv.do 工具化的
    # 内生变量是 LOCUS 占比 (tech_frac), 不是 tone — tone-IV .do 模板待 M5 接线。

event_studies:  # 引用 Appendix C events by id
  - E1   # 2013-06-13 yuebao_launch
  - E2   # 2016-08-24 p2p_regulation
