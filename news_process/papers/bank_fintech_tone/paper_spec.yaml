# Paper spec for P1 — bank_fintech_tone (existing, retrofit per plan §B.1)
# Authoritative source of truth at M0 G0 acceptance.
# Schema reference: docs/plan/B_route_master_plan_v2.md §5.2.3.bis
# Plan v2.x: spec_version ≤ 2.x per §13 R1-m07/R6-m02

paper_id: bank_fintech_tone
spec_version: 2.0.0
status: existing  # v3.2.0 已存在, M0 retrofit spec
differentiation_claim: |
  P1 度量媒体对银行的语调情感方向 (积极 / 消极, 连续情感得分 llm_vote_tone_full)。
  R20-m01 跨 paper 区分 (B-route 3 + existing 4 paper, 共 7 对照):
  - 与 P2 (attention): P1 度量情感方向 (sign + magnitude); P2 度量曝光强度 (cumulative attention without sign); 二者独立 channel
  - 与 P3 (substance): P1 度量连续 tone 情感; P3 度量银行 fintech 公告的 W&Z 二元 substantive vs symbolic; outcome 事件窗口也不同 — P1 用 car_3day_window_tone_shock (tone shock 触发), P3 用 car_3day_window_fintech_announcement (fintech 公告触发)
  - 与 P4 (locus): P1 度量连续 tone; P4 区分公告的 locus 二元属性 (底层/应用); 完全不同 dimension
  - 与现有 llm_peer: P1 不构造同业网络 IV, 仅用 firm-level tone; llm_peer 用 LLM-determined semantic peer 网络
  - 与现有 brokerage_network: P1 不用网络中心性, 仅 firm-level; brokerage 用 betweenness/constraint/eigenvector
  - 与现有 benefit_society: P1 用 LLM-vote tone (情感方向); benefit_society 用 LLM-Embedding 双极锚点投影 (态度强度, 不是情感)
  - 与现有 strategic_diff: P1 度量 firm 自身 tone; strategic_diff 度量 firm 在 N-邻群中的差异度 (distinctness, not tone)

outcome:
  primary: car_3day_window_tone_shock  # R10-M01: 重命名差异化 (tone shock 事件窗口, 与 P3 fintech announcement 窗口区分)
  secondary: [loan_growth, ln_market_cap, roa]  # R1-M13: roa 仅作 outcome.secondary, 不在 controls 中复用
  enrichment_source: M0.5.11 (CSMAR/Wind daily returns + 年报 ROA + Wind 季报 ln_market_cap;
    derived event-window CAR construction per §5.3.2 M0.5.11)

treatment:
  # v3.6.0 (Plan E P4 G3): main treatment 切换至 _ctx
  # 学术依据: Tetlock 2007 JF / Loughran-McDonald 2016 JAR 现代标准要求
  # entity-attributed sentiment 作 main, 因为 P1 度量"对该银行"的报道情感而非全文情感
  primary: llm_vote_tone_ctx
  alternative:
    # _full 路径降级为 alternative (保留 v3.5.0 既有结果作 robustness 对照)
    - llm_vote_tone_full
    # 双轨 robustness battery (per Tetlock 2007 / L&M 2016 Table III 标准)
    - gpt54nano_tone_ctx
    - gemini31111_tone_ctx
    - deepseekv4_tone_ctx
    - gpt54nano_tone_full
    - gemini31111_tone_full
    - deepseekv4_tone_full

controls:
  bank_level: [ln_assets, leverage, capital_ratio, npl_ratio, deposit_growth]
  year_level: [gdp_growth, m2_growth]
  fixed_effects: [bank_fe, year_fe]

identification:
  baseline: long_panel_within_bank_within_year
  iv:
    primary: leave_one_out_industry_tone  # Cao et al. 2025 RAS 风格但 firm-level

event_studies:  # 引用 Appendix C events by id
  - E1   # 2013-06-13 yuebao_launch
  - E2   # 2016-08-24 p2p_regulation
  - E3   # 2017-04-27 asset_management_rules
  - E4   # 2020-11-03 ant_ipo_pause

targets:
  primary_outlet: JFQA
  ambitious_outlet: [RFS, JFE]  # R75-m01: 2-tier ambitious 与 §3.2 P1 v2 ambitious "RFS / JFE" 一致
  backup_outlet: [JCF, JBF]  # R48-M01 + R50-M01: list 形式与 §3.1 P1 backup 列 "JCF / JBF" 完整对齐
  submission_window: 2027-03-15

sample:
  n_bank_min: 200  # M-1 G-1 确认后 update
  t_year: 18
  obs_target_min: 3000

audit_rounds_target_min: 8  # M5 ≥ 8 / M6 ≥ 5 per §5.8.4 / §5.9.5

# v3.5.0 D2 8-cell decomposition Table 6 — P1 不用 D2 主回归 (per plan §2.1.6)
# v3.5.1 A3 Numerical Intensity Robustness Table A9 (per stage3_v3_5_1_a1_a3_supplementation_plan.md §2.5.2)
tables:
  t6:
  tA7:
    template:       # A1 主用 P3/P4/P5
  tA8:
    # v3.7.3 (Plan A v1.0 实施): _title 轨稳健性
    # Anchor: Heston & Sinha (2017) FAJ; Loughran & McDonald (2016) JAR survey;
    #          Boudoukh et al. (2019) RFS; Campbell & Fiske (1959) MTMM.
    # 本计划将 _title 轨从 audit-only 提升为 9 paper Tier-B 稳健性测度.
    template: 25_tableA8_title_robustness
    title_robustness:
      anchor: "Heston & Sinha (2017) FAJ; LM (2016) JAR survey §6; Boudoukh et al.
        (2019) RFS"
      track_substitute: true  # main = _ctx → 替换为 _title 跑同 spec
      r3_h1_compatible: true  # A1/A3 不在 _title 上 (per v3.5.1 R3-H1), 仅 sentiment robustness
      audit_response_ref: 
        docs/methodology/title_track_as_robustness.md#5-audit-response-template-for-peer-review
      panel_d_caveat: Stratification by frac_title_mentions_fintech across thresholds
        {0.3, 0.5, 0.7} per Antweiler-Frank (2004) JF 59(3) subject-relevance convention.
        Per-cell graceful skip if N < 30 bank-year.
      panel_e_caveat: Stratification by frac_title_long (above/below bank-year median
        title length) per Da-Engelberg-Gao (2011) JF 66(5) attention-channel separation.
        Per-cell graceful skip if N < 30.
  tA9:
    template: 27_tableA9_num_intensity
    num_intensity_robustness:
      anchor: "Hales, Kuang & Venkataraman (2011) CAR 28(1)"
      dual_track: true  # 真双轨 (修 R3-C2)
