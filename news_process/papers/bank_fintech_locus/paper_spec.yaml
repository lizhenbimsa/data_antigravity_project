# Paper spec for P4 — bank_fintech_locus (new, per plan §B.4)
# Authoritative source of truth at M0 G0 acceptance.
# Schema reference: papers/_common/paper_spec_schema.py

paper_id: bank_fintech_locus
spec_version: 2.0.0
status: new
differentiation_claim: |
  P4 区分银行 fintech 媒体话语中的"底层技术 (区块链 / AI / 云)"与"应用场景 (支付 / 信贷 / 理财)"，
  检验差异化的市场反应与创新产出 (Gomber 2018 JMIS + Goldstein-Jiang-Karolyi 2019 RFS)。
  R17-m01 + R21 跨 paper 区分 (B-route 4 + existing 4 paper, 共 8 对照; v3.4.0 + P5 = 9 paper):
  - 与 P1 (tone): P4 区分公告的 locus 二元属性 (底层/应用); P1 度量连续 tone
  - 与 P2 (attention): P4 度量 locus 二元对照 (1 paper 2 treatment indicators); P2 度量曝光强度 (单一 scalar)
  - 与 P3 (substance): P4 关注 locus (技术维度); P3 关注 substantiveness (实质 vs 象征维度) — 二维交叉但独立
  - 与 P5 (collab_mode, v3.4.0 epoch 4): P4 度量 Gomber 2018 二元 locus (底层/应用; enabling technology
    vs business function); P5 度量 Chesbrough 2003 二元 collab_mode (自主/外部; closed vs open innovation);
    不同框架 (technology layer vs organization source); 二维交叉但独立 (2² cross-tab cells);
    P4 主回归保持 locus pair 作 treatment, collab_mode 仅作 robustness control (Table 5 alternative spec).
  - 与现有 llm_peer: P4 用 leave-one-out peer locus IV (4 银行类型分类同业), llm_peer 用 LLM-determined 语义同业; 命名 surface-相似但 peer 定义机制完全不同
  - 与现有 brokerage_network: P4 **主识别**不构造网络中心性 / 二阶语调 IV (区别 brokerage), 仅 firm-level locus 二元对照;
    network_roles 块仅在附录探索性地用 bank_between_cent 作中介 (跨群知识经纪通道 → 专利, 区别 brokerage 的风险传染通道 → roa) / 异质性, 非主回归 (network-metrics-elevation 2026-06-13)
  - 与现有 benefit_society: P4 度量 locus (二元层属性), benefit_society 度量态度 (LLM-Embedding 投影强度), 维度完全不同
  - 与现有 strategic_diff: P4 度量 locus 自身属性, strategic_diff 度量 firm 在 N-邻群中的战略差异度

outcome:
  # primary 切换 (2026-06-13, 年度数据约束 + 顶刊组合定稿): 二元 treatment 配二元
  # outcome 对照 — 底层技术轨 (区块链/AI/云) 应产出技术创新 (引用加权专利, Kogan
  # 2017 QJE 谱系), 应用场景轨 (支付/信贷/理财) 应产出产品创新/收费业务
  # (noninterest_income_share)。结构对仗 = 本篇卖点; CAR (需日频) 降级为上市行扩展。
  primary: citation_weighted_patent  # 技术创新 (底层技术轨的直接 outcome)
  secondary: [patent_fintech_count, noninterest_income_share]  # 后者 = 应用场景轨对照 outcome; capex_it 留 mediator 角色 (R7-M04/M05)
  listed_subsample_extension: car_5day_window  # 上市行扩展 (非年度主线), 待日频数据
  enrichment_source: M0.5.11 (IncoPat / 国家专利局 patent count + 引用加权 + 财务面板
    非利息收入占比; CAR 扩展需 CSMAR/Wind daily returns, 非主线)
  # R2-M12: Kogan 2017 是 outcome 度量, 不是 IV。市值加权法需股价 → 仅上市行;
  # 非上市行退回引用计数加权 (Hall-Jaffe-Trajtenberg 谱系), 两套并报。
  patent_quality_measure: kogan_2017_market_value_or_citation_count

mediator:  # R7-M04 + R9-m02 + R9-m04
  primary: capex_it
  secondary: r_and_d_intensity
  source: M0.5.11 CSMAR (capex_it) + 国家专利局衍生 R&D investment intensity (r_and_d_intensity);
    用于 16_mechanism.do.tmpl 的 Baron-Kenny mediation

treatment:
  primary_pair: [locus_layer_full, locus_scenario_full]  # R35-M02 derived; 唯一 producer = Stata 01_data_prep.do (不落 parquet)
  primary_pair_construction:  # fix(omni-g-papers-misc-11, 2026-06-11): 与 01_data_prep.do.tmpl:41-43
    # 实际推导对齐 — 由 panel 真实列 tech_frac/app_frac 主导类别二元化;
    # 旧式 "1 if innovation_locus_full == '底层技术'" 引用的是文章级字符串 (不在 bank-year panel)
    locus_layer_full: (tech_frac > app_frac) if both non-missing else missing  # 底层主导 (区块链/AI/云) indicator
    locus_scenario_full: (app_frac > tech_frac) if both non-missing else missing  # 应用主导 (支付/信贷/理财) indicator
  secondary: [locus_gap]
  secondary_construction:
    # fix(omni-g-papers-misc-05, 2026-06-11): 值域补 0 — 平票 (tech_frac == app_frac,
    # 含两者皆 0) 时两 dummy 同为 0 → gap=0 (作参照组), 与模板注释 '∈ {-1, 0, +1}' 一致
    locus_gap: locus_layer_full - locus_scenario_full  # ∈ {-1, 0, +1}

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务控制 5 列 (ln_assets/
  # leverage/capital_ratio/npl_ratio/deposit_growth) + year_level 宏观 2 列
  # (gdp_growth/m2_growth) 在当前 bank-year panel (40/51) 全为 0 命中 —
  # enrichment pending (M0.5.11 / config/银行面板2007-2025年.xlsx 待接入)。
  # 复现包 01_data_prep 以 capture confirm 自校验拼装 $controls, 只用实存列。
  bank_level: [ln_assets, leverage, capital_ratio, npl_ratio, deposit_growth]
  year_level: [gdp_growth, m2_growth]
  fixed_effects: [bank_fe, year_fe]
  # INFER IV-2 修复 (2026-06-14): 聚类设定显式化 (此前 spec 无 cluster 块)。
  # 主规格 = 银行层聚类 (T=19 长面板内 within-bank 序列相关); 稳健性对比多维聚类。
  cluster: [bank]              # 主规格单向银行聚类 (模板 vce(cluster bank_id))
  cluster_robustness:         # 多维聚类对比 (small-G 时配 wild bootstrap, 见 inference 块)
    - bank_only
    - bank_year_twoway
    - bank_type_year_twoway

# INFER IV-2 修复 (2026-06-14): 推断纪律块 — 显式区分单一 confirmatory 主规格与
# exploratory 稳健性/多测度族 (List-Shaikh-Xu 2019 EE confirmatory-vs-exploratory;
# Romano-Wolf 2005 ECMA family-wise; 观测性研究不强制 OSF/PAP 预注册)。
inference:
  confirmatory:
    # 单一预设主假设: 底层技术主导 (locus_layer_full) → 技术创新 (引用加权专利)
    primary_hypothesis: "locus_layer_full → citation_weighted_patent (bank FE + year FE)"
    treatment: locus_layer_full
    outcome: citation_weighted_patent
    family: locus_pair          # {locus_layer_full, locus_scenario_full} 双处理同族
  exploratory:                  # 以下全标 robustness/exploratory, 非 co-equal headline
    - ctx_track_twin            # tech_frac_lc 双轨互为稳健性 (高相关孪生, 非独立假设)
    - ss_track_twin             # tech_frac_ls 三轨第三主轨 (银行+金科同句共现轨; full/ctx/ss 互为稳健性, 非独立假设)
    - secondary_outcomes        # patent_fintech_count / noninterest_income_share / car (上市行扩展)
    - heterogeneity_splits      # 三波 fintech / SOE / bank_type / hub / size
    - network_roles             # bank_between_cent 中介/调节 (探索性附录)
    - alternative_classifier    # locus_layer_ctx / locus_layer_ss 替代分类器 (三轨 full/ctx/ss)
    - cross_model_classifier    # {gpt54nano,gemini31,deepseekv4}_tech_frac_full per-model 跨厂商孪生 (co-equal 互为稳健、不分主次;
                                #  2026-07-03 分类维度梯子; ⚠ 声明式文档, fix(N1, 2026-07-14): tech_frac 的真 FWER 待扩
                                #  (27_tableA12 Panel C 现仅覆盖 sub_frac, 对 tech_frac 空指——如实声明, 扩族为独立小改挂 M0 清单);
                                #  禁混同一 Hansen J)
  fwer_correction:
    method: romano_wolf         # rwolf step-down over locus_pair family (18_locus_robustness)
    family_def: "locus_layer_full + locus_scenario_full (treatment family)"
    reps: 1000
  small_g_inference:
    # 银行/省级聚类 G 偏小或政策 DiD few-treated 时, 解析 cluster SE 偏小 → wild bootstrap
    method: wild_cluster_bootstrap   # boottest (Roodman et al. 2019), 9999 reps
    when: "G < 50 or few-treated-cluster event study"
    lit: [Cameron-Miller 2015 JHR, MacKinnon-Webb 2017, Roodman et al. 2019 SJ]
  weak_iv_robust:
    # IV 表 KP F < Stock-Yogo 时改读 weakiv AR CI (20_locus_iv_2sls 已落地真实命令)
    method: anderson_rubin      # weakiv (Finlay-Magnusson-Schaffer)
    lit: [Andrews-Stock-Sun 2019 ARE, Stock-Yogo 2005]
  parallel_trends_sensitivity:
    # RB-3 修复 (2026-06-14): 事件研究平行趋势局部偏离的部分识别敏感性 (相对幅度限制)。
    # 18_locus_robustness 的 honestdid 调用已订正为 ado 真支持的接口 (numpreperiods(3) +
    # 从 reghdfe e(b) Mata 抽 6 event-time 交乘子向量 b()/vcov(); 旧 pre()/post() 选项不存在,
    # 永久 r(198) 被 capture 吞 → 已替换为真命令)。E1=2013 余额宝事件 INLINE 强度事件研究上跑。
    method: honest_did          # honestdid (Rambachan-Roth 2023 RES; delta(rm) 相对幅度)
    m_grid: [0, 0.5, 1, 1.5, 2] # 相对幅度 M-band; pre-trend 联合 F 配套报 (leads −3/−2/−1 = 0)
    event: E1                   # 2013-06-13 yuebao_launch (窗口最长); production T=19 激活, T=2 优雅跳过
    lit: [Rambachan-Roth 2023 RES, Roth 2022 AER:Insights, Sun-Abraham 2021 JoE]

identification:
  baseline: layer_x_event_study  # E1/E4 events × 2 locus class
  iv:  # R2-M12: Kogan 2017 不是 IV; locus IV 用 peer-based
    # 2026-06-13 已物化 (iv_extensions.py): 同银行类型×年 LOO tech_frac 均值
    # (含 _lag1 滞后变体; Manski 1993 / Leary-Roberts 2014 JF 排他性披露)
    primary: leave_one_out_peer_locus_iv  # Cao 2025 RAS 风格
    # fix(iv-final-audit CONS-6/CONS-3, 2026-06-13): 原 fallback
    # layer_scenario_industry_event_iv 是幻影 (引擎 compute_iv_extensions 不产、
    # 模板不引、全仓 0 命中) — 删除。该 "E1/E4 事件作 locus 工具" 的
    # event-as-instrument 设计延期至 M5 (须先在 iv_extensions.py 实现事件×locus
    # 构造才能复活, 当前不存在)。fallback 改为引擎真产的 full 轨滞后变体。
    fallback: leave_one_out_peer_locus_iv_lag1  # full 轨滞后 (规避同期反射稳健性)
    # ctx 轨稳健性镜像 (2026-06-13 终审, iv_extensions.py lpeer_*): 内生孪生
    # tech_frac_lc 配 ctx 同业 LOO 工具 lpeer_locus_iv_ctx, 与 full 轨各自
    # just-identified 并排 (双轨互为稳健性); 非 full×ctx overid。模板 20_locus_iv_2sls。
    # ss 轨稳健性镜像 (三轨第三主轨, 2026-06-14; ss = 银行+金科同句共现轨): 内生孪生
    # tech_frac_ls 配同句同业 LOO 工具 lpeer_locus_iv_ss, 与 full/ctx 轨各自
    # just-identified 并排; 严禁 full×ctx×ss 合成 Hansen J overid (机械 _ctx→_ss swap)。
    secondary:  # 引擎真产的三轨变体 (full/ctx/ss 各自 just-identified, 勿合成 overid)
      - leave_one_out_peer_locus_iv_lag1   # full 轨滞后
      - lpeer_locus_iv_ctx                 # ctx 轨同期 (32 字符约束用 lpeer_ 紧凑前缀)
      - lpeer_locus_iv_ctx_lag1            # ctx 轨滞后
      - lpeer_locus_iv_ss                  # ss 轨同期 (银行+金科同句共现轨)
      - lpeer_locus_iv_ss_lag1             # ss 轨滞后

# 网络位置角色 (network-metrics-elevation 2026-06-13; 蓝图 scripts/audit/NETWORK_METRIC_ELEVATION_BLUEPRINT_2026-06-13.md)。
# 消费 panel 实存共现中心度列 → golden-safe; mediator/heterogeneity 须 production T=19; schema 对本块 no-op。
network_roles:
  mediator:
    column: bank_between_cent   # tech_frac → between (跨群知识经纪) → citation_weighted_patent
    framing: association_decomposition   # 中介内生 (P1-5) → Imai-Keele-Yamamoto ρ 敏感性必报; 探索性附录非因果中介
    status: exploratory_appendix
    lit: [Gomber et al. 2018 JMIS, Burt 1992, Imai-Keele-Yamamoto 2010 Stat.Sci.]
  heterogeneity:
    column: bank_is_hub   # within-year decile (N-08)
    framing: production_t18
    lit: [El-Khatib-Fogel-Jandik 2015 JFE]
  centrality_missing_convention: zero_fill_offnetwork_disclose_N

event_studies:  # P4 applicable events
  - E1   # 2013-06-13 yuebao_launch
  - E4   # 2020-11-03 ant_ipo_pause
  - E5a  # 2022-09-01 data_export_assessment_rules
  - E5b  # 2023-09-30 data_export_management_rules

heterogeneity_wave:  # R4-M03 重定义: 三波严格对称 (各 3 年) + consolidation 独立段
  pre_period: 2007_2012     # pre-fintech baseline
  wave_1: 2013_2015         # 互联网金融 wave (余额宝)
  wave_2: 2016_2018         # 区块链 / 早期 AI wave
  consolidation: 2019_2021  # 蚂蚁叫停后期 monetary tightening + 监管收紧 transition period
  wave_3: 2022_2025         # 大模型 wave

targets:
  primary_outlet: RFS
  ambitious_outlet: JF
  backup_outlet: JFE
  submission_window: 2027-03-15

sample:
  n_bank_min: 200
  t_year: 19
  obs_target_min: 3000

audit_rounds_target_min: 8

# v3.5.0 D2 8-cell decomposition Table 6
tables:
  t6:
    template: 19_table6_cell_decomposition
  tA7:
    template: 19_locus_clarity_robustness
    clarity_robustness:
      anchor: "Loughran & McDonald (2011) JF 66(1); You et al. (2018) hhx055"
      dual_track: true
  tA8:
    template: null  # remove-title-track: 标题轨稳健性表已取消
  tA9:
    template:

# ── WS-E (G6/R-P0-2): 测量效度承诺块 (commitment_status=new; 非伪称兑现) ──
validation:
  commitment_status: new_2026-06-22
  evidence_status: pending_T18_human_annotation
  validity_claim_gate:
    requires_real_human_kappa_for: locus
  criterion_validity:
    stage: 63
    panel: "F"
    method: "3-coder majority gold (R1/R2/R3) vs LLM 3-track; Cohen kappa + Gwet AC1 + Krippendorff alpha"
    hybrid_disclosure: "Panel F (locus) machine label is HYBRID (LLM majority vote + canonicalize_topic keyword confidence adjustment + empty-vote fallback); its criterion/discriminant kappa inherits a keyword circularity absent from pure-LLM substance/collab, so locus validity numbers are NOT directly comparable to the pure-LLM dimensions (R4-EIC-F3)."
  discriminant_validity:
    stage: 73
    method: "focal frac vs clarity/num_intensity |corr| (no directional kappa; non-redundancy aux only)"
    main_evidence: "stage 72 NMI (article-level construct orthogonality)"
    evidence_type: within_single_LLM_method_nonredundancy
  inter_track_reliability:
    stage: 71
    method: "Cohen kappa across full/ctx/ss tracks (machine-machine)"
