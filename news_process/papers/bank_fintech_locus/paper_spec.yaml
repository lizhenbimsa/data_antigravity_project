# Paper spec for P4 — bank_fintech_locus (new, per plan §B.4)
# Authoritative source of truth at M0 G0 acceptance.
# Schema reference: papers/_common/paper_spec_schema.py

paper_id: bank_fintech_locus
spec_version: 2.0.0
status: new
differentiation_claim: |
  P4 区分银行 fintech 媒体话语中的"底层技术 (区块链 / AI / 云)"与"应用场景 (支付 / 信贷 / 理财)"，
  检验差异化的市场反应与创新产出 (Gomber 2018 JMIS + Goldstein-Jiang-Karolyi 2019 RFS)。
  R17-m01 + R21 跨 paper 区分 (B-route 4 + existing 4 paper, 共 8 对照; v3.4.0 + P5 = 9 paper):
  - 与 P1 (tone): P4 区分公告的 locus 二元属性 (底层/应用); P1 度量连续 tone
  - 与 P2 (attention): P4 度量 locus 二元对照 (1 paper 2 treatment indicators); P2 度量曝光强度 (单一 scalar)
  - 与 P3 (substance): P4 关注 locus (技术维度); P3 关注 substantiveness (实质 vs 象征维度) — 二维交叉但独立
  - 与 P5 (collab_mode, v3.4.0 epoch 4): P4 度量 Gomber 2018 二元 locus (底层/应用; enabling technology
    vs business function); P5 度量 Chesbrough 2003 二元 collab_mode (自主/外部; closed vs open innovation);
    不同框架 (technology layer vs organization source); 二维交叉但独立 (2² cross-tab cells);
    P4 主回归保持 locus pair 作 treatment, collab_mode 仅作 robustness control (Table 5 alternative spec).
  - 与现有 llm_peer: P4 用 leave-one-out peer locus IV (4 银行类型分类同业), llm_peer 用 LLM-determined 语义同业; 命名 surface-相似但 peer 定义机制完全不同
  - 与现有 brokerage_network: P4 不构造网络中心性 / 二阶语调 IV, 仅 firm-level locus 二元对照
  - 与现有 benefit_society: P4 度量 locus (二元层属性), benefit_society 度量态度 (LLM-Embedding 投影强度), 维度完全不同
  - 与现有 strategic_diff: P4 度量 locus 自身属性, strategic_diff 度量 firm 在 N-邻群中的战略差异度

outcome:
  # primary 切换 (2026-06-13, 年度数据约束 + 顶刊组合定稿): 二元 treatment 配二元
  # outcome 对照 — 底层技术轨 (区块链/AI/云) 应产出技术创新 (引用加权专利, Kogan
  # 2017 QJE 谱系), 应用场景轨 (支付/信贷/理财) 应产出产品创新/收费业务
  # (noninterest_income_share)。结构对仗 = 本篇卖点; CAR (需日频) 降级为上市行扩展。
  primary: citation_weighted_patent  # 技术创新 (底层技术轨的直接 outcome)
  secondary: [patent_fintech_count, noninterest_income_share]  # 后者 = 应用场景轨对照 outcome; capex_it 留 mediator 角色 (R7-M04/M05)
  listed_subsample_extension: car_5day_window  # 上市行扩展 (非年度主线), 待日频数据
  enrichment_source: M0.5.11 (IncoPat / 国家专利局 patent count + 引用加权 + 财务面板
    非利息收入占比; CAR 扩展需 CSMAR/Wind daily returns, 非主线)
  # R2-M12: Kogan 2017 是 outcome 度量, 不是 IV。市值加权法需股价 → 仅上市行;
  # 非上市行退回引用计数加权 (Hall-Jaffe-Trajtenberg 谱系), 两套并报。
  patent_quality_measure: kogan_2017_market_value_or_citation_count

mediator:  # R7-M04 + R9-m02 + R9-m04
  primary: capex_it
  secondary: r_and_d_intensity
  source: M0.5.11 CSMAR (capex_it) + 国家专利局衍生 R&D investment intensity (r_and_d_intensity);
    用于 16_mechanism.do.tmpl 的 Baron-Kenny mediation

treatment:
  primary_pair: [locus_layer_full, locus_scenario_full]  # R35-M02 derived; 唯一 producer = Stata 01_data_prep.do (不落 parquet)
  primary_pair_construction:  # fix(omni-g-papers-misc-11, 2026-06-11): 与 01_data_prep.do.tmpl:41-43
    # 实际推导对齐 — 由 panel 真实列 tech_frac/app_frac 主导类别二元化;
    # 旧式 "1 if innovation_locus_full == '底层技术'" 引用的是文章级字符串 (不在 bank-year panel)
    locus_layer_full: (tech_frac > app_frac) if both non-missing else missing  # 底层主导 (区块链/AI/云) indicator
    locus_scenario_full: (app_frac > tech_frac) if both non-missing else missing  # 应用主导 (支付/信贷/理财) indicator
  secondary: [locus_gap]
  secondary_construction:
    # fix(omni-g-papers-misc-05, 2026-06-11): 值域补 0 — 平票 (tech_frac == app_frac,
    # 含两者皆 0) 时两 dummy 同为 0 → gap=0 (作参照组), 与模板注释 '∈ {-1, 0, +1}' 一致
    locus_gap: locus_layer_full - locus_scenario_full  # ∈ {-1, 0, +1}

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务控制 5 列 (ln_assets/
  # leverage/capital_ratio/npl_ratio/deposit_growth) + year_level 宏观 2 列
  # (gdp_growth/m2_growth) 在当前 bank-year panel (40/51) 全为 0 命中 —
  # enrichment pending (M0.5.11 / config/银行面板2007-2025年.xlsx 待接入)。
  # 复现包 01_data_prep 以 capture confirm 自校验拼装 $controls, 只用实存列。
  bank_level: [ln_assets, leverage, capital_ratio, npl_ratio, deposit_growth]
  year_level: [gdp_growth, m2_growth]
  fixed_effects: [bank_fe, year_fe]

identification:
  baseline: layer_x_event_study  # E1/E4 events × 2 locus class
  iv:  # R2-M12: Kogan 2017 不是 IV; locus IV 用 peer-based
    # 2026-06-13 已物化 (iv_extensions.py): 同银行类型×年 LOO tech_frac 均值
    # (含 _lag1 滞后变体; Manski 1993 / Leary-Roberts 2014 JF 排他性披露)
    primary: leave_one_out_peer_locus_iv  # Cao 2025 RAS 风格
    # fix(iv-final-audit CONS-6/CONS-3, 2026-06-13): 原 fallback
    # layer_scenario_industry_event_iv 是幻影 (引擎 compute_iv_extensions 不产、
    # 模板不引、全仓 0 命中) — 删除。该 "E1/E4 事件作 locus 工具" 的
    # event-as-instrument 设计延期至 M5 (须先在 iv_extensions.py 实现事件×locus
    # 构造才能复活, 当前不存在)。fallback 改为引擎真产的 full 轨滞后变体。
    fallback: leave_one_out_peer_locus_iv_lag1  # full 轨滞后 (规避同期反射稳健性)
    # ctx 轨稳健性镜像 (2026-06-13 终审, iv_extensions.py lpeer_*): 内生孪生
    # tech_frac_lc 配 ctx 同业 LOO 工具 lpeer_locus_iv_ctx, 与 full 轨各自
    # just-identified 并排 (双轨互为稳健性); 非 full×ctx overid。模板 20_locus_iv_2sls。
    secondary:  # 引擎真产的双轨变体 (与 primary 各自 just-identified, 勿合成 overid)
      - leave_one_out_peer_locus_iv_lag1   # full 轨滞后
      - lpeer_locus_iv_ctx                 # ctx 轨同期 (32 字符约束用 lpeer_ 紧凑前缀)
      - lpeer_locus_iv_ctx_lag1            # ctx 轨滞后

event_studies:  # P4 applicable events
  - E1   # 2013-06-13 yuebao_launch
  - E4   # 2020-11-03 ant_ipo_pause
  - E5a  # 2022-09-01 data_export_assessment_rules
  - E5b  # 2023-09-30 data_export_management_rules

heterogeneity_wave:  # R4-M03 重定义: 三波严格对称 (各 3 年) + consolidation 独立段
  pre_period: 2007_2012     # pre-fintech baseline
  wave_1: 2013_2015         # 互联网金融 wave (余额宝)
  wave_2: 2016_2018         # 区块链 / 早期 AI wave
  consolidation: 2019_2021  # 蚂蚁叫停后期 monetary tightening + 监管收紧 transition period
  wave_3: 2022_2024         # 大模型 wave

targets:
  primary_outlet: RFS
  ambitious_outlet: JF
  backup_outlet: JFE
  submission_window: 2027-03-15

sample:
  n_bank_min: 200
  t_year: 18
  obs_target_min: 3000

audit_rounds_target_min: 8

