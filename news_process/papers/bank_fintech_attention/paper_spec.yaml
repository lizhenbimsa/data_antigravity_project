# Paper spec for P2 — bank_fintech_attention (new, per plan §B.2)
# Authoritative source of truth at M0 G0 acceptance.
# Schema reference: papers/_common/paper_spec_schema.py

paper_id: bank_fintech_attention
spec_version: 2.0.0
status: new
differentiation_claim: |
  P2 度量银行被 fintech 媒体话题"曝光"的强度，独立于情感方向。
  锚点更正 (fix(omni-g-papers-misc-09, 2026-06-11), 同步 attention_media.py 2026-06-10 更正;
  claim-fit 二次收口 2026-06-14 审计 CIT-4):
  主处理 attention_index = ln(1+Σ intensity) 是对 Fang & Peress (2009 JF) **extensive 覆盖**
  构念的 **intensity 加权扩展** — 区别于其无权文章计数 (count/dummy), 本指数按
  fintech_intensity_score (TF·IDF·语义) 给每篇加权; 亦不是 Hassan et al. (2019 QJE) 的
  intensive 归一化份额 (PRisk = 命中 bigram / 总 bigram)。撰稿须在测度节披露
  "计数 vs intensity 加权和" 的区别。Hassan 对标仅限归一化度量
  (attention_pct / attention_intensity_density) 与 ctx 轨 entity-proximity 归因。
  R17-m01 + R21-m01 跨 paper 区分 (B-route 3 + existing 4 paper, 共 7 对照):
  - 与 P1 (tone): P2 度量曝光强度 (cumulative attention without sign); P1 度量情感方向 (sign + magnitude); 二者独立 channel
  - 与 P3 (substance): P2 度量媒体对银行的曝光强度 (cumulative attention from media); P3 度量银行 fintech 公告的 W&Z 实质性 vs 象征性
  - 与 P4 (locus): P2 度量曝光强度 (1D scalar); P4 区分底层 vs 应用场景 (2D treatment pair)
  - 与现有 llm_peer: P2 不构造 LLM-determined peer 网络 IV; llm_peer 用 leave-one-out semantic peer; 二者 IV 机制不同 (P2 fallback Bartik shift-share; llm_peer 语义同业)
  - 与现有 brokerage_network: P2 不构造网络中心性, 仅用 firm-level attention; brokerage 用 betweenness/constraint/eigenvector + 二阶语调 IV
  - 与现有 benefit_society: P2 度量曝光强度 (count); benefit_society 度量态度 (LLM-Embedding 投影强度), 性质不同
  - 与现有 strategic_diff: P2 度量 firm 自身 attention 量; strategic_diff 度量 firm 在 N-邻群中的战略差异度 (distinctness)

outcome:
  primary: ln_fintech_investment  # 银行年报 fintech 投入披露 (年度; Hassan 2019 QJE "测度→企业响应"范式)
  # outcome 扩充 (2026-06-13 顶刊组合定稿): 曝光压力的第二响应通道 = 业务结构调整 —
  # fintech 竞争挤压利差 → 银行转向收费业务 (noninterest_income_share 多元化) 并
  # 优化成本结构 (cost_income_ratio 水平值; 注意区分 P3 的 3 年前向变化量)。年度财务面板直接可构造。
  secondary: [m_and_a_fintech, patent_fintech_count, employee_growth_it,
    noninterest_income_share, cost_income_ratio]
  enrichment_source: M0.5.11 (CSMAR 年报 ln_fintech_investment / Tonghuashun M&A / IncoPat
    patent / CSMAR employee / 财务面板 非利息收入占比+成本收入比)

mediator:  # R8-M01 + R47-M01 + R63-M01: mediator 紧跟 outcome (与 §B.4 + schema 顺序一致)
  primary: ln_fintech_mdna_length
  source: 银行年报 MD&A 章节文本长度 (enrichment M0.5.11; observable proxy 对应 §5.5.2 P2 16_mechanism)

treatment:
  # fix(omni-g-papers-misc-09, 2026-06-11): primary 保持 attention_index_full
  # (extensive 覆盖加权曝光, Fang-Peress 2009 JF 锚); 严格 Hassan 2019 QJE
  # intensive 对标应使用 secondary 中的归一化度量 attention_pct_full /
  # attention_intensity_density_*。
  primary: attention_index_full
  # fix(omni-g-attention-06, 2026-06-11): attention_disp_full 实为跨媒体 outlet
  # 集中度 HHI = Σ(n_o/Σn)² (单 outlet=1, 高值=集中=低分散)。"disp" 系历史命名,
  # 论文表述/系数解读应作 "outlet concentration (HHI)", 勿按 dispersion 反向解读符号。
  secondary: [attention_index_ctx, attention_disp_full, attention_pct_full]
  source: "stage 14_fintech_intensity 衍生 (R36-m01 - 4 attention 度量 index_full/index_ctx/disp/pct;
    M0 G0 时按 14_fintech_intensity.parquet schema 对齐 actual column names)"

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务控制 5 列 (ln_assets/
  # leverage/capital_ratio/npl_ratio/deposit_growth) + year_level 宏观 2 列
  # (gdp_growth/m2_growth) 在当前 bank-year panel (40/51) 全为 0 命中 —
  # enrichment pending (M0.5.11 / config/银行面板2007-2025年.xlsx 待接入)。
  # 复现包 01_data_prep 以 capture confirm 自校验拼装 $controls, 只用实存列。
  bank_level: [ln_assets, leverage, capital_ratio, npl_ratio, deposit_growth]
  year_level: [gdp_growth, m2_growth]
  fixed_effects: [bank_fe, year_fe]

identification:
  # RR15-1 (Review-only audit): R8-M03 updated all 6 events (E1-E5b) to cross-sectional
  # intensity DiD baseline (政策对所有银行同步生效, treatment = pre-event exposure ×
  # post dummy). Plan §B.2 historical wording "staggered_did_callaway_santanna" was a
  # pre-R8-M03 label; actual Stata estimator (per §5.7.3 main spec) uses intensity DiD;
  # csdid (Callaway-Sant'Anna) retained as robustness for sub-cohort scenarios only.
  baseline: cross_sectional_intensity_did  # main spec per §5.7.3 R8-M03
  baseline_legacy_label: staggered_did_callaway_santanna  # §B.2 historical label retained for traceability
  iv:
    # 2026-06-13 已物化 (iv_extensions.py — 替代 2026-06-11 PENDING M0.5.X
    # 标注): primary = 同银行类型×年 LOO attention_index_full 均值 (含 _lag1
    # 滞后稳健性变体, Manski 1993 反射披露); fallback = Bartik (基期类型共现
    # 份额 × 同类 LOO 文章级 fintech_intensity_score 强度; 基期取全仓 7e
    # 统一口径 max(panel.year.min(), 2010), 非原设想的 pre-2007 份额 —
    # GPSS 2020 AER share 外生性视角)。模板 19_attention_iv_first_stage.do
    # 的 capture confirm 探测在面板重生后自动转入正跑。
    primary: leave_one_out_peer_attention_iv
    fallback: bartik_attention_iv
    # ctx 轨稳健性镜像 (2026-06-13 终审, iv_extensions.py lpeer_*): 内生孪生
    # attention_index_ctx 配 ctx 同业 LOO 工具 lpeer_attention_iv_ctx, 与 full
    # 轨各自 just-identified 并排表达双轨互为稳健性; 非 full×ctx overid (同文双窗,
    # Hansen J 零功效, Parente & Santos Silva 2012)。模板 19_attention_iv_first_stage。
    # R5-m03 与 llm_peer paper 区别: P2 leave-one-out peer = 银行类型 (国有 / 股份制 / 城商 / 农商)
    # 子样本内同类银行 attention 均值, 不依赖 LLM 语义判定; llm_peer paper 用 LLM-determined
    # semantic peer (Cao 2025 RAS 风格的语义相似度), 与 P2 的 4 类银行分类完全不同。

# 网络位置角色 (network-metrics-elevation 2026-06-13; 蓝图 scripts/audit/NETWORK_METRIC_ELEVATION_BLUEPRINT_2026-06-13.md)。
# 消费 panel 实存共现中心度列 → golden-safe; control 立即生效; schema 对本块 no-op。
network_roles:
  control:
    columns: [bank_degree_cent, net_density_yr]   # attention 与共现度机械同源, 必控; bank_strength_cent 仅副控 (跨年不可比 P2-7)
    framing: mechanical_coexposure   # 不控则主系数 = 纯曝光强度 + 枢纽地位混合
    lit: [Fang-Peress 2009 JF, Hassan 2019 QJE]
  iv:
    instruments: [leave_one_out_peer_attention_iv, bartik_attention_iv]   # 既有跨族 over-id (LOO × Bartik), 解 P1-6 恰好识别 → Hansen J
    forbidden: cooccur_peer_loo_new_column   # 勿新建共现 peer-LOO 工具 = 复活已撤回双工具 (corr 0.998, 审计 P2-PEERIV-1 reject)
    note: "production T=18 报 KP rk F + Hansen J + 两工具 corr/VIF (Parente-Santos-Silva 2012)"
  centrality_missing_convention: zero_fill_offnetwork_disclose_N

# 推断纪律 (INFER IV-2 修复 2026-06-14; 镜像 disagreement spec cluster 块 + List-Shaikh-Xu 2019 family 定义)。
# 顶刊对观测性研究不强制 OSF/PAP, 但须形式化声明单一 confirmatory 主规格 + family 边界, 余者标 exploratory。
inference:
  confirmatory:                # 单一预设主假设 (confirmatory): 主处理 → 主结局
    treatment: attention_index_full       # treatment.primary
    outcome: ln_fintech_investment        # outcome.primary
    estimator: cross_sectional_intensity_did  # M4 (+ctrl), TWFE bank+year FE
    one_sided_hypothesis: "曝光强度 ↑ → 银行 fintech 投入披露 ↑ (Hassan 2019 QJE 测度→响应)"
  exploratory:                 # 以下一律标 robustness / exploratory, 非 co-equal headline
    # 双轨 (full/ctx) 互为稳健性。
    alternative_treatments: [attention_index_ctx, attention_disp_full, attention_pct_full]   # 替代测度 (双轨互为稳健性 + secondary)
    alternative_outcomes: [m_and_a_fintech, patent_fintech_count, employee_growth_it,
      noninterest_income_share, cost_income_ratio]   # outcome.secondary
    sentiment_methods: [llm, dict, bert]    # 三法 triangulation = L&M 2011 robustness battery
    weighting_schemes: [EW, VW, MW, HW]     # 加权聚合稳健性
  fwer:                        # 多重检验 family-wise error 校正 (INFER IV-1)
    method: romano_wolf        # 18_attention_robustness rwolf stepdown (alt-measure family)
    families:
      - alternative_attention_measures   # {index_full, index_ctx, disp, pct} — 双轨 (full/ctx)
    lit: [Romano-Wolf 2005 ECMA, List-Shaikh-Xu 2019 EE, Anderson 2008 JASA]
  cluster: [bank]              # 主规格 firm-level 聚类 (= CLUSTER_VAR bank_id; T=18 G≈200 大 G 充足)
  cluster_robustness:          # small-G / 多维聚类对比 (Cameron-Miller 2015 JHR; T=2 试跑帧退化时优雅跳过)
    - bank_only                # 主规格
    - bank_year_twoway         # 双向聚类 (year G=18 小, 仅作对比)
    - province_year_twoway     # 省级×年 (省 G≈31, 配 wild bootstrap MacKinnon-Webb 2017)
  small_g_inference:
    method: wild_cluster_bootstrap   # 18_attention_robustness boottest (9999 reps)
    lit: [MacKinnon-Webb 2017 JAE, Roodman et al. 2019 SJ, Conley-Taber 2011 REStat]

