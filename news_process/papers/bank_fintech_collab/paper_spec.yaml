# Paper spec for P5 — bank_fintech_collab (NEW, v3.4.0 epoch 5)
# Authoritative source of truth at M0 G0 acceptance (epoch 5 streak 3/3 pending).
# Schema reference: papers/_common/paper_spec_schema.py

paper_id: bank_fintech_collab
spec_version: 1.0.0
status: new
differentiation_claim: |
  P5 度量银行 fintech 创新的"自主研发 vs 外部协同"二元属性 (Chesbrough 2003 Open Innovation
  + Laursen & Salter 2006 SMJ search breadth & depth + Hagedoorn 2002 RP inter-firm R&D).
  与现有 8 paper (B-route 4 + retrofit 4) 区分原则:
  - 与 P1 (tone): P5 度量公告的组织来源属性 (二元), 与 P1 度量连续 tone 性质不同;
    P1 主回归 tone 作 treatment, P5 主回归 collab_mode 作 treatment.
  - 与 P2 (attention): P5 度量公告本身, P2 度量媒体对银行的 attention exposure 量.
  - 与 P3 (substance): P3 度量 W&Z 二元 substantiveness, P5 度量 Chesbrough open
    innovation 二元 collab_mode; 二维概念正交, 与 P4 locus 共同构成 2³=8 cross-tab cells.
  - 与 P4 (locus): P4 度量 Gomber 二元 locus (底层/应用), P5 度量 Chesbrough
    二元 collab_mode (自主/外部); 不同框架 (Open Innovation vs Enabling Technology).
  - 与 llm_peer: P5 不构造 LLM peer 网络 IV, 仅 firm-level collab_mode binary.
  - 与 brokerage_network: P5 不用网络中心性, 仅 firm-level 二元标签.
  - 与 benefit_society: P5 不做态度投影, 仅用 collab_mode 二元标签.
  - 与 strategic_diff: P5 度量 firm 自身公告属性 (binary), strategic_diff 度量
    N-邻群中的战略差异度.

theory:
  primary_anchors:
    - Chesbrough (2003) Open Innovation
    - Laursen & Salter (2006 SMJ 27:131-150)
  secondary_anchors:
    - Hagedoorn (2002 Research Policy 31:477-492)
    - Cohen & Levinthal (1990 ASQ 35:128-152)

outcome:
  primary: m_and_a_fintech                # 外部协同的直接 outcome (M&A 事件计数, R&D collab 落地证据)
  # 年度数据约束 (2026-06-13): 短期市场反应 CAR (需日频) 降级为上市行扩展, 非年度主线。
  listed_subsample_extension: car_5day_window  # 与 P4 同窗口
  secondary:
    - r_and_d_intensity                   # 自主研发的强度信号 (alternative anchor)
    - patent_fintech_count                # 创新产出 (与 P4 共用)
    - capex_it                            # IT 资本投入
    # 风险代价通道 (2026-06-13 顶刊组合定稿): 外部协同引入第三方/操作风险 (助贷/
    # 联合贷监管背景), 自主研发无此暴露 — z_score (CAR-based 变体, 与第 10/11 篇
    # 共享口径) 检验开放创新的风险代价差异。
    - z_score
  construction: |
    m_and_a_fintech[bank_b, year_t] = count(M&A events targeting fintech 标的)
    数据源: M0.5.11 Tonghuashun m_and_a_events 模块.
  enrichment_source: M0.5.11 (Tonghuashun M&A events + CSMAR R&D intensity + IncoPat
    patents)

treatment:
  # fix(omni-g-papers-misc-11, 2026-06-11): 旧 primary=innovation_collab_mode_full
  # 是文章级中文分类字符串 (自主研发/外部协同, 21_tone_llms dtype=str), 在
  # bank-year panel 0 命中 (幻影列; 旧注 "v3.4.0 pipeline 实测列名" 不实)。
  # 改指 panel 真实物化的 bank-year 占比编码 (encode.py, 分母=n_articles_llm_valid)。
  primary: collab_frac                    # 外部协同新闻占比 (full 轨; positive 方向=外部协同, Chesbrough 2003)
  alternative:
    - collab_frac_cm                      # context-conditional 轨 (entity-context 分类, 分母=ctx llm_valid)
    - independent_minus_collab_gap        # derived = indep_frac - collab_frac ∈ [-1, +1]
                                          # (fix(omni-g-papers-misc-05): Stata 二元化版 collab_gap ∈ {-1, 0, +1}, 0=平票; 缺失→missing, fix(omni-g-replication-06) !missing 守卫)
    - cell_id_full                        # v3.5.0 D2 8-cell decomposition treatment (panel 级衍生, pending)
  alternative_construction:
    # 公式改为对 frac 列的运算 (旧式 full - (1 - full) 对分类字符串做算术, 类型不自洽)
    independent_minus_collab_gap: indep_frac - collab_frac
    cell_id_full: subst*4 + locus*2 + collab + 1  # v3.5.0 D2; see plan §2.1.1
  source: pipeline/panel/encode.py stage 45 聚合 (源分类 = stage 21 tone_llms Chesbrough 2003 framework, v3.4.0)

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务控制 5 列 (ln_assets/
  # leverage/capital_ratio/npl_ratio/deposit_growth) + year_level 宏观 2 列
  # (gdp_growth/m2_growth) 在当前 bank-year panel (40/51) 全为 0 命中 —
  # enrichment pending (M0.5.11 / config/银行面板2007-2025年.xlsx 待接入)。
  # 复现包 01_data_prep 以 capture confirm 自校验拼装 $controls, 只用实存列。
  bank_level: [ln_assets, leverage, capital_ratio, npl_ratio, deposit_growth]
  year_level: [gdp_growth, m2_growth]
  fixed_effects: [bank_fe, year_fe]

identification:
  baseline: long_panel_within_bank_within_year
  # 2026-06-13 IV 补全 (此前: P5 无 IV mirrors P3; 现与 P3 同构补全):
  #   primary  = 同类型同业 leave-one-out 外部协同占比 (iv_extensions.py;
  #              Manski 1993 反射与 Leary-Roberts 2014 JF 排他性局限须披露)
  #   fallback = Bartik: 基期类型共现份额 × 同类 LOO 外部协同占比
  #              (GPSS 2020 AER 基期 share 外生性视角)
  iv:
    primary: leave_one_out_peer_collab_iv
    fallback: bartik_collab_iv_full
    # ctx 轨稳健性镜像 (2026-06-13 终审, iv_extensions.py lpeer_*): 内生孪生
    # collab_frac_cm 配 ctx 同业 LOO 工具 lpeer_collab_iv_ctx, 与 full 轨各自
    # just-identified 并排 (双轨互为稳健性); 非 full×ctx overid。模板 21_collab_iv_2sls。

event_studies:
  - E1   # 2013-06-13 yuebao_launch (fintech ecosystem 开启, 与 P4 locus 同 events)
  - E3   # 2017-04-27 asset_management_rules
  - E4   # 2020-11-03 ant_ipo_pause

targets:
  primary_outlet: SMJ
  secondary_outlet: AMJ                   # cascade intermediate (mirrors P3)
  ambitious_outlet: ASQ                   # cascade 终点
  sequential_resubmission: |
    SMJ → AMJ → ASQ cascade (Primary path, 完整 Chesbrough Open Innovation 框架);
    任一阶段 reject 后改写为 absorptive capacity 框架 (Cohen & Levinthal 1990 ASQ)
    投 Research Policy 作 Salvage path (替代锚定 + 替代 outcome 框架, 不构成 dual submission).
  submission_window: 2027-04-09           # 较 P3 推迟 ~3.5wk (per plan R6-13 timeline shift)

sample:
  n_bank_min: 200
  t_year: 18
  obs_target_min: 3000

audit_rounds_target_min: 8                # 与 P3/P4 同 rigor (epoch 5 streak 3/3 standard)

# v3.5.0 D2 8-cell decomposition Table 6
tables:
  t6:
    template: 19_table6_cell_decomposition  # Stata Table 6: i.cell_id_full saturated regression
  tA7:
    template: 20_collab_clarity_robustness
    clarity_robustness:
      anchor: "Loughran & McDonald (2011) JF 66(1); You et al. (2018) hhx055"
      dual_track: true
  tA8:
    template: null  # remove-title-track: 标题轨稳健性表已取消
  tA9:
    template:
