# Paper spec for P3 — bank_fintech_substance (new, per plan §B.3)
# Authoritative source of truth at M0 G0 acceptance.
# Schema reference: papers/_common/paper_spec_schema.py

paper_id: bank_fintech_substance
spec_version: 2.0.0
status: new
differentiation_claim: |
  P3 度量银行 fintech 战略宣告的"实质性 vs 象征性"差异 (W&Z 1994/1998 ASQ)。
  R17-m01 + R21-m02 跨 paper 区分 (B-route 4 + existing 4 paper, 共 8 对照; v3.4.0 + P5 = 9 paper):
  - 与 P1 (tone): P3 度量 W&Z 二元 substantiveness; P1 度量连续 tone — 性质不同 (实质 vs 情感)
  - 与 P2 (attention): P3 关注公告的 substantive vs symbolic 属性; P2 关注媒体对银行的 attention exposure 量
  - 与 P4 (locus): P3 度量公告的 W&Z 二元属性 (实质/象征); P4 区分公告的 locus 二元属性 (底层/应用); 二维交叉但独立
  - 与 P5 (collab_mode, v3.4.0 epoch 4): P3 度量 W&Z 二元 substantiveness (实质/象征); P5 度量 Chesbrough
    2003 Open Innovation 二元 collab_mode (自主研发/外部协同); 二维概念正交 (2² cross-tab cells); P3 主回归
    保持 substantiveness 作 treatment, collab_mode 仅作 robustness control (Table 5 alternative spec).
  - 与现有 llm_peer: P3 不构造 LLM peer 网络 IV, 仅 firm-level substantiveness; llm_peer 用语义同业网络
  - 与现有 brokerage_network: P3 不用网络中心性, 仅 firm-level W&Z 二元标签; brokerage 用网络位置异质性
  - 与现有 benefit_society: P3 不做态度投影 (LLM-Embedding 双极锚点), 仅用 W&Z substantiveness 二元标签
  - 与现有 strategic_diff: P3 度量 firm 自身 公告属性 (binary); strategic_diff 度量 firm 在 N-邻群中的战略差异度 (distinctness, distance)

outcome:
  # primary 切换 (2026-06-13, 顶刊组合定稿): 经营效率 3 年前向变化是 W&Z decoupling
  # 框架最锐利的可证伪试金石 — 实质性采纳应改善成本收入比, 象征性宣告应无效。
  # 比 long-run ROA 更贴"真做 vs 装样子"的机制 (ROA 混入定价/周期噪声)。
  primary: cost_income_ratio_change_3yr  # 效率试金石 (实质↓ / 象征≈0)
  construction: |
    cost_income_ratio_change_3yr[bank_b, year_t] = CIR[bank_b, year_t+3] - CIR[bank_b, year_t]
    (within-bank 3-year forward change, CIR = 业务及管理费 / 营业收入;
    预测: sub_frac 高 → CIR 前向下降 (真实效率改善); 象征性宣告 → 无变化。
    伴随检验 long_run_roa_change_3yr = ROA[t+3] - ROA[t] (W&Z 1994 长期反转);
    在 T=18 panel 上, t ∈ {2007, ..., 2021} 各有对应 t+3 outcome)
  # 上市行扩展 (非年度主线): fintech 公告事件窗 CAR, 与 P1 tone shock 窗口区分
  # (R7-M03 + R10-M01); 待日频数据可得时作附表。
  listed_subsample_extension: car_3day_window_fintech_announcement
  # misconduct_penalty_count = 监管处罚频次 (银保监会处罚公示, 年度计数, 独立外部源
  # 无共同来源偏误) — decoupling 经典延伸: 象征性披露与后续不当行为正相关。
  secondary: [long_run_roa_change_3yr, misconduct_penalty_count,
    ceo_turnover_2yr, executive_pay_change, board_change]
  enrichment_source: M0.5.11 (财务面板 成本收入比+ROA + 银保监处罚公示爬取 + CSMAR
    高管离职/薪酬; CAR 扩展需 daily returns, 非主线)

treatment:
  # fix(omni-g-papers-misc-11, 2026-06-11): 旧 primary=innovation_substantiveness_full
  # 是文章级中文分类字符串 (实质性/象征性, 21_tone_llms dtype=str), 在 40/51
  # bank-year panel 0 命中 (幻影列; 旧注 "R35-M01 pipeline 实际列名" 不实)。
  # 改指 panel 真实物化的 bank-year 占比编码 (encode.py, 分母=n_articles_llm_valid)。
  primary: sub_frac        # 实质性新闻占比 (full 轨; W&Z substantive share)
  alternative: [sub_frac_sc, substantive_minus_symbolic_gap]  # sub_frac_sc = ctx 轨 (分母=n_articles_llm_valid_ctx)
  alternative_construction:  # R29-m01 derived 字段说明 (公式改为对 frac 列的运算, 类型自洽; 旧式对分类字符串做算术)
    substantive_minus_symbolic_gap: sub_frac - symb_frac  # ∈ [-1, +1]; M0.5.X / Stata 01_data_prep 衍生 (尚未落 parquet)

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务控制 5 列 (ln_assets/
  # leverage/capital_ratio/npl_ratio/deposit_growth) + year_level 宏观 2 列
  # (gdp_growth/m2_growth) 在当前 bank-year panel (40/51) 全为 0 命中 —
  # enrichment pending (M0.5.11 / config/银行面板2007-2025年.xlsx 待接入)。
  # 复现包 01_data_prep 以 capture confirm 自校验拼装 $controls, 只用实存列。
  bank_level: [ln_assets, leverage, capital_ratio, npl_ratio, deposit_growth]
  year_level: [gdp_growth, m2_growth]
  fixed_effects: [bank_fe, year_fe]

identification:
  baseline: long_panel_within_bank_within_year
  # 2026-06-13 IV 补全 (此前: P3 无 IV per R15-M01, cross-sectional intensity
  # DiD 替代; 现 DiD 保留为辅助识别, IV 升为正式通道):
  #   primary  = 同类型同业 leave-one-out 实质性占比 (iv_extensions.py;
  #              Manski 1993 反射与 Leary-Roberts 2014 JF 排他性局限须披露,
  #              _lag1 滞后变体为稳健性)
  #   fallback = Bartik: 基期银行类型共现份额 × 同类 LOO 实质性占比
  #              (GPSS 2020 AER 基期 share 外生性视角; 模板报告 KP rk F +
  #               弱工具时 Anderson-Rubin CI)
  iv:
    primary: leave_one_out_peer_subst_iv
    fallback: bartik_subst_iv_full
    # ctx 轨稳健性镜像 (2026-06-13 终审, iv_extensions.py lpeer_*): 内生孪生
    # sub_frac_sc 配 ctx 同业 LOO 工具 lpeer_subst_iv_ctx, 与 full 轨各自
    # just-identified 并排 (双轨互为稳健性); 非 full×ctx overid。模板 22_substance_iv_2sls。

event_studies:  # P3 applicable events
  - E1  # 2013-06-13 yuebao_launch
  - E2  # 2016-08-24 p2p_regulation
  - E3  # 2017-04-27 asset_management_rules — cross-sectional intensity DiD
  - E4  # 2020-11-03 ant_ipo_pause

targets:
  primary_outlet: SMJ
  secondary_outlet: AMJ  # R3-M06: cascade intermediate (SMJ → AMJ → ASQ)
  ambitious_outlet: ASQ  # cascade 终点
  sequential_resubmission: |  # R1-M07 + R3-M02 顺序投稿 (不是 dual submission)
    SMJ → AMJ → ASQ cascade (Primary path, 完整 W&Z 框架); 任一阶段 reject 后:
    改写为 disclosure quality 框架的独立论文投 JFE corp finance track (Salvage path)
    (重新表述研究问题 / 切换理论 anchor / 仅保留 long_run_roa_change_3yr outcome /
    删除组织学叙事 — 是两篇论文, 不是 dual submission)
  submission_window: 2027-03-15

sample:
  n_bank_min: 200
  t_year: 18
  obs_target_min: 3000

audit_rounds_target_min: 8

