# Paper spec for 第 10 篇 — bank_media_disagreement (NEW, M0 立项中).
# Authoritative source of truth — pending M0 G0 acceptance.
# Created: 2026-05-18 (DC1 决策: path B — SSRN + _full 影响力路线)
# Schema reference: papers/_common/paper_spec_schema.py
# Audit history: V1 (58 finding) + V2 (90 finding) + V3 (5 DC) + V4 (白话回归 reframe)
# YAML 风格 (v3.7.0 m10 校准): 含 markdown / special char (`/`, ` / `, `|`)
# 的 string 用 double quote; 简单 identifier (paper_id, 列名) 不 quote;
# multiline 用 literal block `|`. 与项目其他 paper_spec.yaml 一致.

paper_id: bank_media_disagreement
spec_version: 1.0.0
status: new
created: 2026-05-18

differentiation_claim: |
  本 paper 度量"媒体观点分歧" (不同媒体源对同一银行同期 tone 的 cross-outlet
  variance) 对银行风险承担 (Z-score / NPL formation / RWA ratio) 的因果效应。

  V4 audit reframe (致命修复): 主回归不预设方向 (避免 ambiguous direction 顶刊雷区),
  通过 Granger 双向因果 + heterogeneity (SOE / 资本充足率 / 周期) 揭示 channel 异质性.

  与现有 9 paper 区分:
  - 与 P1 (bank_fintech_tone): P1 度量 tone *level* (sign + magnitude);
    本 paper 度量 tone *dispersion* (cross-outlet variance) — 完全不同的信息环境维度
  - 与 P2 (bank_fintech_attention): P2 度量 attention *intensity* (cumulative count);
    本 paper 度量 outlet-level *disagreement* — outlet 数量 vs outlet 分歧度
  - 与 P3 (substance) / P4 (locus) / P5 (collab): 3 篇度量公告 *内容属性*;
    本 paper 度量 outlet-level *meta-information* (媒体如何报道, 而非银行报道什么)
  - 与 benefit_society: benefit 度量 attitude *projection* (LLM-Embedding 双极锚点);
    本 paper 度量 tone *cross-outlet dispersion* — 测量层次完全不同
  - 与 brokerage_network: brokerage 用 *network position + peer spillover IV*;
    本 paper 用 firm-level outlet disagreement + Bartik shift-share IV — IV 机制独立
  - 与 llm_peer: llm_peer 用 LLM-determined peer tone IV;
    本 paper 用 cross-outlet variance, peer 概念不涉及
  - 与 strategic_diff: strategic_diff 用 N-邻 firm 文本相似度;
    本 paper 用 cross-outlet tone variance — 完全不同的 disagreement 概念
  - 与第 11 篇 (bank_news_clarity, 共享 outcome panel):
    第 11 度量 *report clarity* (single-text 词典扫描); 本 paper 度量 *cross-outlet
    dispersion* (multi-outlet variance) — 不同 textual feature, channel 互补可同时跑

theory:
  primary_anchors:
    - "Diether, Malloy & Scherbina (2002 JF 57:2113-2141) — disagreement → 收益经典"
    - "Cookson & Niessner (2020 RFS 33:4327-4373) — 信息源分歧 → 投资者反应"
    - "Antweiler & Frank (2004 JF 59:1259-1294) — message board 分歧 → 波动"
  secondary_anchors:
    - "Bushman & Williams (2012 JAE 54:1-18) — bank info environment → risk-taking"
    - "Acharya, Anginer & Warburton (2016 RFS, working) — implicit guarantee 框架 (V4 F-P1.1 必加)"
    - "Hau & Lai (2017 RFS 30:3025-3061) — disagreement → herding (alternative direction)"
    - "Houston, Lin, Lin & Ma (2010 JFE 96:485-512) — info sharing → bank risk"
  micro_foundation:  # V4 F-P3.1 修复
    framework: "Diamond-Dybvig (1983 JPE) 银行 run + heterogeneous beliefs extension"
    mechanism: "outlet 分歧 → depositor / regulator / management 三 channel discipline → bank risk choices"
    direction_prediction: "ambiguous ex ante (V4 reframe), Granger bidirectional 识别"
    channel_decomposition_required: true  # V4 F2.1: 三 channel 不能简单声称共同作用

outcome:
  primary: z_score  # Roy (1952) 框架。⚠ 锚点更正 fix(omni-g-zscore-papers-01, 2026-06-11) (与第 11 篇 spec 2026-06-10 更正同步): 资本项用监管 Basel CAR (RWA 加权), 故为 *CAR-based Z-score 变体*, 非 Laeven-Levine 2009 JFE 原版 (后者资本项=账面 equity/total-assets)。投稿前须如实标注为 CAR 变体。
  primary_formula: "(roa + capital_adequacy_ratio) / sigma_roa_5y_rolling"  # 注: capital_adequacy_ratio=监管 CAR, 非 L&L 的 equity/assets
  secondary:
    - npl_formation_rate    # Bushman-Williams (2015 JAR 53:511-553) forward-looking
    - rwa_to_ta_ratio       # Demirgüç-Kunt & Huizinga (2010 JFE 98:626-650)
    - sigma_roa_5y_rolling  # Houston et al. (2010 JFE) standalone risk measure
    # 资金端机制通道 (2026-06-13 顶刊组合定稿; mechanism, 非 confirmatory —
    # 不动下方 hierarchy 与 p_hacking_guard): Diether 2002 JF 分歧框架嫁接
    # Diamond-Dybvig 挤兑微观基础 — 媒体分歧 → 储户不确定 → 资金变贵
    # (funding_cost = 利息支出/计息负债, 与 P1 共享构造但此处仅 mechanism) →
    # 银行预防性囤积流动性 (liquidity_hoarding_share = (现金+同业资产)/总资产)。
    - funding_cost
    - liquidity_hoarding_share
  enrichment_source: "M0.5.x (银保监会季报 + Wind 银行库 + 银行年报 PDF; DC2 dry-run pending)"
  data_feasibility_status: pending  # DC2 dry-run (M1 末) 决定 Path α/β/γ
  hierarchy:  # V4 F3.5 修复, 明确 primary 不混乱
    main: z_score
    confirmatory: [npl_formation_rate, rwa_to_ta_ratio]
    descriptive: sigma_roa_5y_rolling
    p_hacking_guard: 三 confirmatory 方向不一致即视为 null (pre-registration commitment)

treatment:
  # DC1 决策 (2026-05-18): path B — SSRN + _full main 影响力路线 (paper 10)
  governance:
    ssrn_release: true
    g3_unlock: false  # 放弃 G3 _ctx main, 走 _full + SSRN 累积 citation 路线
    main_track: _full
    rationale: "RFS finance audience 偏好高传播 + 早期 SSRN feedback; 牺牲 entity-attribution 严谨性换学术影响力"

  primary: cross_outlet_tone_variance_full  # V4 R3 critical 修复, 待新建 (M2-M3)
  # ⚠ 同名异构披露 fix(omni-g-zscore-papers-02 + omni-g-audit-family-08, 2026-06-11):
  # 盘上同名 panel 列当前由 stage 39f (pipeline/audit/cross_media_alpha.py) 产出,
  # 与下方 spec 构造**不同口径**:
  # 39f 版 = 仅 coverage-spike 事件日 (bank-day 文章数 ≥ bank 内 p90, 且 p90 > pmin)
  # ± EVENT_WINDOW_DAYS 窗内 (重叠窗合并为 episode, fix omni-g-audit-family-01)、
  # ≥ MIN_OUTLETS_PER_EVENT 个 outlet 时的 outlet 间 variance (np.var, ddof=1),
  # 再按 episode 内文章数 (n_articles) 加权平均到 bank-year — 即"条件于报道
  # 高峰"的事件加权估计量; 下方 Step 2-3 = 无条件全年截面口径。估计对象 (条件 vs
  # 无条件) / 聚合 (episode 文章数加权 vs 单一截面) 两重不同 (矩已于 2026-06-11
  # 统一为 var), M2-M3 落地 spec 版构造时必须二选一:
  # (a) spec 版用新列名 (如 cross_outlet_tone_var_uncond),
  # 或 (b) 重命名 39f 产物 (如 event_window_outlet_tone_var)。严禁两种构造共用同名列。
  primary_construction: |
    Step 1 (现成 stage 21 输出): 文章级 llm_vote_score_full ∈ {-1, 0, +1}
    Step 2 (待建 stage 21b): (bank b, year t, outlet m) 级
        outlet_tone[b,t,m] = mean(llm_vote_score over articles in cell)
    Step 3 (待建 encode.py 扩展): (bank b, year t) 级
        cross_outlet_tone_variance[b,t] = var(outlet_tone[b,t,*], ddof=1)
        (2026-06-11 更正: 列名含 variance → 矩统一为 var 非 std; 原 spec 写 std
         与列名自相矛盾, 现与 39f 实现的矩定义对齐, 见上方同名异构披露)
    前置 diagnostic (M1 必跑): ≥3 outlet 覆盖率 > 40% 才可行
    Fallback (若 < 30%): 退回 llm_vote_tone_std_full 作 main (R3 critical 妥协)

  alternative:
    - cross_outlet_tone_variance_ctx  # ctx 轨 dual-track robustness
    - llm_vote_tone_std_full          # bank-year 内 tone std (含 LLM noise + 时间噪声)
    - llm_vote_tone_std_ctx
    - 1_minus_avg_agreement_rate_full # LLM ensemble disagreement (Condorcet jury theorem)
    - 1_minus_avg_agreement_rate_ctx
    - benefit_std_full                # embedding attitude 离散度
    - avg_pos_ratio_std_full          # 词级正面比例离散度
    - avg_msent_std_full              # 计数级 MSENT 离散度
    - avg_subst_prob_score_std_full   # substantiveness 概率离散度
    - avg_locus_prob_score_std_full   # locus 概率离散度

  composite_pca:  # V4 F6.2 multiple testing 处理
    method: "PCA on 10 alt disagreement measures → 第一主成分作 composite_disagreement_index"
    explained_variance_min: 0.40

  measurement_validity_checks:
    - F-P2.1: "LLM raw response archive (DC3 必修, v3.5.1 prompt frozen → v3.7.0 response frozen)"
    - F-Adv.2: "LLM training data contamination test (DC4 必修, pre/post cutoff holdout)"
    - shapiro_2022_correction: "measurement-error correction (JoE 228 框架)"
    - htmt_cronbach_alpha: "convergent validity 跨 10 alt measures (stage 39d 扩展)"
    - outlet_normalization: "媒体源 normalization 规范 (V4 F3.1 必修, M2-M3 outlet_dict 建立)"

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务 5 列 (ln_assets/leverage/
  # capital_ratio/npl_ratio/deposit_growth) + year_level 的 shibor/lpr_year_avg/
  # gdp_growth/m2_growth 在当前 panel 全为 0 命中 — enrichment pending
  # (config/银行面板2007-2025年.xlsx + 宏观利率序列待接入)。bank_type_id 非 panel
  # 原生列: 01_data_prep 从主 panel 字符串列 bank_type encode 派生。
  bank_level:
    - ln_assets
    - leverage
    - capital_ratio
    - npl_ratio
    - deposit_growth
    - n_articles            # 媒体覆盖量 (避免 attention vs disagreement 混淆)
    - is_soe                # V4 F-P1.1 修复, implicit guarantee 框架要求
    - bank_type_id          # 国有 / 股份 / 城商 / 农商 4 类
  year_level:
    - gdp_growth
    - m2_growth
    - shibor
    - lpr_year_avg          # 2019+ LPR 改革后
  fixed_effects: [bank_fe, year_fe, province_fe]
  cluster: [bank, year]     # two-way, V4 F6.1 standard
  cluster_robustness:       # V4 F6.1 multi-clustering 对比表
    - bank_only
    - bank_year_twoway
    - province_year_twoway
    - bank_province_year_threeway

identification:
  baseline: long_panel_within_bank_within_year
  # 2026-06-13 IV 落地: 5 个候选中唯一不依赖外部数据、当前语料即可计算的
  # 是 outlet-composition 族 — 已物化为 outlet_disp_exposure_iv_full/_ctx
  # (iv_extensions.py::compute_outlet_composition_iv):
  #   基期 outlet 报道份额 (冻结, GPSS 2020 AER share 外生性) ×
  #   各 outlet 当年 house-style 立场极端度 |tone − 年均| 的 LOO 均值
  #   (剔除焦点银行自身报道; outlet 风格持久性: Gentzkow & Shapiro 2010
  #    Econometrica; 写作风格外生先例: Dougal et al. 2012 RFS)。
  # 白话: 一家银行基期碰巧被哪些"火药味重/四平八稳"的媒体盯上, 决定了
  #   它后来被吵得凶不凶 — 这套媒体组合是历史存量, 与银行当期基本面无关。
  # 其余 4 候选 (利率市场化 DiD / Wind 基建 / 媒体集团重组 / 记者流动)
  # 仍保留待外部数据, M5 first-stage 后与本 IV 赛马。
  iv:
    primary: outlet_disp_exposure_iv_ctx     # main_track=_ctx (governance 同步)
    fallback: outlet_disp_exposure_iv_full
  iv_candidates:  # V4 F4.2 修复, 5 个候选 (M5 first-stage 测试后选 1-2 作 main)
    bartik_outlet_share_x_fintech_trend:
      construction: "本行 pre-period 2011-2013 outlet portfolio composition × 全国年度 fintech 话题热度时序变化"
      exclusion_caveat: "V4 F4.2 警告: pre-period composition 反映本地媒体生态, exclusion 风险中等"
    rate_marketization_staggered_did:
      events: [2013-09-25, 2015-10-24, 2019-08-17]
      treatment: "pre-period disagreement intensity × post-event dummy"
    wind_data_infra_depth:
      construction: "城市级 Wind / 同花顺数据基础设施覆盖深度 (城市 IT infra 代理)"
      exclusion_caveat: "金融中心城市可能与 outcome 直接相关, robustness 而非 main"
    media_group_ma_events:
      events: ["2014 上海报业重组", "2018 财新独立"]
      treatment: "quasi-experimental shock to outlet diversity"
    journalist_mobility_shock:
      construction: "财经记者 mobility (exogenous labor supply shock)"
      data_source: "TBD: LinkedIn / 中国记者证流动数据"
  parallel_trends_test:
    required: true
    estimators: [callaway_santanna_2021, de_chaisemartin_2020]
  granger_bidirectional:
    required: true
    rationale: "V4 reframe identification, 双向反馈作 paper finding 而非问题"

sample:
  # 2026-06-01 provisional wiring: 补 canonical 键 n_bank_min / t_year (= target_min),
  # 与其余 10 篇 paper_spec 及 schema 测试 (test_sample_block_complete) 对齐。
  n_bank_min: 200                # = n_bank_target_min (canonical schema 键)
  t_year: 13                     # = t_year_target (canonical schema 键)
  n_bank_target_min: 200         # V4 F5.4 现实校准
  n_bank_target_max: 500         # DC2 dry-run 后确定
  t_year_target: 13              # σ(ROA) 5y rolling 损失 5 年 (V4 F5.2)
  obs_target_min: 4000           # V4 F5.4 现实校准
  obs_target_max: 6500
  selection_criteria:            # V4 F4.7 修复
    require_year_2007_2024_at_least_5_years: true
    corporate_action_handling: "M&A / 改制 / 接管 → 单独处理规则见 M0 sample spec"
    new_entrant_handling: "short-panel banks (< 10 年) → robustness subsample"
    survivorship_bias_robustness: required
  fallback_paths:  # V4 F-D.1 修复
    alpha: "DC2 dry-run ≥ 70% → 全 outcome 设计 (Z-score + NPL + RWA)"
    beta:  "DC2 dry-run 40-70% → drop RWA, 保留 Z-score + NPL"
    gamma: "DC2 dry-run < 40% → 退回 ROA + NPL ratio, 撤回 risk-taking 框架"

heterogeneity:  # V4 F2.2 修复 boundary condition
  - dimension: SOE_vs_non_SOE
    rationale: "implicit guarantee 差异 (Acharya 2016 RFS)"
  - dimension: high_vs_low_capital_adequacy
    rationale: "regulatory headroom 差异"
  - dimension: tight_vs_loose_monetary_cycle
    rationale: "risk-taking channel of monetary policy (Dell'Ariccia 2017 JF)"
  - dimension: bank_type_4_category
    categories: [国有, 股份制, 城商, 农商]
    rationale: "differential risk technology"
  - dimension: sub_period
    sub_periods: [2007-2011, 2012-2015, 2016-2019, 2020-2024]
    rationale: "regime shift (V4 F-Comp.3)"

robustness_battery:
  - multi_treatment_measure: "10 alt disagreement measures (PCA composite + 各分量稳健性)"
  - multi_outcome: "Z-score / NPL formation / RWA ratio / σ(ROA) 横向交叉验证"
  - alt_iv: "5 IV cross-validation"
  - placebo_random_bank_id: "randomize bank ID 1000 次, 报告 empirical p-value 分布"
  - sub_period: "4 个 sub-period 子样本"
  - drop_top_6_banks: "排除国有大行 (工农中建交邮储) 验证 power 非主导 (V4 F-P1.2)"
  - weighted_regression: "asset-weighted vs unweighted vs drop top 6 三套"
  - winsorization: "1% / 5% / 不 winsorize 三档"
  - cross_country_placebo: "US bank Compustat + IBES analyst dispersion (V4 F-Comp.4)"
  - llm_contamination_holdout: "pre/post LLM training cutoff (V4 F-Adv.2)"
  - covid_drop_2020Q2_2021Q2: "外生 COVID shock 排除 (V4 F-Edge.3)"
  - bank_ma_corporate_action_drop: "M&A / 改制银行排除 robustness"

