# Paper spec for benefit_society (existing, retrofit per plan §5.2.2 M0.1b)
# Derived from papers_assets/benefit_society/README.md + analysis/tables/figures.
# Schema reference: papers/_common/paper_spec_schema.py

paper_id: benefit_society
spec_version: 2.1.0  # bumped per V2.0 jlm2026-alignment plan §3 P3.6 (Round 9: add jlm2026 robustness table refs)
status: existing
differentiation_claim: |
  benefit_society 用 LLM-Embedding 双极锚点投影 (a_j = cos(s_j, pos-neg)) 测度
  银行 FinTech 报道的"经营效益态度", 检验对银行绩效与 Token/Hidden 采纳行为的影响。
  锚定: Jha-Liu-Manela 2026 RFS §1.3.2 + Westphal-Zajac 2001 ASQ + Distel et al. 2026 RP。
  跨 paper 区分:
  - 与 P1 (tone): benefit_society 度量态度 (双极锚点投影强度, 不是情感方向); P1 度量 sign + magnitude tone
  - 与 P2 (attention): benefit_society 度量态度; P2 度量曝光强度 (count)
  - 与 P3 (substance): benefit_society 不做 W&Z 二元 substantive 标签; 只做态度投影
  - 与 P4 (locus): benefit_society 不区分 locus; 只做态度投影
  - 与 brokerage_network: benefit_society 不构造网络中心性, 仅 firm-level 态度投影
  - 与 llm_peer: benefit_society 不构造 LLM peer 网络 IV, 仅 firm-level 态度
  - 与 strategic_diff: benefit_society 不做多文本表征比较, 仅 firm-level 态度

outcome:
  primary: roa  # PAP v1.0-final 锁定, 不可事后变更 (pre-registration commitment)
  # car_3day 为 PAP 原列保留; 年度数据约束 (2026-06-13) 下需日频, 年度主线不跑,
  # 留作上市行扩展 — PAP 完整性优先, 不从列表移除。
  secondary: [car_3day, token_adopt_kw_p50, hidden_adopt_kw_p50, subst_adopt_kw_p50]
  # PAP 外扩展 (2026-06-13 顶刊组合定稿, 须在论文中明示为 exploratory/非预注册):
  # "经营效益"叙事的社会功能对应物 — liquidity_creation (Berger & Bouwman 2009 RFS
  # 流动性创造, 需资产负债表分项的 cat-fat 口径) + inclusive_loan_growth (普惠/小微
  # 贷款增速, 信贷决策通道)。
  exploratory_extension: [liquidity_creation, inclusive_loan_growth]
  enrichment_source: pipeline stage 21_tone_llms + 24_herd_decay + 40_panel_yearly
    (benefit_mean_full 字段); ROA / CAR 从 CSMAR 补充; 扩展项需财务面板资产负债表
    分项 + 普惠贷款披露 (M0.5.11)

treatment:
  primary: benefit_mean_full   # 双极锚点投影态度均值
  alternative: [benefit_pos_frac_full]

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务控制 5 列 (ln_assets/
  # leverage/capital_ratio/npl_ratio/deposit_growth) + year_level 宏观 2 列
  # (gdp_growth/m2_growth) 在当前 bank-year panel (40/51) 全为 0 命中 —
  # enrichment pending (M0.5.11 / config/银行面板2007-2025年.xlsx 待接入)。
  # 当前复现包实际控制集为 coverage 代理 (derivative_replication CONTROLS):
  # ln_news_coverage media_breadth n_articles (panel 实存列)。
  # SPEC IV-2 (2026-06-14 顶刊重审, 坏控制澄清): coverage 代理 (ln_news_coverage /
  #   media_breadth / n_articles) 是【外延边际】(覆盖总量) 而 treatment benefit_mean_full
  #   是逐文章态度均值 (强度边际, 已对篇数取均值) — 控制覆盖量隔离"被报道多少"与
  #   "被如何评价", 是 Tetlock 2007 JF / Fang-Peress 2009 JF 标准做法 (pre-determined
  #   visibility 混淆, 非态度的后处理中介/坏控制)。framing 与 network_roles.control
  #   一致 = visibility_confounder。
  # ⚠ SPEC IV-1 (2026-06-14): fixed_effects = bank_fe (= absorb(bank_id), 主表/稳健性表
  #   11/14 已落地; 旧 bank_type FE 退役为异质性/子样本维度)。
  bank_level: [ln_assets, leverage, capital_ratio, npl_ratio, deposit_growth]
  year_level: [gdp_growth, m2_growth]
  fixed_effects: [bank_fe, year_fe]

identification:
  baseline: long_panel_within_bank_within_year
  # 2026-06-13 IV 补全 (此前无 IV):
  #   primary  = 同类型同业 leave-one-out 经营效益态度均值 (iv_extensions.py;
  #              同业媒体态度冲击经行业渠道传导, 排他性局限按 Manski 1993 /
  #              Leary-Roberts 2014 JF 披露, _lag1 滞后变体为稳健性)
  #   fallback = 同经济圈 (跨省) leave-one-out 态度均值 (区域共同冲击粒度,
  #              与 iv_did.compute_zone_leave1out 的 tone 版同构)
  iv:
    primary: leave_one_out_peer_benefit_iv
    fallback: zone_leave1out_benefit_iv
    # ctx 轨稳健性镜像 (2026-06-13 终审, iv_extensions.py lpeer_* / zone_*_ctx): 内生
    # 孪生 benefit_mean_ctx 配 ctx 工具 — 同业 LOO = lpeer_benefit_iv_ctx, 同经济圈
    # LOO = zone_leave1out_benefit_iv_ctx (2026-06-13 双轨补全), 与 full 轨各自
    # just-identified 并排 (双轨互为稳健性); 非 full×ctx overid。模板 25_tableA12_iv_2sls。
    ctx_mirror: [lpeer_benefit_iv_ctx, zone_leave1out_benefit_iv_ctx]

# 网络位置角色 (network-metrics-elevation 2026-06-13; 蓝图 scripts/audit/NETWORK_METRIC_ELEVATION_BLUEPRINT_2026-06-13.md)。
# ⚠ PAP v1.0-final 锁 outcome=roa/treatment=benefit_mean → 网络严禁进 primary, 仅 controls/exploratory。golden-safe; schema no-op。
network_roles:
  control:
    columns: [bank_between_cent, bank_degree_cent]   # 净化"正面态度多因被密集正面报道"可见度混淆
    framing: visibility_confounder
    pap_locked: true   # 不可改 primary (PAP v1.0-final)
    lit: [Fang-Peress 2009 JF, Burt 1992]
  centrality_missing_convention: zero_fill_offnetwork_disclose_N

# 推断/聚类/family 声明 (INFER IV-2, 2026-06-14 顶刊重审): 此前 spec 无形式化
# inference 块 → referee 无从区分 confirmatory 主规格与 exploratory 稳健性。
# 顶刊对观测性研究不强制 OSF/PAP, 但要求明示单一主假设 + family 定义 + 聚类层级。
inference:
  # 单一 confirmatory 主规格 (PAP v1.0-final 锁定, 不可事后变更):
  confirmatory:
    treatment: benefit_mean_full    # treatment.primary
    outcome: roa                    # outcome.primary (PAP-locked)
    spec: M4   # 11_table2_main 的 +bank_id+year FE +controls 渐进列 (主规格)
  # 主推断: 银行层聚类 (G≈84/200) + wild cluster bootstrap (11b_table2_boottest)
  cluster: bank_id
  small_g_inference: wild_cluster_bootstrap   # boottest, G_bank 偏小时主推断 (Roodman et al. 2019)
  cluster_robustness: [bank_only, bank_year_twoway]   # 双向聚类对照 (Cameron-Miller 2015)
  # confirmatory family = 主 DV × 主 treatment 单一假设; 其余皆 exploratory/robustness:
  confirmatory_family: ["benefit_mean_full -> roa"]
  exploratory:   # 非预注册, 论文须明示为 exploratory (替代测度/轨道/加权/异质性)
    - "benefit_mean_ctx (dual-track robustness; Table A2)"
    - "benefit_pos_frac_full / benefit_neg_frac_full (decomposition; Table 5 R5)"
    - "secondary outcomes (car_3day / *_adopt_kw_p50; PAP secondary)"
    - "is_listed heterogeneity (Table 4) + SOE/type/hub/size subsamples (Table A14)"
  fwer:   # 多测度/异质性族跨族 FWER 校正 (Romano-Wolf 2005); 主 confirmatory 单假设免
    method: romano_wolf
    applies_to: [exploratory]   # confirmatory 单一主假设无须 FWER

event_studies: []  # benefit_society 主回归不依赖外生 shock; cross-sectional within-bank within-year

targets:
  primary_outlet: RFS  # Jha-Liu-Manela 2026 RFS 类比
  ambitious_outlet: RFS
  backup_outlet: [JFE, JF, JBF]
  submission_window: 2027-03-15

sample:  # RR5-1: post-M0.5 v34 panel target (per §3.4 8 paper共用 v34); v3.3.0 baseline = 84 banks × 2 yr × 168 obs
  n_bank_min: 200
  t_year: 18
  obs_target_min: 3000

audit_rounds_target_min: 8  # benefit_society v2.12 实测 14 轮

# v3.5.0 D2 8-cell decomposition Table 6 — benefit_society 不用 D2 主回归 (per plan §2.1.6)
