# Paper spec for strategic_diff (existing, retrofit per plan §5.2.2 M0.1b)
# Derived from papers_assets/strategic_diff/README.md.
# Schema reference: papers/_common/paper_spec_schema.py

paper_id: strategic_diff
spec_version: 2.0.0
status: existing
differentiation_claim: |
  strategic_diff 用多文本表征方法 (TF-IDF char / TF-IDF jieba / LDA+JSD /
  Embedding / Centroid) 测度银行金融科技战略差异度, 检验 N-邻 (N=3..7) 敏感性、
  与产品市场流动性的关系、SOE 异质性、Bartik IV 因果识别。
  锚定: Guzman-Li 2023 MS + Hoberg-Phillips 2016 JPE + Hoberg-Phillips-Prabhala 2014 JF + 谢佳松 2025 经济研究。
  跨 paper 区分:
  - 与 P1 (tone): strategic_diff 度量 N-邻文本差异度 (distinctness); P1 度量 firm tone
  - 与 P2 (attention): strategic_diff 度量 distinctness; P2 度量 exposure 强度
  - 与 P3 (substance): strategic_diff 不做 W&Z 二元 substantive 标签
  - 与 P4 (locus): strategic_diff 不区分 locus
  - 与 benefit_society: strategic_diff 用多文本表征差异; benefit_society 用单一态度投影
  - 与 brokerage_network: strategic_diff 用文本表征差异; brokerage 用网络位置
  - 与 llm_peer: strategic_diff 用 N-邻文本距离; llm_peer 用 LLM 语义同业 IV

outcome:
  # primary 切换 (2026-06-13, 顶刊组合定稿): 差异化 → 市场势力 → 特许权价值, 是
  # Hoberg & Phillips 2016 JPE 产品市场差异化框架的银行版直接落点 (charter value:
  # Keeley 1990 AER)。tobin_q 仅上市行可算 — 本篇主表定位上市行子样本; 全样本
  # 通道用 funding_cost (差异化 → 同质竞争弱 → 存款定价能力 → 资金成本低,
  # 方向预测与 P1 的语调通道相反, 互为交叉验证)。
  primary: tobin_q  # 特许权价值 (上市行子样本主表)
  secondary: [roa, funding_cost, strat_fluidity, noninterest_income_share]
  enrichment_source: pipeline strat_diff_n{3..7} + Wind 市值 → tobin_q + 财务面板
    ROA/利息支出/非利息收入 (M0.5.11)

treatment:
  primary: strat_diff_n5   # N=5 TF-IDF char 默认
  alternative: [strat_diff_n3, strat_diff_n4, strat_diff_n6, strat_diff_n7, strat_sim_max,
    centroid_diff_tfidf_c, coh_tfidf_c_full]

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务控制 5 列 (ln_assets/
  # leverage/capital_ratio/npl_ratio/deposit_growth) + year_level 宏观 2 列
  # (gdp_growth/m2_growth) 在当前 bank-year panel (40/51) 全为 0 命中 —
  # enrichment pending (M0.5.11 / config/银行面板2007-2025年.xlsx 待接入)。
  # 当前复现包实际控制集为 coverage 代理 (derivative_replication CONTROLS):
  # ln_news_coverage media_hhi bank_scale_ord (panel 实存列)。
  bank_level: [ln_assets, leverage, capital_ratio, npl_ratio, deposit_growth]
  year_level: [gdp_growth, m2_growth]
  fixed_effects: [bank_fe, year_fe]
  # INFER IV-2 (PROJECT_REAUDIT_TOPTIER_T18 2026-06-14): 形式化聚类声明
  # (镜像 bank_media_disagreement spec)。主规格单向 bank 聚类 (CLUSTER_VAR=bank_id,
  # derivative_replication.py), 稳健性对比双向 bank×year。
  cluster: [bank]            # 主规格单向 (G≈200 @ T=18, 足够大 G)
  cluster_robustness:        # 稳健性多聚类对比 (16_table7 / 14_table5 内)
    - bank_only
    - bank_year_twoway

identification:
  baseline: long_panel_within_bank_within_year
  iv:
    primary: bartik_type_iv_full   # Bartik IV (instrument for llm_vote_tone_full per README)
    fallback: bartik_type_iv_ctx
    # ss 轨稳健性镜像 (三轨第三主轨, 2026-06-14; ss = 银行+金科同句共现轨): 内生孪生
    # llm_vote_tone_ss 配同句 Bartik 工具 bartik_type_iv_ss, 与 full/ctx 轨各自
    # just-identified 并排; 严禁 full×ctx×ss 合成 Hansen J overid (机械 _ctx→_ss swap)。
    ss_mirror: [bartik_type_iv_ss]

# 推断/多重检验纪律 (INFER IV-2, PROJECT_REAUDIT_TOPTIER_T18 2026-06-14)。
# 形式化 confirmatory vs exploratory 边界 + family 定义 (非 RCT 预注册, 观测性研究
# 顶刊不强制 OSF/PAP — List-Shaikh-Xu 2019 EE / Olken 2015 JEP); 此块声明单一
# confirmatory 主规格, 把替代测度/双轨/异质性归为 exploratory, 配 FWER 校正口径。
inference:
  confirmatory:
    # 单一预设主规格: strat_diff_n5 (N=5 TF-IDF char) → tobin_q (上市行特许权价值)
    treatment: strat_diff_n5
    outcome: tobin_q
    spec: "reghdfe tobin_q_w strat_diff_n5 $controls, absorb(bank_id year) vce(cluster bank_id)"
    one_sided_prediction: "差异化 → 市场势力 → 特许权价值上升 (β > 0); 全样本通道 funding_cost β < 0"
  exploratory:  # 标 robustness/exploratory, 不与 confirmatory 同权 (减弱 LPU/p-hacking 暴露)
    - "N-邻敏感性 strat_diff_n{3,4,6,7} (14_table5a; Bresnahan-Reiss 1991)"
    - "alternative treatment strat_sim_max / centroid_diff_* / coherence (各自单跑, 非同时规格)"
    - "ctx 轨 strat_diff_n5_ctx (full/ctx 双轨互为稳健性, 高相关孪生非独立假设)"
    - "ss 轨 strat_diff_n5_ss (银行+金科同句共现轨; full/ctx/ss 三轨互为稳健性, 高相关孪生非独立假设)"
    - "SOE/hub/size/bank_type 子样本异质性 (13_table4 / 17_table8)"
    - "era-stability 分时代稳定性 (18_table9; CY-2)"
  families:  # FWER 校正族 (rwolf/wyoung 在族内校正后 p 进 esttab)
    n_neighbor: [strat_diff_n3, strat_diff_n4, strat_diff_n5, strat_diff_n6, strat_diff_n7]
    centroid: [centroid_diff_tfidf_c, centroid_diff_tfidf_w, centroid_diff_lda, centroid_diff_emb]
  fwer: romano_wolf   # Romano-Wolf 2005 ECMA (族内多测度同时显著性校正)

# 推断/多重检验纪律 (INFER IV-2, PROJECT_REAUDIT_TOPTIER_T18 2026-06-14)。
# 形式化 confirmatory vs exploratory 边界 + family 定义 (非 RCT 预注册, 观测性研究
# 顶刊不强制 OSF/PAP — List-Shaikh-Xu 2019 EE / Olken 2015 JEP); 此块声明单一
# confirmatory 主规格, 把替代测度/双轨/异质性归为 exploratory, 配 FWER 校正口径。
inference:
  confirmatory:
    # 单一预设主规格: strat_diff_n5 (N=5 TF-IDF char) → tobin_q (上市行特许权价值)
    treatment: strat_diff_n5
    outcome: tobin_q
    spec: "reghdfe tobin_q_w strat_diff_n5 $controls, absorb(bank_id year) vce(cluster bank_id)"
    one_sided_prediction: "差异化 → 市场势力 → 特许权价值上升 (β > 0); 全样本通道 funding_cost β < 0"
  exploratory:  # 标 robustness/exploratory, 不与 confirmatory 同权 (减弱 LPU/p-hacking 暴露)
    - "N-邻敏感性 strat_diff_n{3,4,6,7} (14_table5a; Bresnahan-Reiss 1991)"
    - "alternative treatment strat_sim_max / centroid_diff_* / coherence (各自单跑, 非同时规格)"
    - "ctx 轨 strat_diff_n5_ctx (full/ctx 双轨互为稳健性, 高相关孪生非独立假设)"
    - "SOE/hub/size/bank_type 子样本异质性 (13_table4 / 17_table8)"
    - "era-stability 分时代稳定性 (18_table9; CY-2)"
  families:  # FWER 校正族 (rwolf/wyoung 在族内校正后 p 进 esttab)
    n_neighbor: [strat_diff_n3, strat_diff_n4, strat_diff_n5, strat_diff_n6, strat_diff_n7]
    centroid: [centroid_diff_tfidf_c, centroid_diff_tfidf_w, centroid_diff_lda, centroid_diff_emb]
  fwer: romano_wolf   # Romano-Wolf 2005 ECMA (族内多测度同时显著性校正)

# 网络位置角色 (network-metrics-elevation 2026-06-13; 蓝图 scripts/audit/NETWORK_METRIC_ELEVATION_BLUEPRINT_2026-06-13.md)。
# 与 brokerage 区隔: strategic_diff 用 constraint(嵌入度), brokerage 用 between(经纪位置)。golden-safe; schema no-op。
network_roles:
  control:
    column: bank_constraint   # Burt 结构约束=网络嵌入度 → 区分"文本战略差异"vs"网络孤立"两混淆构念
    framing: embeddedness_confounder
    lit: [Hoberg-Phillips 2016 JPE, Keeley 1990 AER, Burt 1992]
    note: "bank_constraint deg<2→NaN (N-02), listwise 损样本须披露"
  moderator:
    interaction: diff_x_btwn   # = strat_diff_n5 × L.bank_between_cent (既差异化又枢纽=最强护城河)
    status: exploratory   # 交乘内生 → 条件关联 framing 非因果 (审计 STRATDIFF-MOD-1 reject-as-causal)
    framing: production_t18
    lit: [Hoberg-Phillips 2016 JPE, Keeley 1990 AER]
  centrality_missing_convention: zero_fill_offnetwork_disclose_N

event_studies: []  # strategic_diff 主回归是 cross-sectional + Bartik IV; 无 paper-specific event

targets:
  primary_outlet: MS  # Guzman-Li 2023 MS 类比
  ambitious_outlet: MS
  backup_outlet: [SMJ, AMJ, JFQA]
  submission_window: 2027-03-15

sample:  # RR5-1: post-M0.5 v34 panel target (per §3.4 8 paper共用 v34); v3.3.0 baseline = 84 banks × 2 yr × 168 obs
  n_bank_min: 200
  t_year: 18
  obs_target_min: 3000

audit_rounds_target_min: 8

