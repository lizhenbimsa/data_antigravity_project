# Paper spec for brokerage_network (existing, retrofit per plan §5.2.2 M0.1b)
# Derived from papers_assets/brokerage_network/README.md.
# Schema reference: papers/_common/paper_spec_schema.py

paper_id: brokerage_network
spec_version: 2.0.0
status: existing
differentiation_claim: |
  brokerage_network 利用银行在金融科技报道共现网络中的中心性
  (betweenness / constraint / brokerage eigenvector), 通过二阶同业语调 (W²·tone)
  作为一阶溢出 (W·tone) 的工具变量, 识别同业情感溢出对银行绩效的因果效应;
  检验 DCEP / Sandbox 政策冲击下网络位置异质性。
  锚定: Han et al. 2024 RFS + Bramoullé-Djebbari-Fortin 2009 JoE + Manski 1993 RES + Burt 1992。
  跨 paper 区分:
  - 与 P1 (tone): brokerage 用网络中心性 + 二阶 IV; P1 仅 firm-level tone
  - 与 P2 (attention): brokerage 度量同业溢出 + 网络位置; P2 度量 firm-level 曝光
  - 与 P3 (substance): brokerage 不做 W&Z 实质性; 用 tone 溢出
  - 与 P4 (locus): brokerage 不区分 locus
  - 与 benefit_society: brokerage 用网络位置; benefit_society 用 firm-level 态度投影
  - 与 llm_peer: brokerage 用共现网络中心性 (banks 在 fintech 报道中是否共同出现); llm_peer 用 LLM 判定的语义同业关系
  - 与 strategic_diff: brokerage 用网络位置; strategic_diff 用多文本表征差异

outcome:
  primary: roa
  # outcome 重定位 (2026-06-13, 顶刊组合定稿): 本篇身份 = 信息网络位置 → 同业风险
  # 传染。年度数据约束下, 市场法系统性风险 (ΔCoVaR Adrian-Brunnermeier 2016 AER /
  # SRISK Brownlees-Engle 2017 RFS) 需日频收益, 不纳入年度主线, 留作上市行扩展;
  # 年度可构造的传染通道代理:
  #   sigma_roa_5y_rolling   = 盈余波动共变 (网络中心位置 → 风险同步, 与 10/11 篇共享口径)
  #   interbank_liability_share = 同业负债依存度 (年度资产负债表, 系统性关联敞口)
  secondary: [loan_growth, sigma_roa_5y_rolling, interbank_liability_share]
  listed_subsample_extension: [car_3day, delta_covar]  # 需日频, 非年度主线
  enrichment_source: pipeline + 财务面板 ROA/同业负债分项 (M0.5.11); ΔCoVaR 扩展需
    CSMAR daily returns

treatment:
  primary: peer_tone_lag1_full   # 一阶同业溢出 (endogenous)
  alternative: [peer_tone_lag1_ctx]

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务控制 5 列 (ln_assets/
  # leverage/capital_ratio/npl_ratio/deposit_growth) + year_level 宏观 2 列
  # (gdp_growth/m2_growth) 在当前 bank-year panel (40/51) 全为 0 命中 —
  # enrichment pending (M0.5.11 / config/银行面板2007-2025年.xlsx 待接入)。
  # (centrality 3 列 bank_between_cent/bank_constraint/brokerage_eigen_cent 为
  # panel 实存列, 不受影响。) 当前复现包实际控制集为 coverage 代理
  # (derivative_replication CONTROLS): ln_news_coverage media_hhi bank_scale_ord。
  bank_level: [ln_assets, leverage, capital_ratio, npl_ratio, deposit_growth, bank_between_cent,
    bank_constraint, brokerage_eigen_cent]
  year_level: [gdp_growth, m2_growth]
  fixed_effects: [bank_fe, year_fe]

identification:
  baseline: network_2sls_with_centrality
  iv:
    primary: peer_tone_2nd_lag1_full   # 二阶溢出 (Bramoullé 排他性约束)
    fallback: peer_tone_2nd_lag1_ctx
  # ── 网络位置度量层 (network-metrics-elevation 2026-06-13) ──
  # ⚠ 区分两层 (审计 BRK-PRIMARY-1 裁决): 本篇**主识别引擎** = W·tone(endogenous,
  #   treatment.primary) / W²·tone(IV, 上方 iv.primary) 谱滞后; 下列中心度是**网络
  #   位置度量** (不是溢出引擎), 作解释/调节/异质性载体。声明 primary_centrality
  #   是为防审计 P2-12『22 选 3』p-hacking (预注册一个, 其余明确降附录稳健集)。
  primary_centrality: bank_between_cent     # Freeman 1979 介数/桥接 = 唯一直接量化"跨群信息中介(经纪)"的中心度, 与 W·tone 溢出传导同构
  secondary_centrality: brokerage_eigen_cent  # Bonacich 1972 特征向量; 二分图信息枢纽对照 (Han et al. 2024 RFS)
  structural_hole_centrality: bank_constraint  # Burt 1992 结构洞约束 (稳健对照)
  # 其余 19 中心度 = 附录稳健集 (exploratory, 非主检验目标; 任何附录使用须报 Romano-Wolf/sharpened-FDR)
  centrality_battery: [bank_degree_cent, bank_strength_cent, bank_between_cent,
    bank_harmonic_cent, bank_eigen_cent, bank_katz_cent, bank_subgraph_cent,
    bank_cfbetween_cent, bank_clustering, bank_constraint, bank_is_hub,
    bank_ego_density, bank_ci, bank_effective_size, bank_closeness_cent,
    bank_eccentricity, bank_avg_nbr_deg, bank_coreness, net_density_yr,
    net_avg_cluster_yr, net_avg_path_yr, net_degree_gini_yr]

# 网络位置多角色化 (network-metrics-elevation 2026-06-13; 蓝图见
# scripts/audit/NETWORK_METRIC_ELEVATION_BLUEPRINT_2026-06-13.md)。
# 全部消费已落 40/51 panel .dta 的既有列 → golden-safe (零面板数值改动);
# 全部角色 (除 control) **production T=18 (2007-2024) 才有识别功效**, 盘面 T=2 退化
# (实测 endog+IV 双非空仅 28 行单年, hub 子样本 N=4), 模板均 capture-confirm/N-守卫
# 优雅跳过。schema (paper_spec_schema.py) 对本块 no-op → 纯增字段零破坏。
network_roles:
  explanatory:        # 角色1 解释变量 (15_table6) — ⚠ 仅作描述性条件关联, 非因果 (审计 BRK-EXPL-1)
    column: bank_between_cent
    estimator: reghdfe
    framing: conditional_association   # 网络位置内生于媒体覆盖 (P1-5) → 不主张因果
    lit: [Hochberg-Ljungqvist-Lu 2007 JF, El-Khatib-Fogel-Jandik 2015 JFE, Larcker-So-Wang 2013 JAE]
  mediator:           # 角色2 中介 (16_table7) — 探索性附录, 关联分解非因果中介 (审计 BRK-MED-2)
    column: bank_between_cent
    estimator: three_step_regression
    framing: association_decomposition   # 中介内生 → Imai-Keele-Yamamoto 2010 ρ 敏感性必报
    status: exploratory_appendix
    lit: [Imai-Keele-Yamamoto 2010 Stat.Sci., Burt 1992]
  iv:                 # 角色3 工具 (17_table8) — 跨族 over-id, 破解 P1-6 恰好识别不可检验
    endogenous: peer_tone_lag1_full
    instruments: [peer_tone_2nd_lag1_full, prov_leave1out_tone_full]  # 共现族 W² + 地理族同省 LOO (跨族!)
    estimator: ivreghdfe_overid
    forbidden: full_ctx_pooled_J        # 严禁 full+ctx 双支拼一对工具 (同污染→J 零功效, memory loo-ctx-iv)
    lit: [Bramoullé-Djebbari-Fortin 2009 JoE, Leary-Roberts 2014 JF, GPSS 2020 AER, Andrews-Stock-Sun 2019 ARE]
  moderator:          # 角色4 调节 (18_table9) — 2SLS 交乘 (交乘项工具化), 非 OLS (审计 BRK-MOD-4)
    column: brokerage_eigen_cent        # 信息枢纽放大溢出
    interaction: pt_x_brkr              # = peer_tone_lag1 × L.brokerage_eigen_cent (≤32 字符)
    estimator: ivreghdfe_interaction    # 交乘项与主项各配工具 (W²·tone × L.cent)
    lit: [Grieser et al. 2022 JFE, Jackson-Pernoud 2021 ARE, Brambor-Clark-Golder 2006 PA]
  heterogeneity:      # 角色5 异质性 (19_table10) — within-year 分位 + pooled 交乘 2SLS 组间检验
    column: bank_is_hub                 # 主分组 (within-year decile, 非绝对阈值 N-08)
    alternative: bank_constraint        # 结构洞富/贫分位
    estimator: pooled_interaction_2sls  # 组间系数差用交乘 t, 非两列并排
    lit: [Burt 1992, El-Khatib-Fogel-Jandik 2015 JFE, Stock-Yogo 2005]
  firesale:           # 机制 (15_table6b) — 激活休眠孤儿 (审计 N-03/P3-23)
    columns: [brokerage_fire_sale, industry_neg_shock_lag1]  # 同期 industry_neg_shock 年FE下与自身负面率精确共线, 禁用
    estimator: reghdfe
    lit: [Han-Kim-Nanda 2024 RFS, Jackson-Pernoud 2021 ARE]
  # 缺失约定 (审计 N-02): bank_*_cent 不在网兜底 0.0 vs brokerage_eigen_cent 兜底 NaN
  # → 同入一回归致 listwise 样本漂移; 模板须先统一 (01_data_prep replace ... if missing) 或显式披露 N。
  centrality_missing_convention: zero_fill_offnetwork_disclose_N
  external_validity_ref: _shared/A_network_robustness   # P1-3 共现≈peer 外部效度 QAP/dyadic (NET-SHARED-2)

robustness:
  # 22 选 3 p-hacking 防御 (审计 P2-12): 核心系数附录用 wyoung/rwolf2/sharpened-FDR
  # (⚠ rwolf 无 iv()/不支持 ivreghdfe → 用 wyoung 或 rwolf2; T=18 才激活, 盘面注释).
  fwer: romano_wolf
  fwer_impl: [wyoung, rwolf2, sharpened_fdr_anderson_2008]

event_studies:  # DCEP / Sandbox policy shocks (paper-specific)
  - dcep_post   # 数字人民币 (DCEP) 试点扩围
  - sandbox_post  # 金融科技创新监管沙盒

targets:
  primary_outlet: RFS  # Han et al. 2024 RFS 类比
  ambitious_outlet: RFS
  backup_outlet: [JFE, JF, JCF]
  submission_window: 2027-03-15

sample:  # RR5-1: post-M0.5 v34 panel target (per §3.4 8 paper共用 v34); v3.3.0 baseline = 84 banks × 2 yr × 168 obs
  n_bank_min: 200
  t_year: 18
  obs_target_min: 3000

audit_rounds_target_min: 8

