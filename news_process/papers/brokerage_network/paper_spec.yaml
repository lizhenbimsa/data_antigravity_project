# Paper spec for brokerage_network (existing, retrofit per plan §5.2.2 M0.1b)
# Derived from papers_assets/brokerage_network/README.md.
# Schema reference: papers/_common/paper_spec_schema.py

paper_id: brokerage_network
spec_version: 2.0.0
status: existing
differentiation_claim: |
  brokerage_network 利用银行在金融科技报道共现网络中的中心性
  (betweenness / constraint / brokerage eigenvector), 通过二阶同业语调 (W²·tone)
  作为一阶溢出 (W·tone) 的工具变量, 识别同业情感溢出对银行绩效的因果效应;
  检验 DCEP / Sandbox 政策冲击下网络位置异质性。
  锚定: Han et al. 2024 RFS + Bramoullé-Djebbari-Fortin 2009 JoE + Manski 1993 RES + Burt 1992。
  跨 paper 区分:
  - 与 P1 (tone): brokerage 用网络中心性 + 二阶 IV; P1 仅 firm-level tone
  - 与 P2 (attention): brokerage 度量同业溢出 + 网络位置; P2 度量 firm-level 曝光
  - 与 P3 (substance): brokerage 不做 W&Z 实质性; 用 tone 溢出
  - 与 P4 (locus): brokerage 不区分 locus
  - 与 benefit_society: brokerage 用网络位置; benefit_society 用 firm-level 态度投影
  - 与 llm_peer: brokerage 用共现网络中心性 (banks 在 fintech 报道中是否共同出现); llm_peer 用 LLM 判定的语义同业关系
  - 与 strategic_diff: brokerage 用网络位置; strategic_diff 用多文本表征差异

outcome:
  primary: roa
  # outcome 重定位 (2026-06-13, 顶刊组合定稿): 本篇身份 = 信息网络位置 → 同业风险
  # 传染。年度数据约束下, 市场法系统性风险 (ΔCoVaR Adrian-Brunnermeier 2016 AER /
  # SRISK Brownlees-Engle 2017 RFS) 需日频收益, 不纳入年度主线, 留作上市行扩展;
  # 年度可构造的传染通道代理:
  #   sigma_roa_5y_rolling   = 盈余波动共变 (网络中心位置 → 风险同步, 与 10/11 篇共享口径)
  #   interbank_liability_share = 同业负债依存度 (年度资产负债表, 系统性关联敞口)
  secondary: [loan_growth, sigma_roa_5y_rolling, interbank_liability_share]
  listed_subsample_extension: [car_3day, delta_covar]  # 需日频, 非年度主线
  enrichment_source: pipeline + 财务面板 ROA/同业负债分项 (M0.5.11); ΔCoVaR 扩展需
    CSMAR daily returns

treatment:
  primary: peer_tone_lag1_full   # 一阶同业溢出 (endogenous)
  alternative: [peer_tone_lag1_ctx]

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务控制 5 列 (ln_assets/
  # leverage/capital_ratio/npl_ratio/deposit_growth) + year_level 宏观 2 列
  # (gdp_growth/m2_growth) 在当前 bank-year panel (40/51) 全为 0 命中 —
  # enrichment pending (M0.5.11 / config/银行面板2007-2025年.xlsx 待接入)。
  # (centrality 3 列 bank_between_cent/bank_constraint/brokerage_eigen_cent 为
  # panel 实存列, 不受影响。) 当前复现包实际控制集为 coverage 代理
  # (derivative_replication CONTROLS): ln_news_coverage media_hhi bank_scale_ord。
  bank_level: [ln_assets, leverage, capital_ratio, npl_ratio, deposit_growth, bank_between_cent,
    bank_constraint, brokerage_eigen_cent]
  year_level: [gdp_growth, m2_growth]
  fixed_effects: [bank_fe, year_fe]

identification:
  baseline: network_2sls_with_centrality
  iv:
    primary: peer_tone_2nd_lag1_full   # 二阶溢出 (Bramoullé 排他性约束)
    fallback: peer_tone_2nd_lag1_ctx

event_studies:  # DCEP / Sandbox policy shocks (paper-specific)
  - dcep_post   # 数字人民币 (DCEP) 试点扩围
  - sandbox_post  # 金融科技创新监管沙盒

targets:
  primary_outlet: RFS  # Han et al. 2024 RFS 类比
  ambitious_outlet: RFS
  backup_outlet: [JFE, JF, JCF]
  submission_window: 2027-03-15

sample:  # RR5-1: post-M0.5 v34 panel target (per §3.4 8 paper共用 v34); v3.3.0 baseline = 84 banks × 2 yr × 168 obs
  n_bank_min: 200
  t_year: 18
  obs_target_min: 3000

audit_rounds_target_min: 8

# v3.5.0 D2 8-cell decomposition Table 6 — brokerage_network 不用 D2 主回归 (per plan §2.1.6)
# v3.5.1 A1/A3 explicit null (per plan v0.3 §1.3)
tables:
  t6:
  tA7:
    template:
  tA8:
    template: null  # remove-title-track: 标题轨稳健性表已取消
  tA9:
    template:
