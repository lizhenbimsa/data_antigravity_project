# Paper spec for 第 11 篇 — bank_news_clarity (NEW, M0 立项中).
# Authoritative source of truth — pending M0 G0 acceptance.
# Created: 2026-05-18 (DC1 决策: path C — No-SSRN + _ctx G3 严谨路线)
# Schema reference: papers/_common/paper_spec_schema.py
# Audit history: V1 (58 finding) + V2 (90 finding) + V3 (5 DC) + V4 (白话回归 + reframe)
# YAML 风格 (v3.7.0 m10 校准): 见第 10 篇 spec 头部说明.

paper_id: bank_news_clarity
spec_version: 1.0.0
status: new
created: 2026-05-18

differentiation_claim: |
  本 paper 以 *external information environment quality* (媒体报道清晰度,
  mean_clarity_score from You 2018 词典) 度量银行所处的第三方报道环境,
  对银行风险承担 (Z-score / NPL formation / RWA ratio) 的因果效应.

  V4 audit reframe (致命修复): 放弃 "clarity = 银行自身透明度" claim
  (新闻 genre vs 年报 genre 错配致命); 改为 "clarity = 外部观察者感知的
  信息环境质量" — 词表 validity 跟随 *感知者* (储户 / 监管 / 投资者),
  非 *作者* (记者). 与 Bushee 2010 JAR business press as info intermediary 框架对接.

  与现有 9 paper 区分:
  - 与 P1 (bank_fintech_tone): P1 度量 tone *level* (sign); 本 paper 度量
    报道 *clarity* (uncertainty hedging 频率) — 完全不同 textual feature
  - 与 P2 (attention) / P3 (substance) / P4 (locus) / P5 (collab): 这 4 篇
    度量公告内容属性 (intensity / substance / locus / collab); 本 paper 度量
    *表达方式* (clarity / numerical density), meta-level 不同
  - 与 benefit_society: benefit 用 LLM-Embedding 双极锚点投影; 本 paper 用
    词典扫描 + 数值密度, 测量方法完全不同
  - 与 brokerage_network: brokerage 用网络位置 + peer IV; 本 paper 仅
    firm-level clarity, 不涉及网络
  - 与 llm_peer: llm_peer 用语义同业 IV; 本 paper 用会计准则切换 DiD
  - 与 strategic_diff: strategic_diff 用 N-邻 firm distinctness; 本 paper 用
    single-firm clarity, 概念完全不同
  - 与第 10 篇 (bank_media_disagreement, 共享 outcome panel):
    第 10 度量 *cross-outlet dispersion* (multi-outlet variance); 本 paper 度量
    *single-text clarity* (词典扫描) — 不同 textual feature, channel 互补可同时跑

  V4 audit 既有 paper 注解:
  - P5 (bank_fintech_collab) 已用 mean_clarity_score 作 Table A7 robustness;
    本 paper 翻转为 *main treatment*, outcome 完全不同 (P5: m_and_a_fintech;
    本: z_score), 研究问题完全不同 (P5: 战略实施; 本: 信息环境 → 风险承担).

theory:
  primary_anchors:
    - "Loughran & McDonald (2014 JF 69:1643-1671) — readability 测量经典"
    - "Bonsall, Leone, Miller & Rennekamp (2017 JAE 63:329-357) — plain English readability"
    - "Bushman & Williams (2012 JAE 54:1-18) — DIRECT ANCHOR: info → bank risk-taking"
    - "Bushee, Core, Guay & Hamm (2010 JAR 48:1-19) — business press as info intermediary (reframe 依据)"
    - "You, Zhang & Zhang (2018 hhx055) Panel C/D — 中文清晰度词典 (v3.5.1 frozen at D0)"
  secondary_anchors:
    - "Bushman & Williams (2015 JAR 53:511-553) — delayed loss recognition → risk profile"
    - "Davis & Tama-Sweet (2012 CAR 29:804-837) — numerical intensity (complementary clarity); 公式项目自定义 (原引 Hales 2011 系误归)"
    - "Acharya, Anginer & Warburton (2016 RFS, working) — implicit guarantee 框架 (V4 F-P1.1 必加)"
    - "Hwang & Kim (2017 JFE 124(2):373-394) — It pays to write well (writing clarity → pricing)"
    - "You-Zhang (2009 RAST 14:559-586) — 中文 readability 框架原始"
  micro_foundation:  # V4 F-P3.1 修复
    framework: "Bushee 2010 JAR external information environment + Bushman-Williams 2012 JAE bank discretion → risk"
    mechanism: "清晰报道 → 储户 / 监管 / 投资者精准评估风险 → 三 channel discipline → bank risk choices"
    direction_prediction: "ambiguous ex ante (V4 reframe), sample split 揭示"
    channel_decomposition_required: true  # V4 F2.1 必加

outcome:
  primary: z_score                           # 与第 10 篇共享。⚠ 锚点更正 2026-06-10: 资本项用监管 Basel CAR (RWA 加权), 故为 *CAR-based Z-score 变体*, 非 Laeven-Levine 2009 JFE 原版 (后者资本项=账面 equity/total-assets)。投稿前须如实标注为 CAR 变体。
  primary_formula: "(roa + capital_adequacy_ratio) / sigma_roa_5y_rolling"  # 注: capital_adequacy_ratio=监管 CAR, 非 L&L 的 equity/assets
  secondary:
    - npl_formation_rate     # Bushman-Williams 2015 JAR
    - rwa_to_ta_ratio        # Demirgüç-Kunt & Huizinga 2010 JFE
    - sigma_roa_5y_rolling   # Houston 2010 JFE
    - loan_loss_provision_discretion  # ⚠ 更正 2026-06-10: 当前实现是裸 LLP/贷款比率, **非** Bushman-Williams 2012 JAE 的残差式 discretion (残差回归未实现, 模板 12_table3_bw2012_llp_residual 不存在)。投稿前须 (a) 重命名为 loan_loss_provision_ratio 并去 "DIRECT MATCH/discretion" 标注, 或 (b) 实现基本面回归真正产出残差。勿当 BW2012 discretion 呈现。→ 选定路线 (b) (2026-06-13 顶刊组合定稿): 财务面板接入后实现基本面回归 (LLP ~ ΔNPL + L.NPL + 贷款增速 + 盈余前指标) 取残差作真 discretion, 并升为与 z_score 并列的核心通道 — 这是本篇 Bushman-Williams 2012 JAE 直接锚的原始命题 (信息环境 → 计提纪律)。
    # 资本缓冲通道 (2026-06-13 顶刊组合定稿): 透明度 → 市场纪律 → 自愿资本缓冲
    # (capital_buffer = 资本充足率 - 监管最低要求, 年度直接可构造)。
    - capital_buffer
  enrichment_source: "M0.5.x (共享第 10 篇 outcome panel; DC2 dry-run pending)"
  data_feasibility_status: pending  # 与第 10 篇同步
  hierarchy:
    main: z_score
    confirmatory: [npl_formation_rate, rwa_to_ta_ratio, loan_loss_provision_discretion]
    descriptive: sigma_roa_5y_rolling
    p_hacking_guard: "四 confirmatory 方向不一致即视为 null (pre-registration commitment)"

treatment:
  # DC1 决策 (2026-05-18): path C — No-SSRN + _ctx G3 严谨路线 (paper 11)
  governance:
    ssrn_release: false
    g3_unlock: true            # 单作者 + No SSRN + 数据授权 三条件解锁
    main_track: _ctx           # entity-context, Tetlock 2007 JF + L&M 2016 JAR 现代标准
    rationale: "JAE accounting audience 严谨度优先 + entity-attributed sentiment 现代标准; 牺牲早期传播换顶刊接收概率"

  primary: mean_clarity_score_ctx  # ctx 轨 (G3 严谨路线, V4 reframe 后 main)
  primary_construction: |
    Step 1 (现成, stage 22 tone_words.py): 文章级 clarity_score_ctx 独立扫描
        Step 1a: jieba 分词 (v0.42.1 frozen) → tokens
        Step 1b: n_definite_ctx = #(tokens ∩ you_2018 Panel C 388 词)
                 n_ambiguous_ctx = #(tokens ∩ you_2018 Panel D 178 词)
                 n_tokens_ctx = 总 token 数
        Step 1c: frac_definite_ctx = n_definite_ctx / n_tokens_ctx ∈ [0,1]
                 frac_ambiguous_ctx = n_ambiguous_ctx / n_tokens_ctx ∈ [0,1]
                 clarity_score_ctx = frac_definite_ctx - frac_ambiguous_ctx ∈ [-1,+1]
    Step 2 (现成, encode_collab.py::aggregate_clarity_panel): bank-year 加权聚合
        # fix(omni-g-encode-collab-08, 2026-06-11): 旧描述 "w_i = mention_density (默认) 或 1"
        # 与实现不符 (mention_density 在 encode_collab.py 0 命中); 真实权重如下
        权重 w_i = media_authority_weight × herd_weight_ctx (任一缺失回退 1)
        mean_clarity_score_ctx[b,t] = Σ_valid w_i × clarity_score_ctx_i / Σ_valid w_i
        (分母 mask 到 clarity-valid 文章集, fix(clarity-weighted-denom, 2026-06-10))
    Sidecar JSON anchor (frozen): data/processed/v3_5_1_constants.json::median_amb_d0
        (+ median_amb_d0_ctx — ctx 轨自身分布阈值; 首跑 in-sample 计算后冻结,
         后续跑读冻结值, 防 look-ahead 泄漏; fix(omni-known-open-2, 2026-06-11))

  alternative:
    - mean_clarity_score_full       # _full 轨 dual-track robustness
    - mean_clarity_score_ss         # ss 轨 (银行+金科同句共现轨; 三轨 full/ctx/ss 互为稳健性)
    - mean_frac_definite_ctx        # 分母只看确定性词 (You 2018 Panel C 388 词)
    - mean_frac_definite_full
    - frac_amb_articles_ctx         # 二值化指标 (≥ D0 全样本中位数)
    - frac_amb_articles_full
    - mean_num_intensity_ctx        # 数值密度 Davis-Tama-Sweet 2012 CAR (complementary clarity; 原引 Hales 系误归)
    - mean_num_intensity_full
    # nonpolarity-dims (2026-06-20): 具名实体密度 = specificity 实体面 (Hope-Hu-Lu 2016 RAS),
    # 与 mean_num_intensity (数字面) 互补刻画报道具体性。⚠ 与 avg_specificity 真子集高共线 →
    # 仅作 specificity-face 稳健性对照, 不进下方 clarity composite_pca (避免共线污染主成分)。
    - avg_named_entity_ctx          # complementary specificity (实体面)
    - avg_named_entity_full

  composite_pca:  # V4 F6.2 multiple testing
    method: "PCA on 6 alt clarity measures → 第一主成分作 composite_clarity_index (不含 avg_named_entity: 与 specificity 共线)"
    explained_variance_min: 0.50

  measurement_validity_checks:
    - F-P2.1: "LLM raw response archive (DC3 必修)"
    - F-Adv.2: "LLM training data contamination test (DC4 必修)"
    - genre_transfer_concern: "V4 critical — You 2018 词表为年报设计, 用到新闻 genre 词义可能漂移"
    - genre_mitigation: "reframe 为 external info environment quality, 词表 validity 跟随感知者非作者"
    - htmt_cronbach_alpha: "convergent validity across 6 alt clarity measures (stage 39d 现成)"
    - lexical_discriminant_validity: "v3.5.1 已实现 (pipeline/audit/lexical_discriminant_validity.py)"

controls:
  # fix(omni-g-replication-07, 2026-06-11): bank_level 财务 5 列 (ln_assets/leverage/
  # capital_ratio/npl_ratio/deposit_growth) + credit_rating + year_level 的 shibor/
  # term_spread/lpr_year_avg/gdp_growth/m2_growth 在当前 panel 全为 0 命中 —
  # enrichment pending (config/银行面板2007-2025年.xlsx + 宏观利率/评级序列待接入;
  # term_spread 由 01_data_prep gen 为全缺失 placeholder)。bank_type_id 非 panel
  # 原生列: 01_data_prep 从主 panel 字符串列 bank_type encode 派生。
  bank_level:
    - ln_assets
    - leverage
    - capital_ratio
    - npl_ratio
    - deposit_growth
    - n_articles               # 媒体覆盖量
    - is_soe                   # V4 F-P1.1 implicit guarantee 必加
    - bank_type_id             # 4 类
    - credit_rating            # 上市子样本可得 (V4 F5.x mitigation: 非上市 missing 处理)
  year_level:
    - gdp_growth
    - m2_growth
    - shibor
    - term_spread              # 10y - 1y 国债利差
    - lpr_year_avg             # 2019+
  fixed_effects: [bank_fe, year_fe, province_fe, bond_type_fe]
  cluster: [bank, year]
  cluster_robustness:
    - bank_only
    - bank_year_twoway
    - province_year_twoway
    - bank_province_year_threeway

identification:
  baseline: long_panel_within_bank_within_year
  # 2026-06-13 IV 落地: 候选多依赖外部数据 (准则切换事件表 / Wind 基建 /
  # 毕业生供给); 当前语料即可计算并已物化的是媒体笔法构成 IV —
  # outlet_style_clarity_iv_full/_ctx (iv_extensions.py::
  # compute_outlet_composition_iv):
  #   基期 outlet 报道份额 (冻结, GPSS 2020 AER share 外生性) ×
  #   各 outlet 当年文章级 clarity_score 的 LOO 均值 (剔除焦点银行自身
  #   报道; 媒体笔法 house-style 持久且外生于单家被报道银行:
  #   Gentzkow & Shapiro 2010 Econometrica; Dougal et al. 2012 RFS)。
  # 白话: 报道你的媒体爱不爱用模糊词是媒体自己的文风, 不由你这家银行
  #   当年的经营好坏决定 — 基期媒体组合的"平均文风"推动你被写得清楚
  #   与否, 却不直接进入你的风险结果方程。
  # accounting_standard_switch_did 等候选保留, M5 first-stage 后赛马。
  iv:
    primary: outlet_style_clarity_iv_ctx     # main_track=_ctx (governance 同步)
    fallback: outlet_style_clarity_iv_full
    # ss 轨稳健性镜像 (三轨第三主轨, 2026-06-14; ss = 银行+金科同句共现轨): 内生孪生
    # mean_clarity_score_ss 配同句 outlet 笔法工具 outlet_style_clarity_iv_ss, 与
    # full/ctx 轨各自 just-identified 并排; 严禁 full×ctx×ss 合成 Hansen J overid
    # (机械 _ctx→_ss swap)。
    ss_mirror: [outlet_style_clarity_iv_ss]
  iv_candidates:  # V4 F4.2 修复 (放弃记者轮换 IV — institution 不存在)
    accounting_standard_switch_did:  # PRIMARY candidate (Bushman-Williams 2012 JAE 范式同源)
      events:
        - "2017-01-01: IFRS 9 / 金融工具准则"
        - "2018-04-27: 资管新规"
        - "2014-07-01: 监管检查标准变化"
      treatment: "pre-period clarity × post-event dummy (intensity DiD, not staggered)"
      caveat: "V4 F4.x 注意: 这是 intensity DiD 不是 staggered DiD (技术更正)"
    wind_data_infra_depth:
      construction: "城市级 Wind / 同花顺数据基础设施覆盖深度 (与第 10 篇共享 IV 基础设施)"
      cross_paper_concern: "V4 F12.2 与第 10 篇共享 IV → portfolio-wide IV catalog 需互斥论证"
    journalist_education_supply:
      construction: "本省财经新闻专业毕业生供给 (exogenous labor supply shock to clarity)"
      data_source: "TBD: 教育部财经新闻专业本科 / 硕士招生数据"
    weibo_finance_kol_concentration:
      construction: "本省财经类微博 KOL 集中度 (媒体竞争代理)"
      caveat: "V4 F4.x 警告: 与金融发展水平相关, exclusion 风险中等"
    media_outlet_ma_events:
      events: ["2014 上海报业重组", "2018 财新独立", "2020 财经类媒体合并潮"]
      treatment: "quasi-experimental shock to outlet diversity → clarity 间接影响"
  parallel_trends_test:
    required: true
    estimators: [callaway_santanna_2021, de_chaisemartin_2020]
  placebo_test:
    rationale: "clarity 应只影响外部融资 / 风险信号 channel, 不应直接影响内部经营 (同期 ROA)"
    caveat: "V4 R1 警告: 此 placebo 同时验证两 construct (透明度 vs 记者水平), 解释需谨慎"

# 推断纪律 (PROJECT_REAUDIT_TOPTIER_T18_2026-06-14 INFER IV-2, P2; 镜像 controls.cluster 块)。
# 形式化区分 confirmatory (单一预设主规格) vs exploratory (其余测度/加权/异质性),
# 并定义 multiple-testing family 与 FWER 校正口径, 治理"海量回归无纪律"质疑。
# 注: List-Shaikh-Xu/Olken 是 RCT 预注册标准; 顶刊对观测研究不强制 OSF/PAP,
# 故此处为内部 confirmatory/exploratory 声明 + family 定义, 非外部预注册承诺。
inference:
  confirmatory:
    primary_treatment: mean_clarity_score_ctx  # 单一主处理 (main_track=_ctx, G3 严谨路线)
    primary_outcome: z_score                    # 单一主因变量 (hierarchy.main)
    primary_spec: long_panel_within_bank_within_year + bank_fe + year_fe + two-way cluster(bank, year)
    single_hypothesis: "媒体报道清晰度 (外部信息环境质量) → 银行风险承担 (方向 ambiguous ex ante, sample split 揭示)"
  exploratory:  # robustness / 探索性, 非 co-equal headline
    - "6 alt clarity measures (PCA composite + 各分量)"
    - "三轨 full / ctx / ss (互为稳健性高相关孪生, 非独立假设; ss = 银行+金科同句共现轨)"
    - "5-way heterogeneity (SOE / listed / capital / type / period)"
    - "5 IV cross-validation + alt outcomes (NPL / RWA / LLP discretion)"
  multiple_testing:
    families:
      - name: alt_clarity_measures
        members: "6 alt measures (treatment.alternative)"
        correction: "Romano-Wolf 2005 FWER (rwolf2) 校正后 p 进 esttab"
      - name: heterogeneity_subsamples
        members: "5 heterogeneity dimensions"
        correction: "Westfall-Young / wyoung battery (镜像 brokerage/20)"
    fwer_method: romano_wolf_or_westfall_young
    references: ["Romano-Wolf 2005 ECMA", "Westfall-Young 1993", "List-Shaikh-Xu 2019 EE (RCT 范式, 仅参照)", "Anderson 2008 JASA"]
  cluster_primary: [bank, year]   # = controls.cluster (two-way; G_bank≈200, G_year=13)
  small_g_inference:
    concern: "year 维 G=13 偏小; province / cohort 子样本 G 更小"
    remedy: "boottest wild-cluster bootstrap (Roodman et al. 2019 SJ) 用于小 G 聚类层; few-treated 时 ritest / Conley-Taber 2011"

sample:
  # 2026-06-01 provisional wiring: 补 canonical 键 n_bank_min / t_year (= target_min),
  # 与其余 10 篇 paper_spec 及 schema 测试 (test_sample_block_complete) 对齐。
  n_bank_min: 200                # = n_bank_target_min (canonical schema 键)
  t_year: 13                     # = t_year_target (canonical schema 键)
  n_bank_target_min: 200
  n_bank_target_max: 500
  t_year_target: 13
  obs_target_min: 4000
  obs_target_max: 6500
  selection_criteria:
    require_year_2007_2024_at_least_5_years: true
    corporate_action_handling: "M&A / 改制 / 接管 → 单独处理"
    new_entrant_handling: "short-panel banks robustness subsample"
    survivorship_bias_robustness: required
  fallback_paths:  # V4 F-D.1 修复, 与第 10 篇共享
    alpha: "DC2 dry-run ≥ 70% → 全 outcome 设计 (Z-score + NPL + RWA + LLP discretion)"
    beta:  "DC2 dry-run 40-70% → drop RWA + LLP discretion, 保留 Z-score + NPL"
    gamma: "DC2 dry-run < 40% → 退回 ROA + NPL ratio, 撤回 risk-taking 框架"

heterogeneity:
  - dimension: SOE_vs_non_SOE
    rationale: "implicit guarantee 差异 (Acharya 2016 RFS)"
  - dimension: listed_vs_non_listed
    rationale: "上市子样本有 credit_rating control + 分析师覆盖, 非上市无, channel 强度可能不同"
  - dimension: high_vs_low_capital_adequacy
    rationale: "regulatory headroom 差异"
  - dimension: bank_type_4_category
    categories: [国有, 股份制, 城商, 农商]
    rationale: "differential risk technology"
  - dimension: sub_period
    sub_periods: [2007-2011, 2012-2015, 2016-2019, 2020-2024]
    rationale: "regime shift (V4 F-Comp.3)"

robustness_battery:
  - multi_treatment_measure: "6 alt clarity measures (PCA composite + 各分量)"
  - multi_outcome: "Z-score / NPL formation / RWA / LLP discretion 横向交叉验证"
  - alt_iv: "5 IV cross-validation"
  - placebo_random_bank_id: "randomize bank ID 1000 次"
  - sub_period: "4 个 sub-period 子样本"
  - drop_top_6_banks: "排除国有大行 (V4 F-P1.2)"
  - weighted_regression: "asset-weighted vs unweighted vs drop top 6"
  - winsorization: "1% / 5% / 不 winsorize 三档"
  - cross_country_placebo: "US bank Compustat + Bog Index readability (V4 F-Comp.4)"
  - llm_contamination_holdout: "pre/post LLM training cutoff (V4 F-Adv.2)"
  - covid_drop_2020Q2_2021Q2: "外生 COVID shock 排除 (V4 F-Edge.3)"
  - dual_track_full_vs_ctx: "_full 与 _ctx 主回归对照"
  - genre_concern_subsample: "drop short articles (n_tokens < 100) 测试词表 noise"

# 网络位置角色 (network-metrics-elevation 2026-06-13; 蓝图 scripts/audit/NETWORK_METRIC_ELEVATION_BLUEPRINT_2026-06-13.md)。
# provisional; 与第10篇共享 outlet-style IV 须互斥论证 (F12.2)。golden-safe; schema no-op。
network_roles:
  control:
    columns: [bank_degree_cent, brokerage_eigen_cent]   # 清晰度部分由"哪些媒体报道你"驱动 → 控网络曝光位置后 clarity→risk 才干净 (信息中介)
    framing: information_environment_confounder
    lit: [Bushman-Williams 2012 JAE, Bushee et al. 2010]
  centrality_missing_convention: zero_fill_offnetwork_disclose_N

event_studies:
  - 2017-01-01  # IFRS 9 / 金融工具准则 (clarity exogenous shock)
  - 2018-04-27  # 资管新规
