# Portfolio framing / salami 治理 (PROJECT_REAUDIT_TOPTIER_T18_2026-06-14 PORT SAL-2, P2)。
# 第 11 篇 (本篇) 与第 10 篇 (bank_media_disagreement) 共享同一 outcome panel/z_score, spec
# 自承"channel 互补可同时跑"——referee 会提 least-publishable-unit 质疑。明确两篇为
# 差异化卫星而非可合并的同一研究: 构念、IV、文献、审稿池各不相同, 故各自独立成篇。
portfolio_framing:
  shared_outcome_panel: true              # 两篇共享 z_score / NPL / RWA outcome panel (M0.5.x)
  sibling_paper: bank_media_disagreement  # 第 10 篇
  distinct_construct: "single-text clarity (词典扫描可读性, 信息环境的 *清晰度* 维度)"
  sibling_construct: "cross-outlet tone variance (multi-outlet 信息分歧, 信息环境的 *离散度* 维度)"
  distinct_iv: outlet_style_clarity_iv     # outlet house-style 清晰度 LOO 暴露
  sibling_iv: outlet_disp_exposure_iv      # outlet house-style 立场极端度 LOO 暴露 (须互斥论证 F12.2)
  distinct_literature: "Loughran-McDonald 2014 JF + Bonsall et al. 2017 JAE + Bushee et al. 2010 JAR (readability 谱系)"
  sibling_literature: "Diether-Malloy-Scherbina 2002 JF + Cookson-Niessner 2020 JF + Antweiler-Frank 2004 JF (disagreement 谱系)"
  distinct_review_pool: JAE               # 本篇 clarity → accounting 审稿池
  sibling_review_pool: RFS                # 第 10 篇 cross-outlet variance → finance 审稿池
  cross_reference_required: true           # 两篇 manuscript 互引一次, 明示共享数据基础设施 + 构念分工
  non_merge_rationale: |
    构念 (readability vs variance)、IV 机制 (笔法清晰度 vs 立场极端度)、文献谱系
    (readability vs disagreement)、目标审稿池 (JAE/accounting vs RFS/finance) 四重不同;
    两篇各自有独立可证伪的方向预测 (本篇三 channel 异质性; 第 10 篇 Granger 双向)。
    合并选项 (单篇 "Media Information Environment Quality and Bank Risk-Taking" + PCA composite)
    在 portfolio audit 已评估为可选战略而非必需; 当前两篇 status=new 卡 G0, 无 manuscript,
    referee 无从拒未写之稿。如 G3 前两篇均未独立站稳, 再行合并。

