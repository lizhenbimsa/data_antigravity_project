[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-process"
version = "2.1.0"
description = "Bank-fintech news -> bank-year panel data pipeline (v2.1.0 / phase-9-baseline + Plan P0-P2 follow-up)."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }

# Plan P2-8 (2026-05-09): runtime dependencies 从 requirements.txt 迁入此处.
# 历史注释 "Runtime deps are managed via requirements.txt for now" 已不再
# 适用 — 在没有 dependencies 段的情况下 ``pip install news_process`` 不会
# 安装任何运行时包, 导致 (a) 项目无法作为真包发布, (b) 新机器复现需手动
# 跑 requirements.txt, (c) lock-file 工具 (uv/pip-compile) 无法基于
# pyproject 解析依赖图.
#
# 版本范围相比原 requirements.txt 已收紧:
#   - transformers<6 → <5  (5.x 与 4.x 有 API 破坏性变更, 实测在 4.41+)
#   - pyarrow<24 → <22  (历史 18→24 的范围跨 6 个大版本过宽)
#   - psutil<8 → <7
# 其它库保持原有范围 (经实测兼容).
#
# requirements.txt 仍然保留作为 pip-only 用户的 fallback 入口, 但 single
# source of truth 已从 requirements.txt 迁至此处. requirements.lock (由
# pip-compile 生成) 是真正的可重现性基线 — 见 README §2.1.
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pyarrow>=18.0.0,<22.0.0",
    "ftfy>=6.1.0,<7.0.0",
    "opencc-python-reimplemented>=0.1.7,<0.2.0",
    "selectolax>=0.3.0,<1.0.0",
    "jieba>=0.42.1,<1.0.0",
    "pyahocorasick>=2.0.0,<3.0.0",
    "datasketch>=1.6.0,<2.0.0",
    "joblib>=1.3.0,<2.0.0",
    "psutil>=5.9.0,<7.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "PyYAML>=6.0,<7.0",
    "aiohttp>=3.8.0,<4.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.41.0,<5.0.0",
    "sentence-transformers>=5.0.0,<6.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "scipy>=1.14.0,<2.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "xlsxwriter>=3.1.0,<4.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    # Plan-r3 P2-12: 模糊匹配优先 rapidfuzz (MIT, 活跃维护, C++ 实现);
    # thefuzz + python-Levenshtein 保留作向后兼容 fallback (canonicalization.py
    # try rapidfuzz then fall back).
    "rapidfuzz>=3.0.0,<5.0.0",
    "thefuzz>=0.22.0,<1.0.0",
    "python-Levenshtein>=0.21.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.2,<9.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0,<5.0",
    "linkify-it-py>=2.0,<3.0",
    "sphinx-autodoc-typehints>=2.0,<4.0",
    "sphinx-copybutton>=0.5,<1.0",
    "sphinxcontrib-mermaid>=0.9,<2.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# Only treat the `news_process` namespace and its sub-packages as packages.
# This keeps setuptools from trying to discover root-level files like
# `00_preprocessing.py` (their digit-prefixed names are not legal Python
# identifiers and would otherwise crash package discovery).
include = ["news_process*"]
exclude = [
    "tests*",
    "scripts*",
    "data*",
    "logs*",
    "stata*",
    "papers_assets*",
    "models*",
    "papers*",  # 见下方 NOTE: 此条匹配 *仓库根 papers/* 旧 PDF 资产, 而非 news_process/papers/ 代码包
]
namespaces = false

# NOTE on `papers/` collision (Plan P3-12 时态修正, 2026-05-09):
# 历史的"仓库根 ``papers/``"目录在 v1.x 用作论文 PDF 归档. 自 Phase 3 (v2.0.0)
# 起, 同名代码包 ``news_process/papers/`` 已落地, 非代码资产搬到 ``papers_assets/``.
# 上方 ``exclude = [..., "papers*"]`` 排除的是仓库根 (前缀匹配), 而代码包
# ``news_process/papers/`` 由 ``include = ["news_process*"]`` 命中, 二者不冲突.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

# Plan-r3 P2-13: ruff lint config 落到 pyproject.toml (此前 ci.yml 内联,
# 仅 --select E9,F63,F7,F82,F401, 错过大量正确性问题).
[tool.ruff]
target-version = "py310"
line-length = 120  # 高于 PEP-8 默认 79, 容忍长 docstring 和长 SQL/正则 literal
exclude = [
    "scripts/audit/_replan_v5_evidence",  # 一次性 LLM 调试探针, 不入 lint
    "**/__pycache__",
    ".pytest_cache",
    ".tmp",
    ".test_tmp",
    "data",
    "data_excel",
    "logs",
    "models",
    "papers_assets",
]

[tool.ruff.lint]
# 启用集合: PEP-8 errors / pyflakes / bugbear / pyupgrade / simplify /
# 模块导入排序 (I). 高风险类 (F601 / B023 / F811 / B033) 已在 P0-2 + P2-13
# 中清零, ruff CI 接入后自动防回归.
select = ["E", "F", "B", "UP", "SIM", "I"]
ignore = [
    "E501",   # line-too-long: 923 处大量来自长 docstring/SQL/正则, 强行折行损伤可读性
    "F541",   # f-string-missing-placeholders: 193 处, 主要是 logger.info(f"==="*70) 之类
    "E402",   # module-import-not-at-top: 138 处, thin shim 与测试 sys.path.insert 后
              # import 是有意设计 (Phase 5a/7a/7b)
    "UP015",  # redundant-open-modes: 69 处, 'r' 显式更可读
    "SIM105", # suppressible-exception: 21 处, 显式 try/except 比 contextlib.suppress 更易读
    "B007",   # unused-loop-control-variable: 24 处, 多见于解构 (for _, row in ...)
    "B905",   # zip-without-explicit-strict: 25 处, 大多 zip() 长度天然相等, 强 strict
              # 反引入新 ValueError; 高风险 zip 已在审查中专门处理
    "B904",   # raise-without-from: 8 处, 大部分是 RuntimeError(f"...{e}") 已含原因
    "SIM117", # multiple-with-statements: 7 处, 嵌套 with 在 IO 场景更清晰
    "UP006",  # non-pep585-annotation: 33 处, 我们当前 typing.Dict/List 与 dict/list 混用,
              # 全切到 PEP-585 留待 v3.0 (Plan-r3 P3-16 与 god-function docstring 同期)
    "UP035",  # deprecated-import: 14 处, 同上
    "UP045",  # non-pep604-annotation-optional: 6 处, 同上
]
per-file-ignores = { "tests/**/*.py" = ["B017", "B011"] }  # 测试中允许 assert raises Exception 等

[tool.ruff.lint.isort]
known-first-party = ["news_process"]
