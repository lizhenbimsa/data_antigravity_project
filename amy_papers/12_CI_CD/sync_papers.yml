# GitHub Actions — 论文自动同步工作流
# ============================================================
# 触发条件: 私有仓库推送到 papers/ 目录时
# 功能: 自动同步 papers/ 到公共仓库，并更新 README 论文索引
# ============================================================

name: Sync Papers to Public Repository

on:
  push:
    paths:
      - 'papers/**'
    branches:
      - main
  workflow_dispatch:     # 允许手动触发

permissions:
  contents: write

jobs:
  sync-papers:
    name: Sync Papers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. 检出私有仓库
        uses: actions/checkout@v4
        with:
          path: private-repo
          fetch-depth: 0

      - name: 2. 检出公共仓库
        uses: actions/checkout@v4
        with:
          repository: LocalProject/AutoPaper
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo
          fetch-depth: 0

      - name: 3. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 4. 检测变更的论文
        id: detect
        run: |
          cd private-repo
          # 获取本次推送变更的论文目录
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- papers/ \
            | grep -oP 'papers/paper_\d+' | sort -u | head -20)
          echo "changed_papers=$CHANGED" >> $GITHUB_OUTPUT
          echo "📝 变更的论文: $CHANGED"

      - name: 5. 运行质量扫描
        run: |
          cd private-repo
          python 12_CI_CD/quality_scan.py papers/ --changed "${{ steps.detect.outputs.changed_papers }}"

      - name: 6. 同步论文文件
        run: |
          cd private-repo
          python 12_CI_CD/publisher.py \
            --source papers/ \
            --target ../public-repo/ \
            --changed "${{ steps.detect.outputs.changed_papers }}"

      - name: 7. 更新 README 论文索引
        run: |
          cd public-repo
          python ../private-repo/12_CI_CD/publisher.py --update-readme

      - name: 8. 提交并推送到公共仓库
        run: |
          cd public-repo
          git config user.name "AutoPaper Bot"
          git config user.email "paper-bot@socialcatalystlab.org"
          
          git add -A
          
          # 生成提交消息
          PAPERS="${{ steps.detect.outputs.changed_papers }}"
          PAPER_IDS=$(echo "$PAPERS" | tr '\n' ', ' | sed 's/papers\///g')
          
          if git diff --cached --quiet; then
            echo "ℹ️ 无变更需要提交"
          else
            git commit -m "📄 Publish papers: ${PAPER_IDS}" \
              -m "Auto-synced from production repository"
            git push
            echo "✅ 推送成功"
          fi

  # ---- 质量检查 Job ----
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: sync-papers
    
    steps:
      - name: 验证发布完整性
        uses: actions/checkout@v4
        with:
          repository: LocalProject/AutoPaper
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}

      - name: 检查必需文件
        run: |
          for dir in paper_*/v*/; do
            if [ -d "$dir" ]; then
              PAPER=$(basename $(dirname "$dir"))
              REQUIRED="paper.md metadata.json initial_plan.md"
              for f in $REQUIRED; do
                if [ ! -f "${dir}${f}" ]; then
                  echo "⚠️ 缺失: ${dir}${f}"
                fi
              done
            fi
          done
          echo "✅ 完整性检查完成"
