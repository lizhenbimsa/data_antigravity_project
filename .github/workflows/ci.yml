name: news_process CI

# Plan P2-9 (2026-05-09): 引入 GitHub Actions CI, 把 pytest baseline
# 从"人工本地跑"提升为"PR 自动门槛". 矩阵覆盖 ubuntu + windows 两个
# OS 与 Python 3.11/3.13 两个版本 (3.10 是 requires-python 下界, 3.13
# 是当前主开发环境). torch / transformers / sentence-transformers 在
# CI 安装会触发约 4 GB 下载, 故只在 ubuntu-3.13 单元里跑全套, 其余三
# 个矩阵单元只跑非-DL 测试 (排除 test_23_tone_berts.py) 控制时长.
#
# baseline 锁定在 800 passed / 2 skipped (Plan-r3 P0-2 +2 + P1-8 +12 后达成,
# 在 round 2 P1-5 sidecar 化基础上叠加).
# 任何降低此数的 PR 必须在 CHANGELOG 显式说明并由 reviewer approve.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

defaults:
  run:
    shell: bash

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.dl-suite }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
        dl-suite: ['light']
        include:
          # 完整 DL 套件仅在 ubuntu-3.13 跑一次 (含 torch/transformers)
          - os: ubuntu-latest
            python-version: '3.13'
            dl-suite: 'full'
            primary: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            news_process/pyproject.toml
            news_process/requirements.txt

      - name: Install runtime deps (light - skip torch/transformers)
        if: matrix.dl-suite == 'light'
        run: |
          python -m pip install --upgrade pip
          # 跳过 torch/transformers/sentence-transformers (~4 GB) 以控制 CI 时长.
          # 这三个包只被 stage 23 BERT 情感分析及其 tests/test_23_tone_berts.py 使用.
          pip install \
            "pandas>=2.2.0,<3.0.0" \
            "numpy>=2.0.0,<3.0.0" \
            "pyarrow>=18.0.0,<22.0.0" \
            "ftfy>=6.1.0,<7.0.0" \
            "opencc-python-reimplemented>=0.1.7,<0.2.0" \
            "selectolax>=0.3.0,<1.0.0" \
            "jieba>=0.42.1,<1.0.0" \
            "pyahocorasick>=2.0.0,<3.0.0" \
            "datasketch>=1.6.0,<2.0.0" \
            "joblib>=1.3.0,<2.0.0" \
            "psutil>=5.9.0,<7.0.0" \
            "tqdm>=4.65.0,<5.0.0" \
            "PyYAML>=6.0,<7.0" \
            "aiohttp>=3.8.0,<4.0.0" \
            "tiktoken>=0.7.0,<1.0.0" \
            "scikit-learn>=1.5.0,<2.0.0" \
            "scipy>=1.14.0,<2.0.0" \
            "matplotlib>=3.8.0,<4.0.0" \
            "xlsxwriter>=3.1.0,<4.0.0" \
            "openpyxl>=3.1.0,<4.0.0" \
            "thefuzz>=0.22.0,<1.0.0" \
            "python-Levenshtein>=0.21.0,<1.0.0" \
            "python-dotenv>=1.0.0,<2.0.0" \
            pytest pytest-asyncio

      - name: Install runtime deps (full - via pyproject)
        if: matrix.dl-suite == 'full'
        run: |
          python -m pip install --upgrade pip
          # 走 pyproject.toml [project] dependencies 的真实安装路径
          # (Plan P2-8 后 single source of truth)
          pip install -e ./news_process pytest pytest-asyncio

      - name: Run tests (light - exclude DL tests)
        if: matrix.dl-suite == 'light'
        working-directory: ./news_process
        run: |
          # 排除 test_23_tone_berts.py (依赖 torch + transformers).
          # 同时排除 test_25_audit.py 中需要 sklearn TfidfVectorizer 大模型的子测试 — 已通过 sklearn 安装解决.
          # baseline (light 模式): 800 - 14 (test_23) = 786 passed
          python -m pytest tests/ \
            --ignore=tests/test_23_tone_berts.py \
            -q --tb=short

      - name: Run tests (full - all 800)
        if: matrix.dl-suite == 'full'
        working-directory: ./news_process
        run: |
          # baseline (full 模式): 800 passed / 2 skipped (post Plan-r3 P0-2 + P1-8).
          # SKIP 数为 2 即可 (剩 1 Unix-only fcntl test + 1 Win 空字符串路径).
          python -m pytest tests/ -v --tb=short
          # baseline 校验: passed 必须 >= 800 (允许更多 -- 任何新增测试无害,
          # 但低于 800 视为回归; 真正紧锁可改为 -ne 800 但会让正向新测 PR 失败).
          python -m pytest tests/ 2>&1 | tee /tmp/pytest_summary.txt
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/pytest_summary.txt | head -1 | grep -oE '[0-9]+')
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          if [ "$PASSED" -lt 800 ]; then
            echo "::error::baseline 退化: passed=$PASSED < 800"
            exit 1
          fi

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        # ruff 配置如未来加入, 在 pyproject.toml 中. 当前仅做 syntax / import 健康检查
        # (--select E9,F63,F7,F82 等价 flake8 -E9 集合, 仅捕错误级别问题)
        run: |
          ruff check news_process/ \
            --select E9,F63,F7,F82,F401 \
            --ignore F401 \
            --exclude '__pycache__,*.pyc,news_process/data,news_process/data_excel,news_process/logs'
