name: news_process CI

# Plan P2-9 (2026-05-09): 引入 GitHub Actions CI, 把 pytest baseline
# 从"人工本地跑"提升为"PR 自动门槛". 矩阵覆盖 ubuntu + windows 两个
# OS 与 Python 3.11/3.13 两个版本 (3.10 是 requires-python 下界, 3.13
# 是当前主开发环境). torch / transformers / sentence-transformers 在
# CI 安装会触发约 4 GB 下载, 故只在 ubuntu-3.13 单元里跑全套, 其余三
# 个矩阵单元只跑非-DL 测试 (排除 test_23_tone_berts.py) 控制时长.
#
# 本地 baseline 814 passed / 2 skipped (含完整 data/processed/, 见 news_process/__init__.py:62).
# CI baseline 780 (full job 阈值, 实测 782 - 2 buffer): CI 上 data/processed/ 被
# .gitignore 排除, 32 个数据依赖测试 (panel_reproducibility ×18 + dual_track ×14)
# 自动 skip. 任何降低 CI baseline 的 PR 必须在 CHANGELOG 显式说明并由 reviewer approve.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

defaults:
  run:
    shell: bash

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.dl-suite }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
        dl-suite: ['light']
        include:
          # 完整 DL 套件仅在 ubuntu-3.13 跑一次 (含 torch/transformers)
          - os: ubuntu-latest
            python-version: '3.13'
            dl-suite: 'full'
            primary: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            news_process/requirements.txt

      - name: Install runtime deps (light - skip torch/transformers)
        if: matrix.dl-suite == 'light'
        run: |
          python -m pip install --upgrade pip
          # 跳过 torch/transformers/sentence-transformers (~4 GB) 以控制 CI 时长.
          # 这三个包只被 stage 23 BERT 情感分析及其 tests/test_23_tone_berts.py 使用.
          pip install \
            "pandas>=2.2.0,<3.0.0" \
            "numpy>=2.0.0,<3.0.0" \
            "pyarrow>=18.0.0,<22.0.0" \
            "ftfy>=6.1.0,<7.0.0" \
            "opencc-python-reimplemented>=0.1.7,<0.2.0" \
            "selectolax>=0.3.0,<1.0.0" \
            "jieba>=0.42.1,<1.0.0" \
            "pyahocorasick>=2.0.0,<3.0.0" \
            "datasketch>=1.6.0,<2.0.0" \
            "joblib>=1.3.0,<2.0.0" \
            "psutil>=5.9.0,<7.0.0" \
            "tqdm>=4.65.0,<5.0.0" \
            "PyYAML>=6.0,<7.0" \
            "aiohttp>=3.8.0,<4.0.0" \
            "tiktoken>=0.7.0,<1.0.0" \
            "scikit-learn>=1.5.0,<2.0.0" \
            "scipy>=1.14.0,<2.0.0" \
            "matplotlib>=3.8.0,<4.0.0" \
            "xlsxwriter>=3.1.0,<4.0.0" \
            "openpyxl>=3.1.0,<4.0.0" \
            "rapidfuzz>=3.0.0,<5.0.0" \
            "thefuzz>=0.22.0,<1.0.0" \
            "python-Levenshtein>=0.21.0,<1.0.0" \
            "python-dotenv>=1.0.0,<2.0.0" \
            pytest pytest-asyncio

      - name: Install runtime deps (full - via pyproject)
        if: matrix.dl-suite == 'full'
        run: |
          python -m pip install --upgrade pip
          # 走 pyproject.toml [project] dependencies 的真实安装路径
          # (Plan P2-8 后 single source of truth)
          pip install -e . pytest pytest-asyncio

      - name: Editable install smoke
        if: matrix.dl-suite == 'full'
        run: |
          python -c "import news_process; import news_process.core.dag; print(news_process.__version__)"

      - name: Run tests (light - exclude DL tests)
        if: matrix.dl-suite == 'light'
        working-directory: ./news_process
        run: |
          # 排除 test_23_tone_berts.py (依赖 torch + transformers).
          # baseline (CI light): 768 passed / ~34 skipped (实测 2026-05-09).
          # CI 上 news_process/data/processed/ 不在 (.gitignore 排除), 32 个数据依赖
          # 测试 (test_panel_reproducibility ×18 + test_dual_track ×14) 自动 skip.
          # 故 CI 实际 passed << 本地 baseline 814; 不校验数字, 仅依赖 pytest exit code.
          python -m pytest tests/ \
            --ignore=tests/test_23_tone_berts.py \
            -q --tb=short

      - name: Run tests (full - DL + non-DL)
        if: matrix.dl-suite == 'full'
        working-directory: ./news_process
        run: |
          # baseline (CI full, post-Wave-1 / 2026-05-13): 823 passed / 34 skipped.
          # 演进: 782 (2026-05-09) -> 823 (本地 855 + Wave 1 T1.1a 新增 4 BERT 确定性 test
          #                                 - CI 上 32 个数据依赖测试自动 skip).
          # 本地完整数据下 baseline 855 / 2 (见 news_process/CLAUDE.md L16), CI 上
          # news_process/data/processed/ 被 .gitignore 排除, 32 个数据依赖测试自动 skip:
          #   - test_panel_reproducibility ×19 (Phase 0 + Wave 0 +1 + Wave 1 +1 golden snapshot)
          #   - test_dual_track ×14 (BERT/LLM 双轨一致性, 需 21/22/23/40_*.parquet)
          # 加上 test_pipeline_lock::test_empty_lock_directory 永久 skip (input-validation
          # 不属于 PipelineLock 职责) = 34 skipped (33 + 1 unix-only).
          # baseline 校验阈值: 820 = 实测 823 - 3 buffer (Wave 0/1 收尾后收紧 780 -> 820,
          # 把可容忍回归从 43 测试压到 3, 见 PR <next>).
          # Plan-r3 round-3 review R2: 合并为一次 run 同时 stdout + tee 文件.
          # set -o pipefail 让 pytest 失败码能正确传播 (默认 tee 退出 0 会掩盖 pytest 失败).
          set -o pipefail
          python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest_summary.txt
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/pytest_summary.txt | head -1 | grep -oE '[0-9]+')
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          if [ "$PASSED" -lt 820 ]; then
            echo "::error::baseline 退化: passed=$PASSED < 820 (CI full baseline, post Wave 0/1)"
            exit 1
          fi

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: ruff check (full config, advisory)
        # 走 pyproject.toml 中的 [tool.ruff.lint] 全集 (Plan-r3 P2-13).
        # 当前 ~375 处 lint 警告 (主要 I001 import 排序 + F401 未用 import),
        # 不阻塞 CI; 仅作开发者可见的代码质量信号.
        continue-on-error: true
        run: |
          ruff check news_process --output-format=concise || true

      - name: ruff check (high-risk classes, blocking)
        # Plan-r3 P0-2 + P2-13 已清零的高风险 lint, CI 严格防回归:
        #   F601: dict-key-repeated  (silent override 风险)
        #   F821: undefined-name (运行到该路径才炸的拼写/变量名错误)
        #   B023: closure-uses-loop-var (delayed-execution 翻车风险)
        #   F811: redefined-while-unused (重复 import / 重复 def)
        #   B033: duplicate-set-items ({0, 0.0, 1, 1.0} 类型混淆)
        run: |
          ruff check news_process \
            --select F601,F821,B023,F811,B033 \
            --no-cache
