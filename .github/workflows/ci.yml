name: news_process CI

# Plan P2-9 (2026-05-09): 引入 GitHub Actions CI, 把 pytest baseline
# 从"人工本地跑"提升为"PR 自动门槛". 矩阵覆盖 ubuntu + windows 两个
# OS 与 Python 3.11/3.13 两个版本 (3.10 是 requires-python 下界, 3.13
# 是当前主开发环境). torch / transformers / sentence-transformers 在
# CI 安装会触发约 4 GB 下载, 故只在 ubuntu-3.13 单元里跑全套, 其余三
# 个矩阵单元只跑非-DL 测试 (排除 test_23_tone_berts.py) 控制时长.
#
# 本地 baseline 权威值见 news_process/CLAUDE.md L16 (随 batch 持续上升, 不在此 hard-code).
# CI full 阈值 820: 远低于实测 (~870-900, 各 batch 增量后) 以容忍噪声.
# 任何降低 CI baseline 的 PR 必须在 CHANGELOG 显式说明并由 reviewer approve.
# CI 上 data/processed/ 被 .gitignore 排除, ~35 个数据依赖测试 (panel_reproducibility
# ×19 + dual_track ×14 + bert_panel_invariant ×2) 自动 skip.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

defaults:
  run:
    shell: bash

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.dl-suite }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
        dl-suite: ['light']
        include:
          # 完整 DL 套件仅在 ubuntu-3.13 跑一次 (含 torch/transformers)
          - os: ubuntu-latest
            python-version: '3.13'
            dl-suite: 'full'
            primary: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            news_process/requirements.txt

      - name: Install runtime deps (light - skip torch/transformers)
        if: matrix.dl-suite == 'light'
        run: |
          python -m pip install --upgrade pip
          # 跳过 torch/transformers/sentence-transformers (~4 GB) 以控制 CI 时长.
          # 这三个包只被 stage 23 BERT 情感分析及其 tests/test_23_tone_berts.py 使用.
          pip install \
            "pandas>=2.2.0,<3.0.0" \
            "numpy>=2.0.0,<3.0.0" \
            "pyarrow>=18.0.0,<22.0.0" \
            "ftfy>=6.1.0,<7.0.0" \
            "opencc-python-reimplemented>=0.1.7,<0.2.0" \
            "selectolax>=0.3.0,<1.0.0" \
            "jieba>=0.42.1,<1.0.0" \
            "pyahocorasick>=2.0.0,<3.0.0" \
            "datasketch>=1.6.0,<2.0.0" \
            "joblib>=1.3.0,<2.0.0" \
            "psutil>=5.9.0,<7.0.0" \
            "tqdm>=4.65.0,<5.0.0" \
            "PyYAML>=6.0,<7.0" \
            "aiohttp>=3.8.0,<4.0.0" \
            "tiktoken>=0.7.0,<1.0.0" \
            "scikit-learn>=1.5.0,<2.0.0" \
            "scipy>=1.14.0,<2.0.0" \
            "matplotlib>=3.8.0,<4.0.0" \
            "xlsxwriter>=3.1.0,<4.0.0" \
            "openpyxl>=3.1.0,<4.0.0" \
            "rapidfuzz>=3.0.0,<5.0.0" \
            "thefuzz>=0.22.0,<1.0.0" \
            "python-Levenshtein>=0.21.0,<1.0.0" \
            "python-dotenv>=1.0.0,<2.0.0" \
            pytest pytest-asyncio

      - name: Install runtime deps (full - via pyproject)
        if: matrix.dl-suite == 'full'
        run: |
          python -m pip install --upgrade pip
          # 走 pyproject.toml [project] dependencies 的真实安装路径
          # (Plan P2-8 后 single source of truth)
          pip install -e . pytest pytest-asyncio

      - name: Editable install smoke
        if: matrix.dl-suite == 'full'
        run: |
          python -c "import news_process; import news_process.core.dag; print(news_process.__version__)"

      - name: Run tests (light - exclude DL tests)
        if: matrix.dl-suite == 'light'
        working-directory: ./news_process
        run: |
          # 排除 test_23_tone_berts.py (依赖 torch + transformers).
          # CI light: pytest exit code only (不校验具体 passed 数字).
          # 实测数量级 ~830-850 passed / ~34-36 skipped (随 batch 而变);
          # 本地权威 baseline 见 news_process/CLAUDE.md L16.
          # CI 上 news_process/data/processed/ 不在 (.gitignore 排除),
          # ~35 个数据依赖测试 (panel_reproducibility ×19 + dual_track ×14
          # + bert_panel_invariant ×2) 自动 skip.
          python -m pytest tests/ \
            --ignore=tests/test_23_tone_berts.py \
            -q --tb=short

      - name: Run tests (full - DL + non-DL)
        if: matrix.dl-suite == 'full'
        working-directory: ./news_process
        run: |
          # baseline (CI full, post Wave 2 b1 / 2026-05-13 / run 25798445649): 857 passed / 36 skipped.
          # 演进: 782 (2026-05-09 v2.1.0) -> 823 (Wave 1 +4 BERT) -> 829 (Batch P0 +6 cache)
          #      -> 845 (V8 +11 paper-smoke + 5 log-prune) -> 857 (Wave 2 b1 +12 iv_did).
          # 本地完整数据下 baseline 891 / 2 (权威见 news_process/CLAUDE.md L16, 不再在此 hard-code).
          # CI 上 news_process/data/processed/ 被 .gitignore 排除, ~35 数据依赖测试自动 skip:
          #   - test_panel_reproducibility ×19 (Phase 0 + Wave 0/1 golden snapshot)
          #   - test_dual_track ×14 (BERT/LLM 双轨一致性, 需 21/22/23/40_*.parquet)
          #   - test_bert_panel_invariant ×2 (Wave 4 fail-fast, 需 23_bert_tone.parquet)
          # 加上 test_pipeline_lock 系列 2 个平台 skip = 36 total.
          # baseline 校验阈值: 820 (= 857 - 37 buffer; commit 7275612 从旧 780 收紧;
          # 此处阈值不随每个 batch 自动 bump, 仅当出现 silent regression 风险时再调).
          # Plan-r3 round-3 review R2: 合并为一次 run 同时 stdout + tee 文件.
          # set -o pipefail 让 pytest 失败码能正确传播 (默认 tee 退出 0 会掩盖 pytest 失败).
          set -o pipefail
          python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest_summary.txt
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/pytest_summary.txt | head -1 | grep -oE '[0-9]+')
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          if [ "$PASSED" -lt 820 ]; then
            echo "::error::baseline 退化: passed=$PASSED < 820 (CI full baseline, post Wave 0/1)"
            exit 1
          fi

  manuscript_compile_en:
    # Q1.1a (post-v3.2.0 multi-paper extension, 2026-05-15):
    # Verify 5 papers' English manuscripts compile with xelatex + biber.
    # Chinese manuscripts (ZH) tracked by manuscript_compile_zh job (separate,
    # requires Noto CJK font apt-install). EN job is dependency-light and acts
    # as the primary "manuscript syntax" gate.
    name: manuscript (xelatex EN, ${{ matrix.paper }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper: [bank_fintech_tone, benefit_society, brokerage_network, llm_peer, strategic_diff]
    steps:
      - uses: actions/checkout@v4
      - name: Compile EN manuscript
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: news_process/papers_assets/${{ matrix.paper }}/drafts/en/
          root_file: manuscript.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: false
          continue_on_error: false
      - name: Upload EN PDF artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-en-${{ matrix.paper }}
          path: news_process/papers_assets/${{ matrix.paper }}/drafts/en/manuscript.pdf
          retention-days: 14

  manuscript_compile_zh:
    # Q1.1b (post-v3.2.0 multi-paper extension, 2026-05-15):
    # Chinese manuscripts require CJK font support. Ubuntu doesn't ship SimSun
    # (Windows font); preamble_zh.tex declares SimSun, but we apt-install
    # fonts-noto-cjk and fontspec's fontconfig fallback substitutes Noto Serif
    # CJK SC at compile time. If preamble fails on font lookup, the job
    # surfaces the LaTeX log via the upload-artifact below.
    name: manuscript (xelatex ZH, ${{ matrix.paper }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper: [bank_fintech_tone, benefit_society, brokerage_network, llm_peer, strategic_diff]
    continue-on-error: true  # ZH gate is advisory until font fallback stabilized
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk fonts-noto-cjk-extra fonts-arphic-uming \
            fonts-arphic-ukai fonts-wqy-zenhei fonts-wqy-microhei
          fc-cache -fv
      - name: Compile ZH manuscript
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: news_process/papers_assets/${{ matrix.paper }}/drafts/zh/
          root_file: manuscript.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: false
          continue_on_error: true
      - name: Upload ZH log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-zh-log-${{ matrix.paper }}
          path: news_process/papers_assets/${{ matrix.paper }}/drafts/zh/manuscript.log
          retention-days: 14
      - name: Upload ZH PDF artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-zh-${{ matrix.paper }}
          path: news_process/papers_assets/${{ matrix.paper }}/drafts/zh/manuscript.pdf
          retention-days: 14

  lock_replay:
    # P2-b B-lock (2026-05-15): 复现性防线 — 把 requirements.lock 精确版本
    # 装到 CI 环境, 验证 fast 测试在 lock-pinned 环境下通过. 由 pip-compile
    # 在本地生成 lock; 此 job 验证 lock 依然 "装得动 + 跑得通". lock 与
    # pyproject.toml dependencies 漂移会导致此 job 红 (历史: 2026-05-15
    # commit 5a21614 加 pyreadstat 后 lock 滞后 5 天才被本 job 暴露).
    #
    # 范围:
    #   - 单一 ubuntu-3.13 (与 full job 对齐, 避免 windows runner 重复)
    #   - 安装 lock + editable news_process (--no-deps 保留 lock 精确版本)
    #   - pytest -m fast (conftest.py auto-mark; ~759 unit tests, ~30s)
    #
    # 与 test (full) job 的区别:
    #   - test (full): pyproject.toml dependency range 安装 → 验证 range 合法
    #   - lock_replay : requirements.lock 精确版本安装 → 验证 lock fresh
    #
    # DL 包 (torch/transformers/sentence-transformers ~4 GB) 在 lock 里,
    # 首次安装慢; pip cache 命中后续 PR 快 (cache key = lock 文件 hash).
    #
    # 此 job 红的修复路径 (lock stale):
    #   1. 从 repo root: pip-compile pyproject.toml \
    #        --output-file=news_process/requirements.lock \
    #        --no-emit-index-url --resolver=backtracking --upgrade
    #   2. 提交 requirements.lock + 同时审阅是否有 transitive 升级超出 pyproject range
    #   3. 详见 docs/错误处理和重试机制实施指南.md §1.3
    name: lock-replay (ubuntu-3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: news_process/requirements.lock
      - name: Install from requirements.lock
        run: |
          python -m pip install --upgrade pip
          pip install -r news_process/requirements.lock
          pip install -e . --no-deps
          # pytest / pytest-asyncio 在 pyproject [optional-dependencies].dev 中,
          # 不在 lock 里. 显式 pin 与 pyproject dev range 一致, 避免装 latest 版.
          pip install "pytest>=7.0.0,<9.0.0" "pytest-asyncio>=0.20,<2.0"
      - name: Smoke import under lock-pinned env (blocking)
        # 阻断性: lock 装不动或装出来不能 import → 此 step 必失败.
        # 这是 lock_replay 的核心防线: 锁定文件本身的 install 一致性.
        run: |
          python -c "import news_process; from news_process.core import dag; print('lock_replay OK:', news_process.__version__, len(dag.STAGES_MAIN), 'stages')"

      - name: Run fast tests (lock-pinned env, advisory)
        # 必须从 repo root 跑 (CLAUDE.md L65-69): 部分测试 (e.g.
        # test_iss_llm_score_subset.py) 硬编码相对路径 'news_process/data/...';
        # 从 news_process/ 子目录跑会双前缀解析为 news_process/news_process/...
        #
        # advisory (continue-on-error): CI 上 news_process/data/processed/ 被
        # .gitignore 排除 (parquet 不在 git), 数据依赖测试会 fail. 这与
        # light/full job 现状对齐 (那两个 job 靠 PASSED>=820 阈值容忍). lock_replay
        # 在这一阶段标记 advisory, 后续若引入 panel fixture 注入再去掉.
        continue-on-error: true
        run: |
          python -m pytest news_process/tests/ -m fast -q --tb=short

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: ruff check (full config, advisory)
        # 走 pyproject.toml 中的 [tool.ruff.lint] 全集 (Plan-r3 P2-13).
        # 当前 ~375 处 lint 警告 (主要 I001 import 排序 + F401 未用 import),
        # 不阻塞 CI; 仅作开发者可见的代码质量信号.
        continue-on-error: true
        run: |
          ruff check news_process --output-format=concise || true

      - name: ruff check (high-risk classes, blocking)
        # Plan-r3 P0-2 + P2-13 已清零的高风险 lint, CI 严格防回归:
        #   F601: dict-key-repeated  (silent override 风险)
        #   F821: undefined-name (运行到该路径才炸的拼写/变量名错误)
        #   B023: closure-uses-loop-var (delayed-execution 翻车风险)
        #   F811: redefined-while-unused (重复 import / 重复 def)
        #   B033: duplicate-set-items ({0, 0.0, 1, 1.0} 类型混淆)
        run: |
          ruff check news_process \
            --select F601,F821,B023,F811,B033 \
            --no-cache
